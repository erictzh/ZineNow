<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Md to PDF Converter</title>

  <!-- Google Fonts: Inter, Merriweather, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS (CDN / JIT) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!--
    Dark-mode palette, extending Tailwind's default theme rather than
    replacing it (layout/spacing/typography utilities are untouched —
    only these color + font tokens are added). Values are now taken
    verbatim from component-kit.css (linked below), which is the actual
    source of truth for this app's colors/components going forward —
    styles.css itself no longer defines its own competing --ui-* tokens
    (see the note in that file). `canvas` (#dbdbdb) is the one token
    component-kit.css doesn't define, since it's specific to this app's
    live-preview backdrop rather than a general UI color — kept here as
    the "light neutral fill... deliberately breaking from the dark
    theme" so the eBook page floating on it can stay pure white.
  -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              DEFAULT: '#171312',
              alt: '#241d1bb0',
              card: '#201918e8',
              terminal: '#100d0c6b',
            },
            line: '#3f3634',
            fg: {
              DEFAULT: '#e9e9ee',
              muted: '#9a9ca6',
            },
            accent: {
              DEFAULT: '#dd531a',
              hover: '#bf6836',
              text: '#dd531a',
            },
            canvas: '#dbdbdb',
            success: '#8fe28f',
            warning: '#ffcf6b',
            highlight: '#7fd7ff',
          },
          fontFamily: {
            ui: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"Segoe UI"',
              'Roboto',
              'Helvetica',
              'Arial',
              'sans-serif',
            ],
            mono2: ['"SFMono-Regular"', 'Consolas', '"Liberation Mono"', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>

  <!--
    Component kit — colors, fonts, and reusable component styles (top
    bar, buttons, tabs, cards, toggle switch, inputs, log panel, preview
    pane), pulled verbatim from a sibling app and adopted here as the
    priority basis for anything overlapping: where this app already had
    a similar color or component, the kit's version wins. Linked before
    styles.css so styles.css can layer this app's own page-specific
    layout on top without fighting it on specificity — see the note at
    the top of styles.css for exactly what still lives there.
  -->
  <link rel="stylesheet" href="component-kit.css" />

  <!-- marked.js — Markdown parsing (version pinned so a future release can't change behavior under you) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!--
    Document import libraries — used only by the sidebar's "Upload"
    button (see pdfGenerator.js's convertDocxToMarkdown/
    convertEpubToMarkdown). Unlike marked.js above, the app works fine
    without these ever loading; they're only touched if you actually
    import a .docx or .epub file, and pdfGenerator.js's requireGlobal()
    gives a clear error naming whichever one didn't load rather than
    failing silently. All three pinned to a specific version, same
    reasoning as marked.js above.
  -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!--
    pdf-lib — assembles a real PDF from the rasterized page images used
    only by "Send to ZineArranger" (see handleSendToZineArranger in
    App.jsx and renderRasterizationDocument in pdfGenerator.js). The main
    "Download PDF eBook" export doesn't use this at all — it drives the
    browser's own print engine instead (see the note on exportToPdf in
    pdfGenerator.js). Same library ZEditor uses for its own PDF export,
    version pinned like the other libraries above.
  -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <!--
    DOMPurify — used only by renderRasterizationDocument (pdfGenerator.js)
    to sanitize the markdown-rendered HTML before "Send to ZineArranger"
    rasterizes it. That path's hidden iframe needs the allow-same-origin
    sandbox flag for html2canvas to work at all (confirmed: it silently
    hangs without it), which is exactly the flag combination the live
    preview's iframe (see renderHtmlDocument) deliberately avoids, since
    allow-scripts + allow-same-origin would let a <script> smuggled in
    through pasted raw HTML (marked.js passes raw HTML through by
    default) reach out and manipulate this app. Sanitizing the HTML first
    removes that content outright, which holds regardless of sandboxing —
    a stronger guarantee than isolation alone, and the reason it's safe
    to grant that iframe allow-same-origin here specifically.
  -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!--
    Note: this app does NOT use html2pdf.js/html2canvas for PDF export.
    That rasterization-based approach turned out to be unreliable (a
    well-known html2canvas bug clips off-screen-rendered content), so
    pdfGenerator.js instead drives the browser's own native print engine
    (window.print(), page sized via @page CSS) to produce the PDF —
    higher quality output (real selectable text, not a raster image)
    with no extra library needed. See the comment on exportToPdf() in
    pdfGenerator.js for the full explanation.
  -->

  <!-- React 18 (UMD), version pinned. App.jsx below is precompiled to plain
       React.createElement calls (see the note at the top of that file), so
       no in-browser JSX transpiler (Babel) is loaded or needed at all. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <!-- App styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full w-full bg-ink text-fg font-ui antialiased">
  <div id="root" class="h-screen w-screen"></div>

  <!--
    Default typography/page values, exposed as window.MD2eBookDefaultConfig.
    Loaded before pdfGenerator.js (which reads it) for the same file://
    reason as App.jsx below — see the comment at the top of
    defaultConfig.json for the full explanation.
  -->
  <script src="defaultConfig.json"></script>

  <!-- Plain JS: PDF/HTML generation engine, exposed on window.MD2eBook -->
  <script src="pdfGenerator.js"></script>

  <!--
    The sample Markdown shown on first load, exposed as
    window.MD2eBookSampleMarkdown. Loaded before App.jsx (which reads
    it) for the same file:// reason — see the comment at the top of
    sample.md.
  -->
  <script src="sample.md"></script>

  <!--
    React application. App.jsx is loaded here as a normal script — not
    via a text/babel tag with a src, and not via a manual fetch() of it
    either. Both of those approaches read App.jsx's contents at runtime
    (via an internal XHR or fetch), which most browsers silently block
    when this page is opened directly as a file (file://) instead of
    through a web server — the read comes back empty, nothing renders,
    and the page is left blank with no visible error. Because App.jsx
    ships here pre-transpiled to plain JavaScript, a normal <script src>
    works instead: that kind of resource load isn't subject to the same
    restriction, so this page runs identically whether it's opened by
    double-clicking it on disk or served from a real web host.
  -->
  <script src="App.jsx"></script>
</body>
</html>
