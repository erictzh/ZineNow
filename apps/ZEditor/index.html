<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEditor</title>
<!-- Installable app (PWA): theme colour and icons here; shared/js/pwa/register.js adds the
     manifest link and registers sw.js, but only over http(s) — from file:// it does nothing. -->
<meta name="theme-color" content="#171312">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="../../shared/js/pwa/register.js" defer></script>

<!-- React 18 (UMD) from CDN via normal <script> tags — that kind of load
     isn't subject to file://'s fetch restriction, unlike fetch()/XHR. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<!-- pdf.js (rendering) and pdf-lib (Export: assembles the rendered page
     images into a PDF) — one local copy shared by every ZineNow app. -->
<script src="../../shared/vendor/pdfjs/build/pdf.js"></script>
<script src="../../shared/vendor/pdf-lib/pdf-lib.min.js"></script>
<!-- fontkit: lets pdf-lib embed font files, so Export can write text as real text. -->
<script src="../../shared/vendor/fontkit/fontkit.umd.min.js"></script>

<!-- Styles, in cascade order (later files win ties). Suite-wide tokens and components first. -->
<link rel="stylesheet" href="../../shared/styles/tokens.css">
<link rel="stylesheet" href="../../shared/styles/buttons.css">
<link rel="stylesheet" href="../../shared/styles/topbar.css">
<link rel="stylesheet" href="../../shared/styles/tabs.css">
<link rel="stylesheet" href="../../shared/styles/toggle.css">
<link rel="stylesheet" href="../../shared/styles/scrollbars.css">
<link rel="stylesheet" href="../../shared/styles/displaySettings.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/topbar.css">
<link rel="stylesheet" href="styles/overlays.css">
<link rel="stylesheet" href="styles/sidebar.css">
<link rel="stylesheet" href="styles/compose.css">
<link rel="stylesheet" href="styles/format-panel.css">
<link rel="stylesheet" href="styles/layers.css">
<link rel="stylesheet" href="styles/font-combobox.css">
<link rel="stylesheet" href="styles/dialogs.css">
<link rel="stylesheet" href="styles/responsive.css">
<link rel="stylesheet" href="styles/touch.css">
<link rel="stylesheet" href="styles/display.css">
</head>
<body>
  <div id="root"></div>

  <!-- The app itself. Edit src/, then run `npm run build` to regenerate this
       file (see docs/ARCHITECTURE.md). It's a plain classic script so the
       page still works opened straight from disk. -->
  <script src="dist/app.js"></script>
</body>
</html>
