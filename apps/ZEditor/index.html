              <div className="ze-crop-handle ze-crop-handle-se" onMouseDown={(e) => startCropCornerResize("se", e)} />
            </div>
          </div>
        );
      }

      // Grayscale always reuses the one global filter (no colors to
      // differ). Duotone reuses it too UNLESS this image has its own
      // duotone colors, in which case it gets its own uniquely-id'd
      // <filter> rendered right below, since the global one is tuned to
      // the page's duotone colors, not necessarily this image's.
      const hasOwnDuotone = ann.filter && ann.filter.type === "duotone";
      const duotoneFilterId = hasOwnDuotone ? "ze-filter-duotone-img-" + ann.id : "ze-filter-duotone";
      const cssFilter =
        filterType === "grayscale" ? "url(#ze-filter-grayscale)" :
        filterType === "duotone" ? `url(#${duotoneFilterId})` : undefined;
      const frameStyle = {};
      const edgeOutline = imageEdgeOutline(ann);
      if (edgeOutline) frameStyle.clipPath = `path("${edgeOutline}")`;
      if (cssFilter) frameStyle.filter = cssFilter;
      const ownDuotoneDarkRgb = hasOwnDuotone ? hexToRgb(imgFilter.darkColor || DEFAULT_DUOTONE_DARK) : null;
      const ownDuotoneLightRgb = hasOwnDuotone ? hexToRgb(imgFilter.lightColor || DEFAULT_DUOTONE_LIGHT) : null;

      return (
        <div
          data-ann-id={ann.id}
          className={"ze-ann-image" + (isSelected ? " is-selected" : "") + (ann.locked ? " is-locked" : "")}
          style={{ left: ann.x, top: ann.y, width: ann.width, height: ann.height }}
          onMouseDown={(e) => { if (tool === "select") onPress(e, ann); }}
        >
          {/* Shadow sits on this wrapper, outside the edge clip so the clip
              can't cut it off, and away from the resize handle. It stays
              mounted when there's no shadow so toggling one never remounts
              (and blanks) the filter canvas. */}
          <div className="ze-ann-image-shadow" style={boxGroupStyle(ann)}>
            {usesFilterCanvas ? (
              <canvas ref={halftoneCanvasRef} style={frameStyle} />
            ) : (
              <div className="ze-ann-image-frame" style={frameStyle}>
                <img
                  src={ann.src}
                  alt=""
                  draggable="false"
                  style={{ position: "absolute", left: -cropX * displayScaleX, top: -cropY * displayScaleY, width: naturalW * displayScaleX, height: naturalH * displayScaleY }}
                />
              </div>
            )}
            <BoxEffectOverlays ann={ann} edgeOutline={edgeOutline} />
          </div>
          {showHandles && <ResizeHandles handles={ALL_RESIZE_HANDLES} onStart={startResize} />}
          {hasOwnDuotone && (
            <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
              <defs>
                <filter id={duotoneFilterId} colorInterpolationFilters="sRGB">
                  <feColorMatrix type="matrix" values={LUMINANCE_MATRIX_VALUES} />
                  <feComponentTransfer>
                    <feFuncR type="linear" slope={(ownDuotoneLightRgb.r - ownDuotoneDarkRgb.r) / 255} intercept={ownDuotoneDarkRgb.r / 255} />
                    <feFuncG type="linear" slope={(ownDuotoneLightRgb.g - ownDuotoneDarkRgb.g) / 255} intercept={ownDuotoneDarkRgb.g / 255} />
                    <feFuncB type="linear" slope={(ownDuotoneLightRgb.b - ownDuotoneDarkRgb.b) / 255} intercept={ownDuotoneDarkRgb.b / 255} />
                  </feComponentTransfer>
                </filter>
              </defs>
            </svg>
          )}
        </div>
      );
    }

    // ---- One freehand stroke (pen or highlighter) -----------------------
    // Rendered as a smoothed SVG path; a dashed bounding box appears around
    // it when selected. The stroke itself only captures clicks in Select
    // tool (pointer-events toggle below) so it doesn't intercept
    // drawing/text clicks meant for the page background.
    function StrokeShape({ ann, tool, isSelected, onPress }) {
      const isHi = ann.tool === "highlighter";
      const color = ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color);
      const width = ann.strokeWidth || (isHi ? HIGHLIGHTER_DEFAULTS.width : PEN_DEFAULTS.width);
      const taper = ann.taper || 0;
      const box = bboxOf(ann);
      const handleMouseDown = (e) => { if (tool === "select") onPress(e, ann); };
      const pickable = tool === "select" && !ann.locked;
      const selectCursor = { cursor: pickable ? "move" : "default" };
      return (
        <React.Fragment>
          {taper > 0 ? (
            <path
              data-ann-id={ann.id}
              d={taperedPathD(ann.points, width, taper)}
              fill={color}
              fillOpacity={isHi ? 0.45 : 1}
              stroke="none"
              style={{ pointerEvents: pickable ? "fill" : "none", ...selectCursor }}
              onMouseDown={handleMouseDown}
            />
          ) : (
            <path
              data-ann-id={ann.id}
              d={smoothPathD(ann.points)}
              fill="none"
              stroke={color}
              strokeWidth={width}
              strokeOpacity={isHi ? 0.45 : 1}
              strokeLinecap="round"
              strokeLinejoin="round"
              style={{ pointerEvents: pickable ? "stroke" : "none", ...selectCursor }}
              onMouseDown={handleMouseDown}
            />
          )}
          {isSelected && (
            <rect
              x={box.x - 6} y={box.y - 6}
              width={box.width + 12} height={box.height + 12}
              fill="none" stroke="#dd531a" strokeDasharray="4 3" strokeWidth="1.5"
              pointerEvents="none"
            />
          )}
        </React.Fragment>
      );
    }

    // ---- Compose canvas — renders the selected page at full size, plus
    // the annotation layer (images + text boxes + freehand strokes) on
    // top of it.
    function ComposeCanvas({
      pdfDocsRef, page, guidesOn, guideFormat, guideMarginIn, guideBleedIn, tool,
      pageFilter, onionGhostSrc, onionSkinOpacity,
      penColor, penWidth, penTaper, highlighterColor, highlighterWidth, highlighterTaper,
      annotations, selectedAnnId, selectedAnnIds, editingAnnId, croppingAnnId,
      onSelectAnnotation, onSelectAnnotations, onMoveAnnotations, onAddText, onAddRect, onAddStroke, onUpdateAnnotation, onEraseStroke, onToggleCrop,
      onStartTextEdit, onFinishTextEdit,
      zoom,
    }) {
      const canvasRef = useRef(null);
      const layerRef = useRef(null);
      const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
      const [dragRect, setDragRect] = useState(null); // the box being dragged out on empty page
      const drawingRef = useRef(null); // in-progress stroke points while the mouse is down
      const [drawTick, setDrawTick] = useState(0); // bumped on every drawing mousemove to force a repaint

      useEffect(() => {
        if (!page) return;
        let cancelled = false;
        (async () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          let w, h;
          if (page.isBlank) {
            const swapped = page.rotation % 180 !== 0;
            w = Math.round((swapped ? page.height : page.width) * MAIN_SCALE);
            h = Math.round((swapped ? page.width : page.height) * MAIN_SCALE);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
          } else {
            const doc = docFor(pdfDocsRef, page);
            if (!doc) return;
            const pdfPage = await doc.getPage(page.pageNumber);
            const viewport = pdfPage.getViewport({ scale: MAIN_SCALE, rotation: page.rotation });
            if (cancelled) return;
            w = viewport.width;
            h = viewport.height;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            await pdfPage.render({ canvasContext: ctx, viewport }).promise;
          }
          if (cancelled) return;
          applyPageFilter(canvas.getContext("2d"), canvas, pageFilter, 1); // background only, same as Export
          setCanvasSize({ width: w, height: h });
        })();
        return () => { cancelled = true; };
      }, [page && page.key, page && page.rotation, pageFilter]);

      function overlayPoint(e) {
        const rect = canvasRef.current.getBoundingClientRect();
        return { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
      }

      function handleOverlayMouseDown(e) {
        if (!page) return;
        if (tool === "pen" || tool === "highlighter") {
          const start = overlayPoint(e);
          const color = tool === "highlighter" ? highlighterColor : penColor;
          const width = tool === "highlighter" ? highlighterWidth : penWidth;
          const taper = tool === "highlighter" ? highlighterTaper : penTaper;
          drawingRef.current = { tool, color, width, taper, points: [[start.x, start.y]] };
          setDrawTick((t) => t + 1);
          trackPointerDrag((ev) => {
            const p = overlayPoint(ev);
            drawingRef.current.points.push([p.x, p.y]);
            setDrawTick((t) => t + 1);
          }, () => {
            if (drawingRef.current && drawingRef.current.points.length > 1) {
              onAddStroke({
                tool: drawingRef.current.tool,
                points: drawingRef.current.points,
                color: drawingRef.current.color,
                strokeWidth: drawingRef.current.width,
                taper: drawingRef.current.taper,
              });
            }
            drawingRef.current = null;
            setDrawTick((t) => t + 1);
          });
          return;
        }
        if (tool === "eraser") {
          const erasedIds = new Set();
          const tryErase = (pt) => {
            annotations.forEach((a) => {
              if (a.type === "stroke" && !a.hidden && !a.locked && !erasedIds.has(a.id) && strokeHitTest(pt, a)) {
                erasedIds.add(a.id);
                onEraseStroke(a.id);
              }
            });
          };
          tryErase([overlayPoint(e).x, overlayPoint(e).y]);
          trackPointerDrag((ev) => {
            const p = overlayPoint(ev);
            tryErase([p.x, p.y]);
          });
          return;
        }
        // Move, Text or Rectangle tool, pressing empty page (the other tools
        // returned above). A click that ends a text edit does only that.
        e.preventDefault();
        if (editingAnnId !== null) {
          onFinishTextEdit();
          onSelectAnnotation(null);
          return;
        }
        const additive = e.shiftKey;
        if (!additive) onSelectAnnotation(null);
        const start = overlayPoint(e);
        let rect = null;
        trackPointerDrag((ev) => {
          const p = overlayPoint(ev);
          if (!rect && Math.hypot(p.x - start.x, p.y - start.y) * zoom <= DRAG_THRESHOLD) return;
          rect = {
            x: Math.min(start.x, p.x), y: Math.min(start.y, p.y),
            width: Math.abs(p.x - start.x), height: Math.abs(p.y - start.y),
          };
          setDragRect(rect);
        }, () => {
          setDragRect(null);
          if (tool === "text") {
            // A click makes a text box that fits its text; a drag sets its width.
            if (rect) onAddText(rect.x, rect.y, Math.max(40, rect.width));
            else onAddText(start.x, start.y);
          } else if (tool === "rect") {
            onAddRect(rect || {
              ...DEFAULT_RECT_SIZE,
              x: start.x - DEFAULT_RECT_SIZE.width / 2,
              y: start.y - DEFAULT_RECT_SIZE.height / 2,
            });
          } else if (rect) {
            onSelectAnnotations(annotationIdsTouching(rect), additive);
          }
        });
      }

      // Measured from what's on screen, so every item type uses its true
      // drawn shape without each needing its own size calculation.
      function annotationIdsTouching(rect) {
        const page = canvasRef.current.getBoundingClientRect();
        const left = page.left + rect.x * zoom, top = page.top + rect.y * zoom;
        const right = left + rect.width * zoom, bottom = top + rect.height * zoom;
        return [...layerRef.current.querySelectorAll("[data-ann-id]")]
          .filter((el) => {
            const box = el.getBoundingClientRect();
            return box.left < right && box.right > left && box.top < bottom && box.bottom > top;
          })
          .map((el) => Number(el.dataset.annId))
          .filter((id) => !annotations.find((a) => a.id === id).locked);
      }

      // The shared press on any item: select it, then drag to move the
      // whole selection. `onPlainClick` runs if the press never became a drag.
      function pressAnnotation(e, ann, onPlainClick) {
        e.preventDefault();
        e.stopPropagation();
        if (editingAnnId !== null && editingAnnId !== ann.id) onFinishTextEdit();
        const current = [selectedAnnId, ...selectedAnnIds].filter((id) => id !== null);
        const wasSelected = current.includes(ann.id);
        if (e.shiftKey || !wasSelected) onSelectAnnotation(ann.id, e.shiftKey);
        if (e.shiftKey && wasSelected) return; // that press just took it out of the selection
        const movingIds = wasSelected ? current : e.shiftKey ? [...current, ann.id] : [ann.id];
        const originals = annotations.filter((a) => movingIds.includes(a.id));
        const dragDelta = dragDeltaFrom(e, zoom);
        let moved = false;
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          if (!moved && Math.hypot(dx, dy) * zoom > DRAG_THRESHOLD) moved = true;
          if (moved) onMoveAnnotations(originals, dx, dy);
        }, () => {
          if (moved) return;
          // Clicking one member of a group, without dragging, narrows to it.
          if (wasSelected && !e.shiftKey && current.length > 1) onSelectAnnotation(ann.id, false);
          if (onPlainClick) onPlainClick();
        });
      }

      if (!page) {
        return (
          <div className="preview-empty">
            No pages yet — load a PDF to get started.
          </div>
        );
      }

      const showHandlesFor = (a) => tool === "select" && a.id === selectedAnnId && selectedAnnIds.length === 0;
      const cursorClass =
        tool === "text" ? "ze-tool-text" :
        (tool === "pen" || tool === "highlighter" || tool === "rect") ? "ze-tool-draw" :
        tool === "eraser" ? "ze-tool-erase" : "";

      // The page is scaled visually; this outer box takes up the scaled
      // size, which is what gives the pane something to scroll.
      return (
        <div className="ze-artboard-zoom" style={{ width: canvasSize.width * zoom, height: canvasSize.height * zoom }}>
        <div className="ze-page ze-page--rendered" style={{ transform: zoom === 1 ? undefined : `scale(${zoom})`, "--ze-zoom": zoom }}>
          <canvas ref={canvasRef} />
          {onionGhostSrc && (
            <img className="ze-onion-ghost" src={onionGhostSrc} alt="" style={{ opacity: onionSkinOpacity }} />
          )}
          <div
            ref={layerRef}
            className={"ze-annotation-layer " + cursorClass}
            style={{ width: canvasSize.width, height: canvasSize.height }}
            onMouseDown={handleOverlayMouseDown}
          >
            {annotations.filter((a) => !a.hidden).map((a) => {
              const isSelected = a.id === selectedAnnId || selectedAnnIds.includes(a.id);
              if (a.type === "image") {
                return (
                  <AnnotationImage
                    key={a.id}
                    ann={a}
                    tool={tool}
                    isSelected={isSelected}
                    showHandles={showHandlesFor(a)}
                    isCropping={a.id === croppingAnnId}
                    onPress={pressAnnotation}
                    onUpdate={onUpdateAnnotation}
                    onToggleCrop={onToggleCrop}
                    pageFilter={pageFilter}
                    zoom={zoom}
                  />
                );
              }
              if (a.type === "rect") {
                return (
                  <AnnotationRect
                    key={a.id}
                    ann={a}
                    tool={tool}
                    isSelected={isSelected}
                    showHandles={showHandlesFor(a)}
                    onPress={pressAnnotation}
                    onUpdate={onUpdateAnnotation}
                    zoom={zoom}
                  />
                );
              }
              if (a.type === "text") {
                return (
                  <AnnotationText
                    key={a.id}
                    ann={a}
                    tool={tool}
                    isSelected={isSelected}
                    isEditing={a.id === editingAnnId}
                    showHandles={showHandlesFor(a)}
                    onPress={pressAnnotation}
                    onStartEdit={onStartTextEdit}
                    onFinishEdit={onFinishTextEdit}
                    onUpdate={onUpdateAnnotation}
                    zoom={zoom}
                  />
                );
              }
              return (
                <svg key={a.id} className="ze-stroke-svg" width={canvasSize.width} height={canvasSize.height}>
                  <StrokeShape ann={a} tool={tool} isSelected={isSelected} onPress={pressAnnotation} />
                </svg>
              );
            })}
            <svg className="ze-stroke-svg" width={canvasSize.width} height={canvasSize.height}>
              {drawingRef.current && (drawingRef.current.taper > 0 ? (
                <path
                  d={taperedPathD(drawingRef.current.points, drawingRef.current.width, drawingRef.current.taper)}
                  fill={drawingRef.current.color}
                  fillOpacity={drawingRef.current.tool === "highlighter" ? 0.45 : 1}
                  stroke="none"
                />
              ) : (
                <path
                  d={smoothPathD(drawingRef.current.points)}
                  fill="none"
                  stroke={drawingRef.current.color}
                  strokeWidth={drawingRef.current.width}
                  strokeOpacity={drawingRef.current.tool === "highlighter" ? 0.45 : 1}
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              ))}
            </svg>
            {dragRect && (
              <div className="ze-drag-rect" style={{ left: dragRect.x, top: dragRect.y, width: dragRect.width, height: dragRect.height }} />
            )}
          </div>
          {guidesOn && canvasSize.width > 0 && (
            <GuidesOverlay
              width={canvasSize.width}
              height={canvasSize.height}
              format={guideFormat}
              marginIn={guideMarginIn}
              bleedIn={guideBleedIn}
            />
          )}
        </div>
        </div>
      );
    }

    // ---- One sidebar thumbnail ------------------------------------------
    function Thumbnail({ p, idx, isSelected, onSelect, onRotate, onDelete, dragHandlers }) {
      return (
        <div
          className={"ze-thumb" + (isSelected ? " is-selected" : "")}
          draggable="true"
          onClick={(e) => onSelect(idx, e.shiftKey)}
          {...dragHandlers}
        >
          <div className="ze-thumb-img-wrap">
            <img src={p.dataUrl} alt={p.isBlank ? "Blank page" : "Page " + p.pageNumber} />
          </div>
          <div className="ze-thumb-footer">
            <span className="ze-thumb-num">{idx + 1}</span>
            <div className="ze-thumb-actions">
              <button
                type="button"
                className="log-btn"
                title="Rotate"
                onClick={(e) => { e.stopPropagation(); onRotate(idx); }}
              >⟳</button>
              <button
                type="button"
                className="log-btn"
                title="Delete"
                onClick={(e) => { e.stopPropagation(); onDelete(idx); }}
              >
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  <path d="M4 7h16" />
                  <path d="M9 7V4h6v3" />
                  <path d="M6 7l1 13h10l1-13" />
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Hover gap between (or around) thumbnails — reveals a line + a
    // floating "+" to insert a blank page at that exact spot. Hover state
    // is pure CSS (:hover), so no extra JS/state is needed for it.
    function PageGap({ onInsert }) {
      return (
        <div
          className="ze-page-gap"
          role="button"
          tabIndex={0}
          title="Add blank page"
          onClick={onInsert}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onInsert(); } }}
        >
          <div className="ze-page-gap-line" />
          <span className="ze-page-gap-btn" aria-hidden="true">+</span>
        </div>
      );
    }

    // ---- Sidebar — page thumbnail strip (Organize) ---------------------
    const EDGE_SCROLL_ZONE = 44; // px from top/bottom edge that triggers scrolling
    const EDGE_SCROLL_SPEED = 4; // px per frame — deliberately slow, not a fast jump

    function Sidebar({ pages, selectedIdx, selectedPageIndices, onSelect, onSelectAll, onRotate, onDelete, onReorder, onLoadClick, onInsertPdfClick, onInsertBlank, loading }) {
      const dragIndexRef = useRef(null);
      const bodyRef = useRef(null);
      const scrollDirRef = useRef(0); // -1 up, 0 idle, 1 down
      const rafRef = useRef(null);
      // { idx, before } — which slot is currently being dragged over, and
      // whether the drop line should sit above (before) or below it.
      const [dragOverInfo, setDragOverInfo] = useState(null);

      function startAutoScroll() {
        if (rafRef.current) return;
        const step = () => {
          const el = bodyRef.current;
          if (el && scrollDirRef.current !== 0) {
            el.scrollTop += scrollDirRef.current * EDGE_SCROLL_SPEED;
          }
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
      }

      function stopAutoScroll() {
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        scrollDirRef.current = 0;
      }

      useEffect(() => stopAutoScroll, []); // safety: cancel any pending loop if the sidebar unmounts mid-drag

      // Attached to the scrollable container itself (not per-thumbnail) so
      // it keeps working no matter which child — a thumbnail or a gap — the
      // cursor happens to be over.
      function handleContainerDragOver(e) {
        const el = bodyRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const distFromTop = e.clientY - rect.top;
        const distFromBottom = rect.bottom - e.clientY;
        if (distFromTop < EDGE_SCROLL_ZONE) {
          scrollDirRef.current = -1;
        } else if (distFromBottom < EDGE_SCROLL_ZONE) {
          scrollDirRef.current = 1;
        } else {
          scrollDirRef.current = 0;
        }
      }

      function dragHandlersFor(idx) {
        return {
          onDragStart: () => { dragIndexRef.current = idx; startAutoScroll(); },
          onDragOver: (e) => {
            e.preventDefault();
            const rect = e.currentTarget.getBoundingClientRect();
            const before = e.clientY < rect.top + rect.height / 2;
            setDragOverInfo({ idx, before });
          },
          onDragLeave: () => setDragOverInfo((cur) => (cur && cur.idx === idx ? null : cur)),
          onDragEnd: () => { dragIndexRef.current = null; setDragOverInfo(null); stopAutoScroll(); },
          onDrop: (e) => {
            e.preventDefault();
            const from = dragIndexRef.current;
            const info = dragOverInfo;
            setDragOverInfo(null);
            dragIndexRef.current = null;
            stopAutoScroll();
            if (from === null || !info || from === idx) return;
            const selection = selectedIdx !== null ? [selectedIdx, ...selectedPageIndices] : selectedPageIndices;
            onReorder(selection.includes(from) ? selection : [from], idx + (info.before ? 0 : 1));
          },
        };
      }

      return (
        <aside className="ze-sidebar">
          <div className="ze-sidebar-head">
            <span>Pages{pages.length > 0 ? " (" + pages.length + ")" : ""}</span>
            <div className="ze-sidebar-head-actions">
              {pages.length === 0 && (
                <button type="button" onClick={onLoadClick} disabled={loading}>
                  {loading ? "Loading…" : "Load PDF"}
                </button>
              )}
              <button type="button" className="log-btn" onClick={onInsertPdfClick} disabled={loading || pages.length === 0} title="Insert another PDF's pages into this document">
                Insert PDF
              </button>
              <button type="button" className="log-btn" onClick={onSelectAll} disabled={loading || pages.length === 0} title="Select every page">
                Select All
              </button>
            </div>
          </div>
          <div className="ze-sidebar-body" ref={bodyRef} onDragOver={handleContainerDragOver}>
            {pages.length === 0 && !loading ? (
              <div className="ze-sidebar-empty">
                No pages yet. Click "Load PDF" to bring in a file.
              </div>
            ) : (
              <div className="ze-thumb-list">
                <PageGap onInsert={() => onInsertBlank(0)} />
                {pages.map((p, idx) => (
                  <React.Fragment key={p.key}>
                    {dragOverInfo && dragOverInfo.idx === idx && dragOverInfo.before && (
                      <div className="ze-drop-line" />
                    )}
                    <div className="ze-thumb-slot">
                      <Thumbnail
                        p={p}
                        idx={idx}
                        isSelected={idx === selectedIdx || selectedPageIndices.includes(idx)}
                        onSelect={onSelect}
                        onRotate={onRotate}
                        onDelete={onDelete}
                        dragHandlers={dragHandlersFor(idx)}
                      />
                    </div>
                    {dragOverInfo && dragOverInfo.idx === idx && !dragOverInfo.before && (
                      <div className="ze-drop-line" />
                    )}
                    <PageGap onInsert={() => onInsertBlank(idx + 1)} />
                  </React.Fragment>
                ))}
              </div>
            )}
          </div>
        </aside>
      );
    }

    // ---- Searchable font picker, with an optional "load your system's
    // fonts" button via the Local Font Access API (Chrome/Edge only, needs
    // a permission grant) — same pattern Markdown-to-PDF uses.
    function FontCombobox({ fontOptions, setFontOptions, value, onChange }) {
      const [query, setQuery] = useState(value || "");
      const [open, setOpen] = useState(false);
      const [status, setStatus] = useState(null); // { type: 'success'|'error', message }
      const [loadingFonts, setLoadingFonts] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => { setQuery(value || ""); }, [value]);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setOpen(false);
            setQuery(value || "");
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [value]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return fontOptions;
        return fontOptions.filter((f) => f.toLowerCase().includes(q));
      }, [fontOptions, query]);

      function selectFont(font) {
        onChange(font);
        setQuery(font);
        setOpen(false);
      }

      async function handleLoadLocalFonts() {
        setStatus(null);
        if (!("queryLocalFonts" in window)) {
          setStatus({ type: "error", message: "Local Font Access isn't supported in this browser — try Chrome or Edge." });
          return;
        }
        setLoadingFonts(true);
        try {
          const availableFonts = await window.queryLocalFonts();
          const families = Array.from(new Set(availableFonts.map((f) => f.family))).sort((a, b) => a.localeCompare(b));
          setFontOptions((prev) => Array.from(new Set([...prev, ...families])).sort((a, b) => a.localeCompare(b)));
          setStatus({ type: "success", message: `Loaded ${families.length} local fonts.` });
        } catch (err) {
          const denied = err && (err.name === "NotAllowedError" || /permission/i.test(err.message || ""));
          setStatus({ type: "error", message: denied ? "Permission to read local fonts was denied." : "Couldn't load local fonts." });
        } finally {
          setLoadingFonts(false);
        }
      }

      return (
        <div className="ze-fontbox" ref={containerRef}>
          <div className="ze-fontbox-input-wrap">
            <input
              type="text"
              className="ze-format-select ze-fontbox-input"
              value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)}
              placeholder="Search fonts…"
            />
            <button type="button" className="ze-fontbox-caret" onClick={() => setOpen((o) => !o)} aria-label="Toggle font list">
              <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5.5 7.5l4.5 4.5 4.5-4.5" /></svg>
            </button>
          </div>
          {open && (
            <div className="ze-fontbox-list">
              {filtered.length === 0 ? (
                <div className="ze-fontbox-empty">No fonts match "{query}"</div>
              ) : (
                filtered.map((font) => (
                  <button
                    key={font}
                    type="button"
                    className={"ze-fontbox-item" + (font === value ? " active" : "")}
                    style={{ fontFamily: `'${font}', sans-serif` }}
                    onClick={() => selectFont(font)}
                  >{font}</button>
                ))
              )}
            </div>
          )}
          <button type="button" className="ze-fontbox-load" onClick={handleLoadLocalFonts} disabled={loadingFonts}>
            {loadingFonts ? "Loading…" : "+ Load Local System Fonts"}
          </button>
          {status && (
            <span className={"ze-format-hint" + (status.type === "error" ? " is-error" : "")}>{status.message}</span>
          )}
        </div>
      );
    }

    // ---- Shared color-swatches + thickness-slider fields, used for both
    // a tool's drawing defaults and an existing selected stroke's own
    // properties — same controls, different get/set targets.
    function StrokeFormatFields({ swatches, color, width, minWidth, maxWidth, taper, onColor, onWidth, onTaper }) {
      return (
        <React.Fragment>
          <div className="ze-format-field">
            <span className="ze-format-label">Thickness ({Math.round(width)}px)</span>
            <input
              type="range"
              className="ze-format-slider"
              min={minWidth}
              max={maxWidth}
              step="0.5"
              value={width}
              onChange={(e) => onWidth(Number(e.target.value))}
            />
          </div>
          <div className="ze-format-field">
            <span className="ze-format-label">Taper ({Math.round((taper || 0) * 100 / 0.45)}%)</span>
            <input
              type="range"
              className="ze-format-slider"
              min="0"
              max="0.45"
              step="0.01"
              value={taper || 0}
              onChange={(e) => onTaper(Number(e.target.value))}
            />
            <span className="ze-format-hint">Thins each end toward a point. 0% keeps a constant, rounded-off width.</span>
          </div>
          <div className="ze-format-field">
            <span className="ze-format-label">Color</span>
            <div className="ze-format-row ze-format-swatches">
              {swatches.map((c) => (
                <button
                  key={c}
                  type="button"
                  className={"ze-format-swatch" + (color === c ? " active" : "")}
                  style={{ backgroundColor: c }}
                  title={c}
                  onClick={() => onColor(c)}
                />
              ))}
              <input
                type="color"
                className="ze-format-color-input"
                value={/^#[0-9a-fA-F]{6}$/.test(color) ? color : "#000000"}
                onChange={(e) => onColor(e.target.value)}
                title="Custom color"
              />
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ---- Right-side panel. What it shows depends on context, in priority
    // order: a selected annotation's own formatting first (text or
    // stroke), then the active tool's drawing defaults (text/pen/
    // highlighter), then an empty state. Clicking a toolbar tool clears
    // any selection (see App's selectTool), so picking a tool reliably
    // brings up that tool's own defaults here.
    // Props for a text-style input paired with another control: it keeps
    // its own text while being typed in, so it can be cleared or hold a
    // partial value, and `commitText` decides when that text is usable.
    function useDraftInputProps(value, commitText) {
      const [draft, setDraft] = useState(null);
      return {
        value: draft != null ? draft : value,
        onChange: (e) => { setDraft(e.target.value); commitText(e.target.value); },
        onBlur: () => setDraft(null),
      };
    }

    function SliderNumberInput({ min, max, value, onChange }) {
      const numberProps = useDraftInputProps(value, (text) => {
        const n = Number(text);
        if (text.trim() !== "" && Number.isFinite(n)) onChange(Math.min(max, Math.max(min, Math.round(n))));
      });
      return (
        <div className="ze-format-slider-row">
          <input
            type="range" className="ze-format-slider" min={min} max={max} step="1"
            value={value}
            onChange={(e) => onChange(Number(e.target.value))}
          />
          <input type="number" className="ze-format-number" min={min} max={max} step="1" {...numberProps} />
        </div>
      );
    }

    function HexColorInput({ value, onChange }) {
      const hexProps = useDraftInputProps(value, (text) => {
        const hex = "#" + text.trim().replace(/^#/, "");
        if (/^#[0-9a-f]{6}$/i.test(hex)) onChange(hex.toLowerCase());
      });
      return (
        <div className="ze-format-slider-row">
          <input type="color" className="ze-format-color-input" value={value} onChange={(e) => onChange(e.target.value)} />
          <input type="text" className="ze-format-number" spellCheck="false" maxLength="7" aria-label="Hex color" {...hexProps} />
        </div>
      );
    }

    function SelectInput({ options, value, onChange }) {
      return (
        <select className="ze-format-select" value={value} onChange={(e) => onChange(e.target.value)}>
          {options.map((o) => <option key={o.key} value={o.key}>{o.label}</option>)}
        </select>
      );
    }

    const EFFECT_CONTROL_INPUTS = { slider: SliderNumberInput, color: HexColorInput, select: SelectInput };

    // Labelled inputs for a list of controls, reading from and patching
    // whichever object holds their values (an annotation or a filter).
    function ControlList({ controls, source, onPatch }) {
      const values = controlValues(source, controls);
      return controls.filter((c) => !c.showIf || c.showIf(values)).map(({ kind, prop, label, min, max, options }) => {
        const ControlInput = EFFECT_CONTROL_INPUTS[kind];
        return (
          <div className="ze-format-field" key={prop}>
            <span className="ze-format-label">{label}</span>
            <ControlInput min={min} max={max} options={options} value={values[prop]} onChange={(v) => onPatch({ [prop]: v })} />
          </div>
        );
      });
    }

    // One active image effect: its name above the controls defined for it.
    function EffectCard({ effect, ann, onPatch }) {
      return (
        <section className="ze-effect-card">
          <div className="ze-effect-card-title">{effect.label}</div>
          <ControlList controls={effect.controls} source={ann} onPatch={onPatch} />
          {effect.hint && <span className="ze-format-hint">{effect.hint}</span>}
        </section>
      );
    }

    // The effect on/off buttons and the settings of each active effect.
    function EffectControls({ ann, onPatch }) {
      const toggleEffect = (effect) => {
        const on = !ann[effect.key];
        const otherEdgesOff = effect.outline && on
          ? Object.fromEntries(IMAGE_EFFECTS.filter((e) => e.outline).map((e) => [e.key, false]))
          : {};
        onPatch({ ...otherEdgesOff, [effect.key]: on });
      };
      return (
        <React.Fragment>
          <div className="ze-format-field">
            <span className="ze-format-label">Effect</span>
            <div className="ze-format-row">
              {IMAGE_EFFECTS.map((effect) => (
                <button
                  key={effect.key}
                  type="button"
                  className={"ze-format-toggle ze-format-toggle-wide" + (ann[effect.key] ? " active" : "")}
                  onClick={() => toggleEffect(effect)}
                >
                  {effect.label}
                </button>
              ))}
            </div>
            <span className="ze-format-hint">Rounded, Torn Edge and Scissor Cut replace each other. All effects are baked into Export PDF too.</span>
          </div>
          {IMAGE_EFFECTS.filter((effect) => ann[effect.key]).map((effect) => (
            <EffectCard key={effect.key} effect={effect} ann={ann} onPatch={onPatch} />
          ))}
        </React.Fragment>
      );
    }

    // ---- Layers panel — the page's items, top layer first. ----------------
    function layerName(ann) {
      if (ann.name) return ann.name;
      if (ann.type === "text") return ann.text.trim().split("\n")[0] || "Text";
      if (ann.type === "stroke") return ann.tool === "highlighter" ? "Highlight" : "Drawing";
      return ann.type === "rect" ? "Rectangle" : "Image";
    }

    function LayerThumb({ ann }) {
      if (ann.type === "image") return <span className="ze-layer-thumb"><img src={ann.src} alt="" draggable="false" /></span>;
      if (ann.type === "rect") return <span className="ze-layer-thumb"><span className="ze-layer-thumb-fill" style={{ backgroundColor: controlValues(ann, RECT_CONTROLS).fillColor }} /></span>;
      if (ann.type === "text") return <span className="ze-layer-thumb ze-layer-thumb-text">T</span>;
      const isHi = ann.tool === "highlighter";
      return (
        <span className="ze-layer-thumb">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke={ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color)} strokeWidth="3" strokeLinecap="round" aria-hidden="true">
            <path d="M3 16c4-9 6-9 8-4s4 5 10-5" />
          </svg>
        </span>
      );
    }

    // Floats over the workspace. `position` is null until first dragged,
    // which leaves it at its default spot from the stylesheet.
    function LayersPanel({ position, onMove, onMinimize, annotations, selectedIds, onSelect, onToggleFlag, onRename, onReorder }) {
      const [renamingId, setRenamingId] = useState(null);
      const [dropInfo, setDropInfo] = useState(null); // { row, before }
      const dragIdRef = useRef(null);
      const listRef = useRef(null);
      const panelRef = useRef(null);
      const headRef = useRef(null);
      const topFirst = annotations.slice().reverse();

      // Keeps the title bar on screen, so the panel can always be grabbed.
      function inView(x, y) {
        return {
          x: Math.max(0, Math.min(x, window.innerWidth - panelRef.current.offsetWidth)),
          y: Math.max(0, Math.min(y, window.innerHeight - headRef.current.offsetHeight)),
        };
      }

      useEffect(() => {
        if (!position) return;
        const keepInView = () => {
          const next = inView(position.x, position.y);
          if (next.x !== position.x || next.y !== position.y) onMove(next);
        };
        keepInView(); // the window may have shrunk while the panel was minimized
        window.addEventListener("resize", keepInView);
        return () => window.removeEventListener("resize", keepInView);
      }, [position]);

      function startPanelDrag(e) {
        e.preventDefault();
        const start = panelRef.current.getBoundingClientRect();
        const { clientX, clientY } = e;
        trackPointerDrag((ev) => onMove(inView(start.left + ev.clientX - clientX, start.top + ev.clientY - clientY)));
      }

      useEffect(() => {
        const row = listRef.current && listRef.current.querySelector(".ze-layer-row.is-selected");
        if (row) row.scrollIntoView({ block: "nearest" });
      }, [selectedIds[0]]);

      function finishRename(ann, text) {
        setRenamingId(null);
        const name = text.trim();
        if (name && name !== layerName(ann)) onRename(ann.id, name);
      }

      function dragHandlersFor(ann, row) {
        return {
          onDragStart: (e) => { dragIdRef.current = ann.id; e.dataTransfer.setData("text/plain", ""); },
          onDragOver: (e) => {
            e.preventDefault();
            const box = e.currentTarget.getBoundingClientRect();
            setDropInfo({ row, before: e.clientY < box.top + box.height / 2 });
          },
          onDragEnd: () => { dragIdRef.current = null; setDropInfo(null); },
          onDrop: (e) => {
            e.preventDefault();
            const from = dragIdRef.current;
            const info = dropInfo;
            dragIdRef.current = null;
            setDropInfo(null);
            if (from === null || !info) return;
            onReorder(selectedIds.includes(from) ? selectedIds : [from], info.row + (info.before ? 0 : 1));
          },
        };
      }

      return (
        <section
          className="ze-layers-panel"
          ref={panelRef}
          style={position ? { left: position.x, top: position.y, right: "auto" } : undefined}
        >
          <div className="ze-format-panel-head ze-layers-head" ref={headRef} onMouseDown={startPanelDrag}>
            Layers{annotations.length > 0 ? " (" + annotations.length + ")" : ""}
            <button type="button" className="ze-guides-settings-btn" title="Minimize layers" aria-label="Minimize layers" onMouseDown={(e) => e.stopPropagation()} onClick={onMinimize}>
              <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true">
                <path d="M5 10h10" />
              </svg>
            </button>
          </div>
          <div className="ze-layers-list" ref={listRef}>
              {topFirst.map((ann, row) => {
                const isRenaming = renamingId === ann.id;
                return (
                  <React.Fragment key={ann.id}>
                    {dropInfo && dropInfo.row === row && dropInfo.before && <div className="ze-drop-line" />}
                    <div
                      className={"ze-layer-row" + (selectedIds.includes(ann.id) ? " is-selected" : "") + (ann.hidden ? " is-hidden" : "")}
                      data-layer-id={ann.id}
                      draggable={!isRenaming}
                      onClick={(e) => { if (!ann.hidden && !ann.locked) onSelect(ann.id, e.shiftKey); }}
                      onDoubleClick={() => setRenamingId(ann.id)}
                      {...dragHandlersFor(ann, row)}
                    >
                      <LayerThumb ann={ann} />
                      {isRenaming ? (
                        <input
                          className="ze-layer-name-input"
                          defaultValue={layerName(ann)}
                          autoFocus
                          spellCheck="false"
                          onFocus={(e) => e.target.select()}
                          onClick={(e) => e.stopPropagation()}
                          onBlur={(e) => finishRename(ann, e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === "Escape") e.target.value = layerName(ann);
                            if (e.key === "Enter" || e.key === "Escape") e.target.blur();
                          }}
                        />
                      ) : (
                        <span className="ze-layer-name" title="Double-click to rename">{layerName(ann)}</span>
                      )}
                      <button
                        type="button"
                        className={"ze-layer-icon-btn" + (ann.locked ? " active" : "")}
                        title={ann.locked ? "Unlock layer" : "Lock layer"}
                        aria-pressed={Boolean(ann.locked)}
                        onClick={(e) => { e.stopPropagation(); onToggleFlag(ann, "locked"); }}
                        onDoubleClick={(e) => e.stopPropagation()}
                      >
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                          <rect x="5" y="11" width="14" height="10" rx="2" />
                          <path d={ann.locked ? "M8 11V7a4 4 0 0 1 8 0v4" : "M8 11V7a4 4 0 0 1 7.5-2"} />
                        </svg>
                      </button>
                      <button
                        type="button"
                        className={"ze-layer-icon-btn" + (ann.hidden ? " active" : "")}
                        title={ann.hidden ? "Show layer" : "Hide layer"}
                        aria-pressed={Boolean(ann.hidden)}
                        onClick={(e) => { e.stopPropagation(); onToggleFlag(ann, "hidden"); }}
                        onDoubleClick={(e) => e.stopPropagation()}
                      >
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                          <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" />
                          {ann.hidden ? <path d="M4 4l16 16" /> : <circle cx="12" cy="12" r="3" />}
                        </svg>
                      </button>
                    </div>
                    {dropInfo && dropInfo.row === row && !dropInfo.before && <div className="ze-drop-line" />}
                  </React.Fragment>
                );
              })}
              <div className="ze-layer-row ze-layer-row--page">
                <span className="ze-layer-thumb"><span className="ze-layer-thumb-fill" style={{ backgroundColor: "#ffffff" }} /></span>
                <span className="ze-layer-name">Page</span>
              </div>
          </div>
        </section>
      );
    }

    function FormatPanel({
      tool, selectedAnn, onUpdate, fontOptions, setFontOptions, croppingAnnId, onToggleCrop,
      rectDefaults, onChangeRectDefaults,
      textFontFamily, textFontSize, textBold, textItalic, textUnderline, textColor, textAlign,
      onChangeTextFontFamily, onChangeTextFontSize, onChangeTextBold, onChangeTextItalic, onChangeTextUnderline, onChangeTextColor, onChangeTextAlign,
      penColor, penWidth, penTaper, onChangePenColor, onChangePenWidth, onChangePenTaper,
      highlighterColor, highlighterWidth, highlighterTaper, onChangeHighlighterColor, onChangeHighlighterWidth, onChangeHighlighterTaper,
      onFlattenImage,
    }) {
      if (selectedAnn && selectedAnn.type === "text") {
        const ann = selectedAnn;
        const patch = (p) => onUpdate(ann.id, p);
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Format — Text</div>
            <div className="ze-format-panel-body">
              <div className="ze-format-field">
                <span className="ze-format-label">Font</span>
                <FontCombobox fontOptions={fontOptions} setFontOptions={setFontOptions} value={ann.fontFamily} onChange={(v) => patch({ fontFamily: v })} />
              </div>

              <label className="ze-format-field">
                <span className="ze-format-label">Size (px)</span>
                <input
                  type="number"
                  className="ze-format-number"
                  min="8"
                  max="200"
                  value={ann.fontSize || 16}
                  onChange={(e) => patch({ fontSize: Number(e.target.value) || 16 })}
                />
              </label>

              <div className="ze-format-field">
                <span className="ze-format-label">Style</span>
                <div className="ze-format-row">
                  <button type="button" className={"ze-format-toggle" + (ann.bold ? " active" : "")} title="Bold" onClick={() => patch({ bold: !ann.bold })}><strong>B</strong></button>
                  <button type="button" className={"ze-format-toggle" + (ann.italic ? " active" : "")} title="Italic" onClick={() => patch({ italic: !ann.italic })}><em>I</em></button>
                  <button type="button" className={"ze-format-toggle" + (ann.underline ? " active" : "")} title="Underline" onClick={() => patch({ underline: !ann.underline })}><span style={{ textDecoration: "underline" }}>U</span></button>
                </div>
              </div>

              <div className="ze-format-field">
                <span className="ze-format-label">Align</span>
                <div className="ze-format-row">
                  <button type="button" className={"ze-format-toggle" + (ann.align === "left" ? " active" : "")} title="Align left" onClick={() => patch({ align: "left" })}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
                  </button>
                  <button type="button" className={"ze-format-toggle" + (ann.align === "center" ? " active" : "")} title="Align center" onClick={() => patch({ align: "center" })}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M7 12h10M5.5 18h13" /></svg>
                  </button>
                  <button type="button" className={"ze-format-toggle" + (ann.align === "right" ? " active" : "")} title="Align right" onClick={() => patch({ align: "right" })}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M10 12h10M7 18h13" /></svg>
                  </button>
                </div>
                <span className="ze-format-hint">Resize the box (drag its corner while editing) to see centering/right-align take effect.</span>
              </div>

              <div className="ze-format-field">
                <span className="ze-format-label">Color</span>
                <div className="ze-format-row ze-format-swatches">
                  {TEXT_COLOR_SWATCHES.map((c) => (
                    <button key={c} type="button" className={"ze-format-swatch" + (ann.color === c ? " active" : "")} style={{ backgroundColor: c }} title={c} onClick={() => patch({ color: c })} />
                  ))}
                  <input
                    type="color"
                    className="ze-format-color-input"
                    value={/^#[0-9a-fA-F]{6}$/.test(ann.color) ? ann.color : "#1a1a1a"}
                    onChange={(e) => patch({ color: e.target.value })}
                    title="Custom color"
                  />
                </div>
              </div>
            </div>
          </aside>
        );
      }

      if (selectedAnn && selectedAnn.type === "stroke") {
        const ann = selectedAnn;
        const isHi = ann.tool === "highlighter";
        const patch = (p) => onUpdate(ann.id, p);
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Format — {isHi ? "Highlighter" : "Draw"} stroke</div>
            <div className="ze-format-panel-body">
              <StrokeFormatFields
                swatches={isHi ? HIGHLIGHTER_COLOR_SWATCHES : PEN_COLOR_SWATCHES}
                color={ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color)}
                width={ann.strokeWidth || (isHi ? HIGHLIGHTER_DEFAULTS.width : PEN_DEFAULTS.width)}
                minWidth={isHi ? 6 : 1}
                maxWidth={isHi ? 40 : 20}
                taper={ann.taper || 0}
                onColor={(c) => patch({ color: c })}
                onWidth={(w) => patch({ strokeWidth: w })}
                onTaper={(t) => patch({ taper: t })}
              />
            </div>
          </aside>
        );
      }

      if (selectedAnn && selectedAnn.type === "image") {
        const ann = selectedAnn;
        const patch = (p) => onUpdate(ann.id, p);
        const isCroppingThis = croppingAnnId === ann.id;
        const hasCrop = ann.cropW != null && (ann.cropX || ann.cropY || ann.cropW !== ann.naturalWidth || ann.cropH !== ann.naturalHeight);
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Format — Image</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block" }}>
                Drag the image to move it. Drag a handle to resize; hold Shift to stretch it freely.
              </span>
              <div className="ze-format-field" style={{ marginTop: 14 }}>
                <span className="ze-format-label">Size</span>
                <span className="ze-format-hint" style={{ display: "block" }}>{Math.round(ann.width)} × {Math.round(ann.height)} px</span>
              </div>
              <ControlList controls={[OPACITY_CONTROL]} source={ann} onPatch={patch} />
              <div className="ze-format-field">
                <span className="ze-format-label">Crop</span>
                <div className="ze-format-row">
                  <button
                    type="button"
                    className={"ze-format-toggle ze-format-toggle-wide" + (isCroppingThis ? " active" : "")}
                    onClick={() => onToggleCrop(ann.id)}
                  >
                    {isCroppingThis ? "Done Cropping" : "Crop"}
                  </button>
                  {hasCrop && (
                    <button
                      type="button"
                      className="ze-format-toggle ze-format-toggle-wide"
                      onClick={() => patch({ cropX: undefined, cropY: undefined, cropW: undefined, cropH: undefined })}
                    >
                      Reset Crop
                    </button>
                  )}
                </div>
                <span className="ze-format-hint">While cropping: drag inside the window to reposition the photo, drag a corner to resize the crop.</span>
              </div>
              <div className="ze-format-field">
                <span className="ze-format-label">Flatten</span>
                <button
                  type="button"
                  className="ze-format-toggle ze-format-toggle-wide"
                  disabled={isCroppingThis}
                  onClick={() => onFlattenImage(ann)}
                >
                  Flatten Image
                </button>
                <span className="ze-format-hint">Bakes the crop, filter and effects into one image, so you can stack new effects on top. Undo brings them back. Currently {Math.round(ann.src.length * 0.75 / 1024)} KB.</span>
              </div>
              <div className="ze-format-field">
                <span className="ze-format-label">Filter</span>
                <select
                  className="ze-format-select"
                  value={(ann.filter && ann.filter.type) || "match"}
                  onChange={(e) => patch({ filter: { ...ann.filter, type: e.target.value } })}
                >
                  {IMAGE_FILTER_OPTIONS.map((o) => (
                    <option key={o.key} value={o.key}>{o.label}</option>
                  ))}
                </select>
                {ann.filter && ann.filter.type === "duotone" && (
                  <React.Fragment>
                    <div className="ze-format-field" style={{ marginTop: 10 }}>
                      <span className="ze-format-label">Dark tone</span>
                      <input
                        type="color" className="ze-format-color-input"
                        value={ann.filter.darkColor || DEFAULT_DUOTONE_DARK}
                        onChange={(e) => patch({ filter: { ...ann.filter, darkColor: e.target.value } })}
                      />
                    </div>
                    <div className="ze-format-field">
                      <span className="ze-format-label">Light tone</span>
                      <input
                        type="color" className="ze-format-color-input"
                        value={ann.filter.lightColor || DEFAULT_DUOTONE_LIGHT}
                        onChange={(e) => patch({ filter: { ...ann.filter, lightColor: e.target.value } })}
                      />
                    </div>
                  </React.Fragment>
                )}
                {ann.filter && FILTER_CONTROLS[ann.filter.type] && (
                  <div style={{ marginTop: 10 }}>
                    <ControlList
                      controls={FILTER_CONTROLS[ann.filter.type]}
                      source={ann.filter}
                      onPatch={(p) => patch({ filter: { ...ann.filter, ...p } })}
                    />
                  </div>
                )}
                <span className="ze-format-hint">Overrides the page filter for just this image. "Match Page" follows whatever the page filter is set to.</span>
              </div>
              <EffectControls ann={ann} onPatch={patch} />
            </div>
          </aside>
        );
      }

      if (selectedAnn && selectedAnn.type === "rect") {
        const ann = selectedAnn;
        const patch = (p) => onUpdate(ann.id, p);
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Format — Rectangle</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block" }}>
                Drag a handle to resize; hold Shift to keep its proportions. Use Rounded for corner radius and Stroke for a border.
              </span>
              <div className="ze-format-field" style={{ marginTop: 14 }}>
                <span className="ze-format-label">Size</span>
                <span className="ze-format-hint" style={{ display: "block" }}>{Math.round(ann.width)} × {Math.round(ann.height)} px</span>
              </div>
              <ControlList controls={RECT_CONTROLS} source={ann} onPatch={patch} />
              <EffectControls ann={ann} onPatch={patch} />
            </div>
          </aside>
        );
      }

      if (tool === "rect") {
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Rectangle</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block", marginBottom: 12 }}>Drag on the page to draw, or click for a default size. Sets the fill for the next rectangle.</span>
              <ControlList controls={RECT_CONTROLS} source={rectDefaults} onPatch={onChangeRectDefaults} />
            </div>
          </aside>
        );
      }

      if (tool === "text") {
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Text</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block", marginBottom: 12 }}>Sets the font, size, style, alignment and color for the next text box you add.</span>

              <div className="ze-format-field">
                <span className="ze-format-label">Font</span>
                <FontCombobox fontOptions={fontOptions} setFontOptions={setFontOptions} value={textFontFamily} onChange={onChangeTextFontFamily} />
              </div>

              <label className="ze-format-field">
                <span className="ze-format-label">Size (px)</span>
                <input
                  type="number"
                  className="ze-format-number"
                  min="8"
                  max="200"
                  value={textFontSize}
                  onChange={(e) => onChangeTextFontSize(Number(e.target.value) || 16)}
                />
              </label>

              <div className="ze-format-field">
                <span className="ze-format-label">Style</span>
                <div className="ze-format-row">
                  <button type="button" className={"ze-format-toggle" + (textBold ? " active" : "")} title="Bold" onClick={() => onChangeTextBold(!textBold)}><strong>B</strong></button>
                  <button type="button" className={"ze-format-toggle" + (textItalic ? " active" : "")} title="Italic" onClick={() => onChangeTextItalic(!textItalic)}><em>I</em></button>
                  <button type="button" className={"ze-format-toggle" + (textUnderline ? " active" : "")} title="Underline" onClick={() => onChangeTextUnderline(!textUnderline)}><span style={{ textDecoration: "underline" }}>U</span></button>
                </div>
              </div>

              <div className="ze-format-field">
                <span className="ze-format-label">Align</span>
                <div className="ze-format-row">
                  <button type="button" className={"ze-format-toggle" + (textAlign === "left" ? " active" : "")} title="Align left" onClick={() => onChangeTextAlign("left")}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
                  </button>
                  <button type="button" className={"ze-format-toggle" + (textAlign === "center" ? " active" : "")} title="Align center" onClick={() => onChangeTextAlign("center")}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M7 12h10M5.5 18h13" /></svg>
                  </button>
                  <button type="button" className={"ze-format-toggle" + (textAlign === "right" ? " active" : "")} title="Align right" onClick={() => onChangeTextAlign("right")}>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 6h16M10 12h10M7 18h13" /></svg>
                  </button>
                </div>
              </div>

              <div className="ze-format-field">
                <span className="ze-format-label">Color</span>
                <div className="ze-format-row ze-format-swatches">
                  {TEXT_COLOR_SWATCHES.map((c) => (
                    <button key={c} type="button" className={"ze-format-swatch" + (textColor === c ? " active" : "")} style={{ backgroundColor: c }} title={c} onClick={() => onChangeTextColor(c)} />
                  ))}
                  <input
                    type="color"
                    className="ze-format-color-input"
                    value={/^#[0-9a-fA-F]{6}$/.test(textColor) ? textColor : "#1a1a1a"}
                    onChange={(e) => onChangeTextColor(e.target.value)}
                    title="Custom color"
                  />
                </div>
              </div>
            </div>
          </aside>
        );
      }

      if (tool === "pen") {
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Draw</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block", marginBottom: 12 }}>Sets the color and thickness for the next stroke you draw.</span>
              <StrokeFormatFields
                swatches={PEN_COLOR_SWATCHES}
                color={penColor}
                width={penWidth}
                minWidth={1}
                maxWidth={20}
                taper={penTaper}
                onColor={onChangePenColor}
                onWidth={onChangePenWidth}
                onTaper={onChangePenTaper}
              />
            </div>
          </aside>
        );
      }

      if (tool === "highlighter") {
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Highlighter</div>
            <div className="ze-format-panel-body">
              <span className="ze-format-hint" style={{ display: "block", marginBottom: 12 }}>Sets the color and thickness for the next stroke you draw.</span>
              <StrokeFormatFields
                swatches={HIGHLIGHTER_COLOR_SWATCHES}
                color={highlighterColor}
                width={highlighterWidth}
                minWidth={6}
                maxWidth={40}
                taper={highlighterTaper}
                onColor={onChangeHighlighterColor}
                onWidth={onChangeHighlighterWidth}
                onTaper={onChangeHighlighterTaper}
              />
            </div>
          </aside>
        );
      }

      return (
        <aside className="ze-format-panel">
          <div className="ze-format-panel-head">Format</div>
          <div className="ze-format-panel-body">
            <div className="ze-format-empty">
              Select a text box, image, rectangle, or stroke to edit it, or pick a tool to set defaults for the next one you add.
            </div>
          </div>
        </aside>
      );
    }

    // ---- Guides control — the topbar toggle switch plus a settings
    // caret that opens a popover for format/margin/bleed, same
    // click-outside-closes pattern as FontCombobox.
    function GuidesControl({ guidesOn, onToggleGuides, format, onFormatChange, marginIn, onMarginChange, bleedIn, onBleedChange }) {
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div className="ze-topbar-control" ref={containerRef}>
          <div className="toggle-row">
            <div className="toggle-row-text">
              <p>Guides</p>
            </div>
            <label className="toggle-switch">
              <input type="checkbox" checked={guidesOn} onChange={(e) => onToggleGuides(e.target.checked)} />
              <span className="toggle-slider"></span>
            </label>
          </div>
          <button type="button" className="ze-guides-settings-btn" title="Guide settings" onClick={() => setOpen((o) => !o)}>
            <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M5.5 7.5l4.5 4.5 4.5-4.5" />
            </svg>
          </button>
          {open && (
            <div className="ze-topbar-popover">
              <div className="ze-format-field">
                <span className="ze-format-label">Format</span>
                <select className="ze-format-select" value={format} onChange={(e) => onFormatChange(e.target.value)}>
                  {GUIDE_FORMAT_PRESETS.map((p) => (
                    <option key={p.key} value={p.key}>{p.label}</option>
                  ))}
                </select>
              </div>
              <label className="ze-format-field">
                <span className="ze-format-label">Margin (in)</span>
                <input
                  type="number" className="ze-format-number" min="0" max="3" step="0.0625"
                  value={marginIn}
                  onChange={(e) => onMarginChange(Math.max(0, Number(e.target.value) || 0))}
                />
              </label>
              <label className="ze-format-field">
                <span className="ze-format-label">Bleed (in)</span>
                <input
                  type="number" className="ze-format-number" min="0" max="1" step="0.0625"
                  value={bleedIn}
                  onChange={(e) => onBleedChange(Math.max(0, Number(e.target.value) || 0))}
                />
              </label>
              <span className="ze-format-hint">
                Trim is centered on the page; margin sits inside it, bleed extends outside. Pick "Match Page Size" if the page is already trimmed to its final size.
              </span>
            </div>
          )}
        </div>
      );
    }

    // ---- Filter control — a page-background treatment (grayscale/duotone/
    // halftone), same popover shell as GuidesControl. Baked into Export
    // PDF too via applyPageFilter, so preview and output always match.
    function FilterControl({
      filterType, onFilterTypeChange,
      duotoneDark, duotoneLight, onDuotoneDarkChange, onDuotoneLightChange,
      filter, onFilterPatch,
    }) {
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const activeLabel = (PAGE_FILTER_OPTIONS.find((o) => o.key === filterType) || PAGE_FILTER_OPTIONS[0]).label;

      return (
        <div className="ze-topbar-control" ref={containerRef}>
          <button
            type="button"
            className={"ze-filter-toggle-btn" + (filterType !== "none" ? " active" : "")}
            onClick={() => setOpen((o) => !o)}
          >
            Filter: {activeLabel}
          </button>
          {open && (
            <div className="ze-topbar-popover">
              <div className="ze-format-field">
                <span className="ze-format-label">Filter</span>
                <select className="ze-format-select" value={filterType} onChange={(e) => onFilterTypeChange(e.target.value)}>
                  {PAGE_FILTER_OPTIONS.map((o) => (
                    <option key={o.key} value={o.key}>{o.label}</option>
                  ))}
                </select>
              </div>
              {filterType === "duotone" && (
                <React.Fragment>
                  <div className="ze-format-field">
                    <span className="ze-format-label">Dark tone</span>
                    <input type="color" className="ze-format-color-input" value={duotoneDark} onChange={(e) => onDuotoneDarkChange(e.target.value)} />
                  </div>
                  <div className="ze-format-field">
                    <span className="ze-format-label">Light tone</span>
                    <input type="color" className="ze-format-color-input" value={duotoneLight} onChange={(e) => onDuotoneLightChange(e.target.value)} />
                  </div>
                </React.Fragment>
              )}
              {FILTER_CONTROLS[filterType] && (
                <ControlList controls={FILTER_CONTROLS[filterType]} source={filter} onPatch={onFilterPatch} />
              )}
              <span className="ze-format-hint">
                Applies to the selected pages' backgrounds and any placed images (other pages keep their own setting). Pen and text stay crisp on top. Baked into Export PDF too.
              </span>
            </div>
          )}
        </div>
      );
    }

    // ---- Onion-skin control — ghosts the previous page on top of the
    // current one at reduced opacity, to help align content across a
    // spread. Deliberately scoped to previous-page-only (no next-page or
    // spread-aware left/right detection) and doesn't live-update while
    // that previous page is still being edited — see the effect in App
    // that builds onionGhostSrc for why.
    function OnionSkinControl({ onionOn, onToggleOnion, opacity, onOpacityChange }) {
      const [open, setOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      return (
        <div className="ze-topbar-control" ref={containerRef}>
          <div className="toggle-row">
            <div className="toggle-row-text">
              <p>Onion Skin</p>
            </div>
            <label className="toggle-switch">
              <input type="checkbox" checked={onionOn} onChange={(e) => onToggleOnion(e.target.checked)} />
              <span className="toggle-slider"></span>
            </label>
          </div>
          <button type="button" className="ze-guides-settings-btn" title="Onion skin settings" onClick={() => setOpen((o) => !o)}>
            <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <path d="M5.5 7.5l4.5 4.5 4.5-4.5" />
            </svg>
          </button>
          {open && (
            <div className="ze-topbar-popover">
              <div className="ze-format-field">
                <span className="ze-format-label">Opacity ({Math.round(opacity * 100)}%)</span>
                <input
                  type="range" className="ze-format-slider" min="0.05" max="0.8" step="0.05"
                  value={opacity}
                  onChange={(e) => onOpacityChange(Number(e.target.value))}
                />
              </div>
              <span className="ze-format-hint">
                Shows the previous page faintly on top, for aligning content across a spread. Switch pages and back to refresh it after editing that page.
              </span>
            </div>
          )}
        </div>
      );
    }

    // ---- Insert PDF dialog — asks where to splice the newly-chosen PDF's
    // pages into the current document before actually doing it, rather
    // than always appending at the end.
    function InsertPdfDialog({ file, pageCount, afterPage, onChangeAfterPage, onConfirm, onCancel }) {
      if (!file) return null;
      return (
        <div className="ze-modal-backdrop" onMouseDown={onCancel}>
          <div className="ze-modal" onMouseDown={(e) => e.stopPropagation()}>
            <div className="ze-modal-head">Insert PDF</div>
            <div className="ze-modal-body">
              <p className="ze-format-hint" style={{ margin: "0 0 14px" }}>
                Inserting <strong>{file.name}</strong> into this document.
              </p>
              <label className="ze-format-field">
                <span className="ze-format-label">Insert after page (0 for the very beginning)</span>
                <input
                  type="number" className="ze-format-number" min="0" max={pageCount} autoFocus
                  value={afterPage}
                  onChange={(e) => onChangeAfterPage(Math.max(0, Math.min(pageCount, Number(e.target.value) || 0)))}
                />
              </label>
              <span className="ze-format-hint">This document currently has {pageCount} page{pageCount === 1 ? "" : "s"}.</span>
            </div>
            <div className="ze-modal-actions">

              <button type="button" className="btn-solid" onClick={onConfirm}>Insert</button>

    }

    // ---- Two-step "this erases your work" confirmation — shared by New
    // Project and Load Project. Step 1 states the consequence plainly;
    // step 2 is a final, separate "are you sure" rather than a second copy
    // of the same warning, so it can't be clicked through as a reflex.
    // Keep in step with handleKeyDown and the other input handlers in App.
    const KEYBOARD_SHORTCUTS = [
      {
        group: "Tools",
        rows: [
          ["V", "Move tool"],
          ["T", "Text tool"],
          ["I", "Add an image"],
          ["R", "Rectangle tool"],
          ["D", "Draw tool"],
          ["H", "Highlighter tool"],
        ],
      },
      {
        group: "Editing",
        rows: [
          ["Ctrl + Z", "Undo"],
          ["Ctrl + Shift + Z, or Ctrl + Y", "Redo"],
          ["Ctrl + C", "Copy the selected item"],
          ["Ctrl + V", "Paste a copied item, or an image from the clipboard"],
          ["Delete", "Delete the selected item, or the selected page(s) if no item is selected"],
          ["Double-click text", "Edit it (Move tool)"],
          ["Esc", "Finish editing and keep the text selected"],
        ],
      },
      {
        group: "Pages and selection",
        rows: [
          ["↑ / ↓", "Previous / next page, when no item is selected"],
          ["Arrow keys", "Nudge the selected items 1 px"],
          ["Shift + arrow keys", "Nudge the selected items 10 px"],
          ["Ctrl + R", "Rotate the selected page"],
          ["Shift + click", "Add to or remove from the selection (pages and items)"],
          ["Drag on empty page", "Select the items it touches (Move tool)"],
          ["Shift + drag a handle", "Stretch an image freely, or keep a rectangle's proportions"],
        ],
      },
    ];

    function ShortcutsDialog({ open, onClose }) {
      useEffect(() => {
        if (!open) return;
        const closeOnEscape = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", closeOnEscape);
