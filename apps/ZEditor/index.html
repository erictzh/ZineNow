<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEditor</title>

<!-- React 18 (UMD) + Babel Standalone, all from CDN via normal <script>
     tags — that kind of resource load isn't subject to file://'s fetch
     restriction, unlike a fetch()/XHR read would be. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- pdf.js — a local copy (own folder, not shared with Zine Arranger, so
     this app stays self-contained), loaded the same proven way Zine
     Arranger already uses it. -->
<script src="./pdfjs/build/pdf.js"></script>

<!-- pdf-lib — local copy, used only for Export: assembles the rendered
     page images into a real downloadable PDF. -->
<script src="./pdf-lib/pdf-lib.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <!--
    JSX lives inline here, NOT loaded via <script type="text/babel" src="...">.
    Babel Standalone fetches a src file with its own internal XHR to read it
    before transforming — which is exactly the kind of read file:// blocks.
    Inline content has no such fetch: the browser already parsed it as part
    of this document, so Babel Standalone just transforms text that's
    already sitting in the DOM. Same file://-safety principle as
    Markdown-to-PDF's precompiled App.jsx, different mechanism.
  -->
  <script type="text/babel">
    const { useState, useRef, useEffect, useLayoutEffect, useMemo } = React;

    const THUMB_SCALE = 0.3;
    const MAIN_SCALE = 1.1;
    const DEFAULT_PAGE_SIZE = { width: 420, height: 594 }; // used only if no PDF has been loaded yet
    const ZOOM_PERCENT = { min: 25, max: 400, initial: 100 };

    // For a drag started by `startEvent`: turns a later mouse event into how
    // far the pointer has moved in artboard px (annotations' own space),
    // whatever the current zoom is.
    function dragDeltaFrom(startEvent, zoom) {
      const { clientX: startX, clientY: startY } = startEvent;
      return (ev) => ({ dx: (ev.clientX - startX) / zoom, dy: (ev.clientY - startY) / zoom });
    }

    const DRAG_THRESHOLD = 4; // screen px of movement before a press counts as a drag
    const MIN_RESIZE_SIZE = 20;
    const AUTO_TEXT_MAX_WIDTH = 320; // a text box with no set width wraps here, on screen and in export

    // Follows the mouse until release, wherever it goes on the page.
    function trackPointerDrag(onMove, onUp) {
      const move = (ev) => onMove(ev);
      const up = (ev) => {
        window.removeEventListener("mousemove", move);
        window.removeEventListener("mouseup", up);
        if (onUp) onUp(ev);
      };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    }

    function translatedAnnotation(ann, dx, dy) {
      return ann.type === "stroke"
        ? { ...ann, points: ann.points.map(([px, py]) => [px + dx, py + dy]) }
        : { ...ann, x: ann.x + dx, y: ann.y + dy };
    }

    // A box after dragging one of its handles. `handle` is a compass name
    // ("e", "nw"...); the opposite side or corner stays where it is.
    function resizedBox(box, handle, dx, dy, keepAspect, minSize = MIN_RESIZE_SIZE) {
      const signX = handle.includes("e") ? 1 : handle.includes("w") ? -1 : 0;
      const signY = handle.includes("s") ? 1 : handle.includes("n") ? -1 : 0;
      let width = box.width + signX * dx;
      let height = box.height + signY * dy;
      if (keepAspect) {
        const scaleX = width / box.width, scaleY = height / box.height;
        const minScale = minSize / Math.min(box.width, box.height);
        const scale = Math.max(minScale, signX && signY ? Math.max(scaleX, scaleY) : signX ? scaleX : scaleY);
        width = box.width * scale;
        height = box.height * scale;
      } else {
        width = Math.max(minSize, width);
        height = Math.max(minSize, height);
      }
      return {
        x: signX < 0 ? box.x + box.width - width : signX > 0 ? box.x : box.x + (box.width - width) / 2,
        y: signY < 0 ? box.y + box.height - height : signY > 0 ? box.y : box.y + (box.height - height) / 2,
        width,
        height,
      };
    }

    // The character position under a screen point inside `element`.
    function textOffsetAtPoint(x, y, element, textLength) {
      let node = null, offset = 0;
      if (document.caretPositionFromPoint) {
        const position = document.caretPositionFromPoint(x, y);
        if (position) { node = position.offsetNode; offset = position.offset; }
      } else if (document.caretRangeFromPoint) {
        const range = document.caretRangeFromPoint(x, y);
        if (range) { node = range.startContainer; offset = range.startOffset; }
      }
      return node && node.nodeType === Node.TEXT_NODE && element.contains(node) ? offset : textLength;
    }

    // Guides — trim/margin/bleed presets, in inches. Page geometry
    // (page.width/height, canvas px at MAIN_SCALE) is already in points
    // (72/in), same unit pdf.js and PDFs use, so presets convert cleanly.
    const POINTS_PER_INCH = 72;
    const GUIDE_FORMAT_PRESETS = [
      { key: "match", label: "Match Page Size" },
      { key: "half-letter", label: "Half Letter (5.5 × 8.5 in)", widthIn: 5.5, heightIn: 8.5 },
      { key: "digest", label: "Digest (5.5 × 8.25 in)", widthIn: 5.5, heightIn: 8.25 },
      { key: "a5", label: "A5 (5.83 × 8.27 in)", widthIn: 5.83, heightIn: 8.27 },
      { key: "a6", label: "A6 (4.13 × 5.83 in)", widthIn: 4.13, heightIn: 5.83 },
      { key: "quarter-letter", label: "Quarter Letter (4.25 × 5.5 in)", widthIn: 4.25, heightIn: 5.5 },
      { key: "letter", label: "US Letter (8.5 × 11 in)", widthIn: 8.5, heightIn: 11 },
      { key: "a4", label: "A4 (8.27 × 11.69 in)", widthIn: 8.27, heightIn: 11.69 },
    ];
    const DEFAULT_GUIDE_MARGIN_IN = 0.25;
    const DEFAULT_GUIDE_BLEED_IN = 0.125;

    // Undo/redo — one entry per discrete action (a finished drag, a
    // committed edit, a delete, a rotate), not per pixel or keystroke.
    // Rapid repeats of the SAME gesture (a drag's mousemoves, a slider
    // being dragged, keystrokes while typing) collapse into one entry by
    // sharing a coalesce key within this window; letting go and coming
    // back starts a fresh entry. See recordUndoCheckpoint in App.
    const UNDO_COALESCE_MS = 700;
    const MAX_UNDO_HISTORY = 50;

    // Page filter — a photocopier/screen-print treatment applied to both
    // the page background and any placed images. Pen and text annotations
    // are never touched, so your own marks stay crisp on top. Applies both
    // live and in Export PDF. Global across the whole document, same scope
    // as Guides, rather than per-page — real zines usually want one
    // consistent treatment throughout.
    const PAGE_FILTER_OPTIONS = [
      { key: "none", label: "None" },
      { key: "grayscale", label: "Grayscale" },
      { key: "duotone", label: "Duotone" },
      { key: "halftone", label: "Halftone" },
      { key: "threshold", label: "Threshold" },
    ];
    // Same treatments, plus "Match Page" — an image's own filter
    // defaults to following whatever the page filter is, same as before
    // this existed, rather than starting every image at "None".
    const IMAGE_FILTER_OPTIONS = [
      { key: "match", label: "Match Page" },
      ...PAGE_FILTER_OPTIONS,
      { key: "xerox", label: "Xerox" }, // per-image only
    ];
    const INK_COLOR_CONTROL = { kind: "color", prop: "inkColor", label: "Ink color", fallback: "#000000" };
    const PAPER_COLOR_CONTROL = { kind: "color", prop: "paperColor", label: "Paper color", fallback: "#ffffff" };
    const THRESHOLD_FILTER_CONTROLS = [
      { kind: "slider", prop: "level", label: "Cutoff", min: 0, max: 255, fallback: 128 },
      INK_COLOR_CONTROL,
      PAPER_COLOR_CONTROL,
    ];
    const XEROX_FILTER_CONTROLS = [
      { kind: "slider", prop: "contrast", label: "Contrast", min: 0, max: 100, fallback: 75 },
      { kind: "slider", prop: "exposure", label: "Exposure", min: 0, max: 100, fallback: 50 },
      { kind: "slider", prop: "speckle", label: "Toner speckle", min: 0, max: 100, fallback: 35 },
      { kind: "slider", prop: "streaks", label: "Streaks", min: 0, max: 100, fallback: 25 },
      { kind: "slider", prop: "edgeWear", label: "Edge wear", min: 0, max: 100, fallback: 30 },
      { kind: "slider", prop: "xeroxVariation", label: "Variation", min: 0, max: 100, fallback: 0 },
      INK_COLOR_CONTROL,
      PAPER_COLOR_CONTROL,
    ];
    const DEFAULT_DUOTONE_DARK = "#1a1a1a";
    const DEFAULT_DUOTONE_LIGHT = "#ffe066";
    const MIN_HALFTONE_CELL_SIZE = 1;
    const HALFTONE_FILTER_CONTROLS = [
      {
        kind: "select", prop: "screen", label: "Screen", fallback: "dotsLines",
        options: [{ key: "dotsLines", label: "Dots / Lines" }, { key: "dither", label: "1-Bit Dither" }],
      },
      { kind: "slider", prop: "lineBlend", label: "Dots ↔ Lines (%)", min: 0, max: 100, fallback: 0, showIf: (v) => v.screen !== "dither" },
      { kind: "slider", prop: "cellSize", label: "Size (px)", min: MIN_HALFTONE_CELL_SIZE, max: 16, fallback: 6 },
      { kind: "slider", prop: "angle", label: "Angle (°)", min: 0, max: 180, fallback: 0 },
      { kind: "color", prop: "color", label: "Ink color", fallback: "#1a1a1a" },
    ];
    // Filters whose settings are built from a control list (keyed by filter
    // type). These all replace pixels, so images preview them on a canvas.
    const FILTER_CONTROLS = {
      threshold: THRESHOLD_FILTER_CONTROLS,
      halftone: HALFTONE_FILTER_CONTROLS,
      xerox: XEROX_FILTER_CONTROLS,
    };
    const DEFAULT_PAGE_FILTER = { type: "none" };
    // Image effects — the one place an effect and its settings are defined.
    // `key` is the on/off flag on the annotation, each control's `prop` is
    // where its value lives. The Format panel's buttons and cards are built
    // from these, and rendering reads values through effectSettings, so
    // adding a setting here is all the panel needs. An `outline` makes the
    // effect an edge shape: only one can be active on an image at a time.
    // Edge sizes are percentages of the image's short side, so a shape
    // keeps its look when the image is resized or exported.
    const ROUNDED_EFFECT = {
      key: "rounded",
      label: "Rounded",
      outline: roundedOutline,
      controls: [
        { kind: "slider", prop: "roundedRadius", label: "Radius (%)", min: 0, max: 50, fallback: 12 },
      ],
    };
    const TORN_EDGE_EFFECT = {
      key: "tornEdge",
      label: "Torn Edge",
      outline: tornEdgeOutline,
      controls: [
        { kind: "slider", prop: "tornSize", label: "Tooth size (%)", min: 2, max: 40, fallback: 10 },
        { kind: "slider", prop: "tornDepth", label: "Depth (%)", min: 0, max: 30, fallback: 6 },
        { kind: "slider", prop: "tornVariation", label: "Variation", min: 0, max: 100, fallback: 0 },
      ],
    };
    const SCISSOR_CUT_EFFECT = {
      key: "scissorCut",
      label: "Scissor Cut",
      outline: scissorCutOutline,
      controls: [
        { kind: "slider", prop: "scissorCuts", label: "Cuts per side", min: 1, max: 12, fallback: 2 },
        { kind: "slider", prop: "scissorDepth", label: "Depth (%)", min: 0, max: 25, fallback: 8 },
        { kind: "slider", prop: "scissorVariation", label: "Variation", min: 0, max: 100, fallback: 0 },
      ],
    };
    const STROKE_EFFECT = {
      key: "stroke",
      label: "Stroke",
      controls: [
        { kind: "color", prop: "strokeColor", label: "Color", fallback: "#000000" },
        { kind: "slider", prop: "strokeThickness", label: "Thickness (px)", min: 1, max: 40, fallback: 4 },
      ],
    };
    const STROKE_MITER_LIMIT = 4; // set explicitly so the live SVG and export canvas agree
    const SHADOW_EFFECT = {
      key: "shadow",
      label: "Shadow",
      controls: [
        { kind: "color", prop: "shadowColor", label: "Color", fallback: "#000000" },
        { kind: "slider", prop: "shadowThickness", label: "Thickness (px)", min: 0, max: 60, fallback: 6 },
        { kind: "slider", prop: "shadowDirection", label: "Direction (°)", min: 0, max: 360, fallback: 135 },
        { kind: "slider", prop: "shadowBlur", label: "Blur (px)", min: 0, max: 40, fallback: 0 },
      ],
      hint: "Direction: 0° is up, 90° right, 180° down, 270° left.",
    };
    const TEXTURE_EFFECT = {
      key: "texture",
      label: "Texture",
      controls: [
        { kind: "color", prop: "textureColor", label: "Color", fallback: "#1a1a1a" },
        { kind: "slider", prop: "textureGrit", label: "Grit", min: 0, max: 100, fallback: 40 },
        { kind: "slider", prop: "textureDust", label: "Dust", min: 0, max: 100, fallback: 20 },
        { kind: "slider", prop: "textureScratches", label: "Scratches", min: 0, max: 100, fallback: 15 },
        { kind: "slider", prop: "textureVariation", label: "Variation", min: 0, max: 100, fallback: 0 },
      ],
    };
    const IMAGE_EFFECTS = [ROUNDED_EFFECT, TORN_EDGE_EFFECT, SCISSOR_CUT_EFFECT, STROKE_EFFECT, SHADOW_EFFECT, TEXTURE_EFFECT];

    const OPACITY_CONTROL = { kind: "slider", prop: "opacity", label: "Opacity (%)", min: 0, max: 100, fallback: 100 };
    const RECT_CONTROLS = [
      { kind: "color", prop: "fillColor", label: "Fill color", fallback: "#1a1a1a" },
      OPACITY_CONTROL,
    ];
    const MIN_RECT_SIZE = 2; // small enough to use a rectangle as a thin rule
    const DEFAULT_RECT_SIZE = { width: 160, height: 110 }; // for a click without a drag

    // Current values for a list of controls, keyed by each control's
    // `prop`, with the control's fallback for anything not set yet.
    function controlValues(source, controls) {
      return Object.fromEntries(controls.map((c) => [c.prop, source[c.prop] != null ? source[c.prop] : c.fallback]));
    }

    function effectSettings(ann, effect) {
      return controlValues(ann, effect.controls);
    }

    function opacityOf(ann) {
      return controlValues(ann, [OPACITY_CONTROL]).opacity / 100;
    }

    // Resolves what an image annotation should actually be filtered with:
    // no `ann.filter` (or type "match") follows the page filter, exactly
    // like every image behaved before per-image filters existed; type
    // "none" opts an image out even when the page has a filter; anything
    // else is the image's own independent filter settings.
    function effectiveImageFilter(ann, pageFilter) {
      const f = ann.filter;
      if (!f || f.type === "match") return pageFilter || { type: "none" };
      if (f.type === "none") return { type: "none" };
      return f;
    }

    // Starting font presets, shown before (or alongside) any fonts loaded
    // from the browser via the Local Font Access API — see FontCombobox.
    // Plain family names, same convention Markdown-to-PDF uses: applied as
    // `'${name}', sans-serif` at render time, so an unrecognized/unavailable
    // name just falls back to the browser's default sans rather than erroring.
    const DEFAULT_FONT_OPTIONS = ["Inter", "Georgia", "Courier New", "Comic Sans MS", "Impact"];

    const TEXT_COLOR_SWATCHES = ["#1a1a1a", "#ffffff", "#dd531a", "#2563eb", "#16a34a", "#dc2626", "#eab308"];
    const PEN_COLOR_SWATCHES = ["#1a1a1a", "#dd531a", "#dc2626", "#2563eb"];
    const HIGHLIGHTER_COLOR_SWATCHES = ["#ffe066", "#ffb84d", "#7ec8ff", "#ff9ecf", "#7dffb3"];

    const PEN_DEFAULTS = { color: "#1a1a1a", width: 2.5 };
    const HIGHLIGHTER_DEFAULTS = { color: "#ffe066", width: 14 };

    // Turns raw recorded points into a smoothed SVG path — quadratic curves
    // through the midpoint of each consecutive pair, using the shared point
    // as the control. A common, cheap freehand-smoothing trick: it rounds
    // off the jagged look of raw mouse samples without needing pressure
    // data (which a mouse doesn't have) or an external library. Hit-testing
    // for the eraser still uses the original raw points, not this curve.
    function smoothPathD(points) {
      if (points.length < 2) return "";
      if (points.length === 2) {
        return `M ${points[0][0]},${points[0][1]} L ${points[1][0]},${points[1][1]}`;
      }
      let d = `M ${points[0][0]},${points[0][1]}`;
      for (let i = 1; i < points.length - 1; i++) {
        const [x0, y0] = points[i];
        const [x1, y1] = points[i + 1];
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        d += ` Q ${x0},${y0} ${mx},${my}`;
      }
      const last = points[points.length - 1];
      d += ` L ${last[0]},${last[1]}`;
      return d;
    }

    // Shortest distance from point p to the segment a-b — used by the
    // eraser to decide whether it's passing close enough to a stroke.
    function distToSegment(p, a, b) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const lenSq = dx * dx + dy * dy;
      let t = lenSq === 0 ? 0 : ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const cx = a[0] + t * dx, cy = a[1] + t * dy;
      return Math.hypot(p[0] - cx, p[1] - cy);
    }

    function strokeHitTest(point, ann) {
      const threshold = (ann.strokeWidth || 8) / 2 + 6;
      for (let i = 0; i < ann.points.length - 1; i++) {
        if (distToSegment(point, ann.points[i], ann.points[i + 1]) <= threshold) return true;
      }
      return false;
    }

    // ---- Variable-width (tapered) stroke outline --------------------------
    // A plain SVG <path stroke-width> can't vary along its length, so a
    // real taper means building a filled silhouette instead: offset each
    // point perpendicular to the stroke's direction by half the width AT
    // THAT POINT, narrowing near both ends when taper > 0. `taper` is a
    // fraction (0–0.45) of the stroke's total length that each end spends
    // ramping in/out; 0 means constant width (no taper) the whole way.
    function taperedPathD(points, baseWidth, taper) {
      if (points.length < 2) return "";
      const dists = [0];
      for (let i = 1; i < points.length; i++) {
        dists.push(dists[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
      }
      const total = dists[dists.length - 1] || 1;
      const tf = Math.min(0.45, Math.max(0, taper));

      function widthAt(t) {
        if (tf <= 0) return baseWidth;
        let factor;
        if (t < tf) factor = t / tf;
        else if (t > 1 - tf) factor = (1 - t) / tf;
        else factor = 1;
        return Math.max(baseWidth * 0.12, baseWidth * factor);
      }

      const left = [], right = [];
      for (let i = 0; i < points.length; i++) {
        const t = dists[i] / total;
        const w = widthAt(t) / 2;
        const prev = points[Math.max(0, i - 1)];
        const next = points[Math.min(points.length - 1, i + 1)];
        let dx = next[0] - prev[0], dy = next[1] - prev[1];
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const nx = -dy, ny = dx;
        left.push([points[i][0] + nx * w, points[i][1] + ny * w]);
        right.push([points[i][0] - nx * w, points[i][1] - ny * w]);
      }

      let d = `M ${left[0][0]},${left[0][1]}`;
      for (let i = 1; i < left.length; i++) d += ` L ${left[i][0]},${left[i][1]}`;
      for (let i = right.length - 1; i >= 0; i--) d += ` L ${right[i][0]},${right[i][1]}`;
      d += " Z";
      return d;
    }

    // ==========================================================================
    // Export — renders each page (background + all annotations) to a canvas
    // at export resolution, exactly reusing the same stroke geometry
    // (smoothPathD/taperedPathD) the live editor draws with via Path2D, so
    // the exported PDF always matches what's on screen. Text is redrawn
    // with manual word-wrapping since canvas has no built-in text-wrap.
    // ==========================================================================
    const EXPORT_DPI = 200;
    const EXPORT_SCALE = EXPORT_DPI / 72; // PDF/pdf.js "scale 1" is 72 DPI

    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
      return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    // Same Rec.601 coefficients applyColorRemap uses, as an SVG
    // feColorMatrix — puts luminance into R, G, and B alike so a
    // feComponentTransfer right after it can remap that single value per
    // channel (see App's hidden <defs>, used by AnnotationImage's live
    // grayscale/duotone preview).
    const LUMINANCE_MATRIX_VALUES = "0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0 0 0 1 0";

    const BAYER_8X8 = [
      [0, 32, 8, 40, 2, 34, 10, 42],
      [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44, 4, 36, 14, 46, 6, 38],
      [60, 28, 52, 20, 62, 30, 54, 22],
      [3, 35, 11, 43, 1, 33, 9, 41],
      [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47, 7, 39, 13, 45, 5, 37],
      [63, 31, 55, 23, 61, 29, 53, 21],
    ];

    // Screen-print halftone: samples average luminance per grid cell from
    // the source pixels, then redraws that cell as a single mark on a white
    // background — replaces the continuous-tone image entirely, same as a
    // real plate. The grid can be rotated, and the mark is either a shape
    // morphing from a dot into a stretch of line (its size tracks darkness)
    // or, for dither, a solid square chosen by an ordered Bayer pattern.
    function drawHalftoneScreen(ctx, sourceImageData, width, height, cellSize, filter) {
      const data = sourceImageData.data;
      const { screen, lineBlend, angle, color } = controlValues(filter, HALFTONE_FILTER_CONTROLS);
      const isDither = screen === "dither";
      const toLine = lineBlend / 100;
      const maxRadius = cellSize * 0.62;
      const rotated = angle !== 0;
      const radians = angle * Math.PI / 180;
      const cos = Math.cos(radians), sin = Math.sin(radians);

      // The grid lives in rotated (u, v) space; find what covers the canvas.
      const corners = [[0, 0], [width, 0], [0, height], [width, height]];
      const us = corners.map(([x, y]) => x * cos + y * sin);
      const vs = corners.map(([x, y]) => y * cos - x * sin);
      const maxU = Math.max(...us), maxV = Math.max(...vs);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.save();
      ctx.fillStyle = color;
      ctx.rotate(radians);
      ctx.beginPath();
      // Lines and dither squares are filled together so neighbours join
      // without seams, in batches so a very fine screen doesn't build one
      // enormous path. Pure dots are filled one by one: where they overlap,
      // that's what gives a dot screen its tone (batching lightens it).
      const isPureDots = !isDither && toLine === 0;
      const batchSize = isPureDots ? 1 : 4096;
      let batched = 0;
      const markAdded = () => {
        if (++batched < batchSize) return;
        ctx.fill();
        ctx.beginPath();
        batched = 0;
      };

      for (let gridV = Math.floor(Math.min(...vs) / cellSize); gridV * cellSize < maxV; gridV++) {
        for (let gridU = Math.floor(Math.min(...us) / cellSize); gridU * cellSize < maxU; gridU++) {
          const centerU = (gridU + 0.5) * cellSize;
          const centerV = (gridV + 0.5) * cellSize;
          const cx = centerU * cos - centerV * sin - cellSize / 2;
          const cy = centerU * sin + centerV * cos - cellSize / 2;
          // cellSize is fractional at export scale (editor px × scaleFactor),
          // so the grid steps in fractional units but pixel sampling has to
          // use whole-pixel bounds — a fractional index into `data` is
          // undefined, which would turn the average into NaN.
          const x0 = Math.max(0, Math.floor(cx));
          const y0 = Math.max(0, Math.floor(cy));
          const x1 = Math.min(width, Math.max(x0 + 1, Math.floor(cx + cellSize)));
          const y1 = Math.min(height, Math.max(y0 + 1, Math.floor(cy + cellSize)));
          let sum = 0, count = 0;
          for (let y = y0; y < y1; y++) {
            const rowStart = y * width * 4;
            for (let x = x0; x < x1; x++) {
              const idx = rowStart + x * 4;
              sum += data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
              count++;
            }
          }
          if (!count) continue;
          const avgLum = sum / count / 255;

          if (isDither) {
            if (avgLum < (BAYER_8X8[gridV & 7][gridU & 7] + 0.5) / 64) {
              ctx.rect(centerU - cellSize / 2, centerV - cellSize / 2, cellSize, cellSize);
              markAdded();
            }
            continue;
          }

          const radius = (1 - avgLum) * maxRadius;
          const halfLength = radius + (cellSize / 2 + 0.25 - radius) * toLine;
          const halfHeight = radius + ((1 - avgLum) * cellSize / 2 - radius) * toLine;
          if (halfHeight > 0.4) {
            // Cells cut off by the canvas edge center on their visible part.
            const u = rotated ? centerU : cx + Math.min(cellSize, width - cx) / 2;
            const v = rotated ? centerV : cy + Math.min(cellSize, height - cy) / 2;
            if (isPureDots) ctx.arc(u, v, radius, 0, Math.PI * 2);
            else ctx.roundRect(u - halfLength, v - halfHeight, halfLength * 2, halfHeight * 2, Math.min(halfLength, halfHeight) * (1 - toLine));
            markAdded();
          }
        }
      }
      ctx.fill();
      ctx.restore();
    }

    // Grayscale/duotone pixel remap, in place on whatever's painted on
    // `ctx` — the shared piece of applyPageFilter (background) and
    // drawImageOnCanvas (a placed image, remapped on its own offscreen
    // canvas before compositing, so the remap never bleeds into
    // surrounding page pixels). Halftone isn't a simple per-pixel remap
    // (it replaces pixels with marks via drawHalftoneScreen), so both call
    // sites branch around this function for that case instead.
    function applyColorRemap(ctx, canvas, filter) {
      const { width, height } = canvas;
      if (width === 0 || height === 0) return;
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      if (filter.type === "grayscale") {
        for (let i = 0; i < data.length; i += 4) {
          const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          data[i] = data[i + 1] = data[i + 2] = lum;
        }
      } else if (filter.type === "duotone") {
        const dark = hexToRgb(filter.darkColor || DEFAULT_DUOTONE_DARK);
        const light = hexToRgb(filter.lightColor || DEFAULT_DUOTONE_LIGHT);
        for (let i = 0; i < data.length; i += 4) {
          const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
          data[i] = dark.r + (light.r - dark.r) * lum;
          data[i + 1] = dark.g + (light.g - dark.g) * lum;
          data[i + 2] = dark.b + (light.b - dark.b) * lum;
        }
      } else if (filter.type === "threshold") {
        const { level, inkColor, paperColor } = controlValues(filter, THRESHOLD_FILTER_CONTROLS);
        const ink = hexToRgb(inkColor);
        const paper = hexToRgb(paperColor);
        for (let i = 0; i < data.length; i += 4) {
          const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          const c = lum >= level ? paper : ink;
          data[i] = c.r;
          data[i + 1] = c.g;
          data[i + 2] = c.b;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    // Applies the page-level filter to whatever's currently painted on
    // `ctx` (the page background, drawn just before this is called) —
    // grayscale/duotone remap pixels in place, halftone replaces them
    // outright. `scaleFactor` converts cellSize from its editor-px unit
    // to this canvas's actual resolution (1 live, EXPORT_SCALE/MAIN_SCALE
    // on export), same convention drawStrokeOnCanvas uses for strokeWidth.
    function applyPageFilter(ctx, canvas, filter, scaleFactor) {
      if (!filter || filter.type === "none" || canvas.width === 0 || canvas.height === 0) return;
      if (filter.type === "grayscale" || filter.type === "duotone" || filter.type === "threshold") {
        applyColorRemap(ctx, canvas, filter);
      } else if (filter.type === "halftone") {
        const { width, height } = canvas;
        const imageData = ctx.getImageData(0, 0, width, height);
        const { cellSize } = controlValues(filter, HALFTONE_FILTER_CONTROLS);
        drawHalftoneScreen(ctx, imageData, width, height, Math.max(MIN_HALFTONE_CELL_SIZE, cellSize * scaleFactor), filter);
      } else if (filter.type === "xerox") {
        applyXerox(ctx, canvas, filter, scaleFactor);
      }
    }

    // Photocopier look: a steep contrast curve, then toner speckle, feed
    // streaks running down the page and ink worn away near the edges. Noise
    // is keyed to image-space cells (not canvas pixels), so the preview and
    // the higher-resolution export show the same pattern.
    function applyXerox(ctx, canvas, filter, scaleFactor) {
      const { width, height } = canvas;
      const { contrast, exposure, speckle, streaks, edgeWear, xeroxVariation, inkColor, paperColor } = controlValues(filter, XEROX_FILTER_CONTROLS);
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      const ink = hexToRgb(inkColor);
      const paper = hexToRgb(paperColor);
      const gain = 1 + contrast / 100 * 15;
      const cutoff = 1 - exposure / 100;
      const speckleAmount = speckle / 100;
      const wearAmount = edgeWear / 100;
      const imageW = width / scaleFactor;
      const imageH = height / scaleFactor;
      const wearZone = Math.min(imageW, imageH) * 0.1;

      // Some columns get a dark toner line, fewer a pale starved band. The
      // slider sets how many; a column's own noise sets how strong it is.
      const darkShare = 0.2 * streaks / 100;
      const paleShare = darkShare / 2;
      const streakShift = new Float32Array(width);
      for (let x = 0; x < width; x++) {
        const h = seededNoise(Math.floor(x / scaleFactor / 2.5), xeroxVariation);
        if (h > 1 - darkShare) streakShift[x] = -(0.5 + 0.5 * (h - (1 - darkShare)) / darkShare);
        else if (h < paleShare) streakShift[x] = 0.5 + 0.5 * (paleShare - h) / paleShare;
      }

      for (let y = 0; y < height; y++) {
        const imageY = y / scaleFactor;
        const cellY = Math.floor(imageY);
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const imageX = x / scaleFactor;
          const cellX = Math.floor(imageX);
          const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;

          // Limited first, or the steep curve would leave solid blacks and
          // whites so far out of range that speckle and streaks can't show.
          let tone = Math.min(1, Math.max(0, (lum - cutoff) * gain + 0.5));
          tone += (seededNoise(cellX, xeroxVariation, cellY) - 0.5) * speckleAmount;
          tone += streakShift[x];
          // Pinholes: stray toner on white, gaps in solid black.
          if (seededNoise(cellX + 7919, xeroxVariation, cellY + 104729) < speckleAmount * 0.03) {
            tone = tone > 0.5 ? 0 : 1;
          }
          const edgeDistance = Math.min(imageX, imageY, imageW - imageX, imageH - imageY);
          if (edgeDistance < wearZone) {
            const worn = wearAmount * (1 - edgeDistance / wearZone) ** 2;
            if (seededNoise(cellX + 15485, xeroxVariation, cellY + 32452) < worn) tone = 1;
          }

          tone = Math.min(1, Math.max(0, tone));
          data[i] = ink.r + (paper.r - ink.r) * tone;
          data[i + 1] = ink.g + (paper.g - ink.g) * tone;
          data[i + 2] = ink.b + (paper.b - ink.b) * tone;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    // ---- Edge outlines — each edge shape is one SVG path string in the
    // image's own 0..width/0..height space, used as-is by the live CSS
    // clip-path, the live stroke, and the export canvas's Path2D. Jagged
    // shapes use a deterministic sine-based hash instead of Math.random(),
    // so no seed needs storing on the annotation. Variation shifts where
    // the hash starts reading, giving a different shape at the same settings.
    function seededNoise(i, variation, j = 0) {
      const v = Math.sin((i + variation * 97) * 12.9898 + j * 78.233) * 43758.5453;
      return v - Math.floor(v);
    }

    // A repeatable sequence of noise values; each `stream` is independent.
    function noiseStream(variation, stream = 0) {
      let n = 0;
      return () => seededNoise(stream * 100000 + n++, variation);
    }

    function pointsToOutline(points) {
      return "M" + points.map(([x, y]) => `${x.toFixed(2)} ${y.toFixed(2)}`).join("L") + "Z";
    }

    function rectOutline({ width, height }) {
      return `M0 0H${width}V${height}H0Z`;
    }

    // The active edge shape's outline, or null for a plain rectangle.
    function imageEdgeOutline(ann) {
      const edge = IMAGE_EFFECTS.find((effect) => effect.outline && ann[effect.key]);
      return edge ? edge.outline(ann) : null;
    }

    function roundedOutline(ann) {
      const { width: w, height: h } = ann;
      const r = Math.min(w, h) * effectSettings(ann, ROUNDED_EFFECT).roundedRadius / 100;
      const corner = (x, y) => `A${r} ${r} 0 0 1 ${x} ${y}`;
      return `M${r} 0H${w - r}${corner(w, r)}V${h - r}${corner(w - r, h)}H${r}${corner(0, h - r)}V${r}${corner(r, 0)}Z`;
    }

    // A few long straight cuts: each side is split into segments whose
    // corners land at uneven spots, nudged inward by a varying amount.
    function scissorCutOutline(ann) {
      const { width: w, height: h } = ann;
      const { scissorCuts, scissorDepth, scissorVariation } = effectSettings(ann, SCISSOR_CUT_EFFECT);
      const jitter = Math.min(w, h) * scissorDepth / 100;
      const noise = noiseStream(scissorVariation);
      const onSide = [
        (t, inset) => [w * t, inset],
        (t, inset) => [w - inset, h * t],
        (t, inset) => [w * (1 - t), h - inset],
        (t, inset) => [inset, h * (1 - t)],
      ];
      const points = [];
      onSide.forEach((place) => {
        for (let cut = 0; cut < scissorCuts; cut++) {
          const t = cut === 0 ? 0 : (cut + (noise() - 0.5) * 0.6) / scissorCuts;
          points.push(place(t, noise() * jitter));
        }
      });
      return pointsToOutline(points);
    }

    function tornEdgeOutline(ann) {
      const { width, height } = ann;
      const shortSide = Math.min(width, height);
      const { tornSize, tornDepth, tornVariation } = effectSettings(ann, TORN_EDGE_EFFECT);
      const step = Math.max(0.5, shortSide * tornSize / 100);
      const jitter = shortSide * tornDepth / 100;
      // Once tuned, teeth are fitted to land on each corner, or large teeth
      // would slice the corners off. An untuned tear keeps its original shape.
      const tuned = ann.tornSize != null || ann.tornDepth != null;
      const stepX = tuned ? width / Math.max(1, Math.round(width / step)) : step;
      const stepY = tuned ? height / Math.max(1, Math.round(height / step)) : step;
      const eps = 1e-6; // keeps the last point when float steps overshoot a corner
      const noise = (i) => seededNoise(i, tornVariation);
      const points = [];
      let i = 0;
      for (let x = 0; x <= width + eps; x += stepX) points.push([x, noise(i++) * jitter]);
      for (let y = stepY; y <= height + eps; y += stepY) points.push([width - noise(i++) * jitter, y]);
      for (let x = width - stepX; x >= -eps; x -= stepX) points.push([x, height - noise(i++) * jitter]);
      for (let y = height - stepY; y >= stepY - eps; y -= stepY) points.push([noise(i++) * jitter, y]);
      return pointsToOutline(points);
    }

    // ---- Drop shadow — thickness is how far the shadow sits from the image,
    // direction is which way it falls, blur softens its edge. Returns null
    // when the image has no visible shadow. Values are in the image's own
    // page-space, so the live CSS drop-shadow and the export canvas shadow
    // share one source (both treat blur as twice the Gaussian std deviation).
    function imageShadowOffset(ann) {
      if (!ann.shadow) return null;
      const { shadowThickness, shadowDirection, shadowBlur, shadowColor } = effectSettings(ann, SHADOW_EFFECT);
      if (shadowThickness <= 0 && shadowBlur <= 0) return null;
      const radians = shadowDirection * Math.PI / 180;
      return {
        x: Math.sin(radians) * shadowThickness,
        y: -Math.cos(radians) * shadowThickness,
        blur: shadowBlur,
        color: shadowColor,
      };
    }

    // ---- Texture marks — grit, dust and scratches, drawn in the image's
    // own coordinate space. Counts depend only on the amounts and positions
    // are relative to the image, so the pattern scales with it instead of
    // reshuffling on resize, and the preview and export get the same marks.
    function drawTextureMarks(ctx, ann) {
      const { width: w, height: h } = ann;
      const shortSide = Math.min(w, h);
      const longSide = Math.max(w, h);
      const { textureColor, textureGrit, textureDust, textureScratches, textureVariation } = effectSettings(ann, TEXTURE_EFFECT);
      const atLeast = (minimum, size) => Math.max(minimum, size);

      // Marks of one kind share a path, painted once at that kind's opacity.
      const paintMarks = (stream, count, alpha, paint, addMark) => {
        const noise = noiseStream(textureVariation, stream);
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        for (let i = 0; i < Math.round(count); i++) addMark(noise);
        paint();
      };
      const fill = () => ctx.fill();
      const stroke = () => ctx.stroke();

      ctx.save();
      ctx.fillStyle = textureColor;
      ctx.strokeStyle = textureColor;
      ctx.lineCap = "round";

      paintMarks(1, textureGrit * 60, 0.85, fill, (noise) => {
        const size = atLeast(0.5, shortSide * (0.002 + noise() * 0.006));
        ctx.rect(noise() * w, noise() * h, size, size);
      });

      paintMarks(2, textureDust * 1.5, 0.75, fill, (noise) => {
        const radius = atLeast(0.4, shortSide * (0.002 + noise() ** 2 * 0.012));
        const x = noise() * w, y = noise() * h;
        ctx.moveTo(x + radius, y);
        ctx.arc(x, y, radius, 0, Math.PI * 2);
      });

      // A stray hair or fibre: short and strongly curved.
      ctx.lineWidth = atLeast(0.4, shortSide * 0.002);
      paintMarks(3, textureDust * 0.8, 0.75, stroke, (noise) => {
        const x = noise() * w, y = noise() * h;
        const heading = noise() * Math.PI * 2;
        const length = shortSide * (0.02 + noise() * 0.08);
        const bend = (noise() - 0.5) * 1.6;
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(
          x + Math.cos(heading + bend) * length * 0.6, y + Math.sin(heading + bend) * length * 0.6,
          x + Math.cos(heading) * length, y + Math.sin(heading) * length,
        );
      });

      // Long and nearly straight, running mostly up and down the image.
      ctx.lineWidth = atLeast(0.4, shortSide * 0.0015);
      paintMarks(4, textureScratches * 0.3, 0.6, stroke, (noise) => {
        const x = noise() * w, y = noise() * h;
        const heading = -Math.PI / 2 + (noise() - 0.5) * 0.7;
        const length = longSide * (0.15 + noise() * 0.6);
        const bend = (noise() - 0.5) * 0.08;
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(
          x + Math.cos(heading + bend) * length * 0.5, y + Math.sin(heading + bend) * length * 0.5,
          x + Math.cos(heading) * length, y + Math.sin(heading) * length,
        );
      });
      ctx.restore();
    }

    function drawStrokeOnCanvas(ctx, ann, scaleFactor) {
      const isHi = ann.tool === "highlighter";
      const color = ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color);
      const width = (ann.strokeWidth || (isHi ? HIGHLIGHTER_DEFAULTS.width : PEN_DEFAULTS.width)) * scaleFactor;
      const taper = ann.taper || 0;
      const pts = ann.points.map((p) => [p[0] * scaleFactor, p[1] * scaleFactor]);
      ctx.save();
      ctx.globalAlpha = isHi ? 0.45 : 1;
      if (taper > 0) {
        ctx.fillStyle = color;
        ctx.fill(new Path2D(taperedPathD(pts, width, taper)));
      } else {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke(new Path2D(smoothPathD(pts)));
      }
      ctx.restore();
    }

    // Word-based wrapping (canvas has no auto-wrap) — also respects
    // explicit newlines, matching the editor's `white-space: pre-wrap`.
    function wrapTextLines(ctx, text, maxWidth) {
      const paragraphs = (text || "").split("\n");
      const lines = [];
      for (const para of paragraphs) {
        if (para === "") { lines.push(""); continue; }
        const words = para.split(" ");
        let current = "";
        for (const word of words) {
          const test = current ? current + " " + word : word;
          if (current && ctx.measureText(test).width > maxWidth) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }
        lines.push(current);
      }
      return lines;
    }

    function drawTextOnCanvas(ctx, ann, scaleFactor) {
      const fontSize = (ann.fontSize || 16) * scaleFactor;
      const weight = ann.bold ? "700" : "400";
      const styleStr = ann.italic ? "italic" : "normal";
      const family = ann.fontFamily || "sans-serif";
      ctx.font = `${styleStr} ${weight} ${fontSize}px '${family}', sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillStyle = ann.color || "#1a1a1a";

      const x = ann.x * scaleFactor;
      const y = ann.y * scaleFactor;
      const padX = 4 * scaleFactor, padY = 2 * scaleFactor;
      const maxWidthCap = AUTO_TEXT_MAX_WIDTH * scaleFactor;

      let boxWidth;
      if (ann.width) {
        boxWidth = ann.width * scaleFactor;
      } else {
        const naturalWidth = Math.max(10, ...(ann.text || "").split("\n").map((l) => ctx.measureText(l).width));
        boxWidth = Math.min(naturalWidth + padX * 2, maxWidthCap);
      }
      const innerWidth = Math.max(4, boxWidth - padX * 2);
      const lines = wrapTextLines(ctx, ann.text || "", innerWidth);
      const lineHeight = fontSize * 1.3;

      lines.forEach((line, i) => {
        const lineWidth = ctx.measureText(line).width;
        let lineX = x + padX;
        if (ann.align === "center") lineX = x + (boxWidth - lineWidth) / 2;
        else if (ann.align === "right") lineX = x + boxWidth - padX - lineWidth;
        const lineY = y + padY + i * lineHeight;
        ctx.fillText(line, lineX, lineY);
        if (ann.underline && line) {
          ctx.save();
          ctx.strokeStyle = ann.color || "#1a1a1a";
          ctx.lineWidth = Math.max(1, fontSize * 0.06);
          const underlineY = lineY + fontSize * 0.92;
          ctx.beginPath();
          ctx.moveTo(lineX, underlineY);
          ctx.lineTo(lineX + lineWidth, underlineY);
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    // Renders one full page (background + annotations) to an offscreen
    // canvas at export resolution. Kept independent from ComposeCanvas's
    // own live-editing render path (some duplicated logic, but it avoids
    // any risk of an export-specific change accidentally affecting the
    // already-tested live editor).
    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Couldn't load a placed image for export."));
        img.src = src;
      });
    }

    async function drawImageOnCanvas(ctx, ann, scaleFactor, pageFilter) {
      const img = await loadImageElement(ann.src);
      const x = ann.x * scaleFactor, y = ann.y * scaleFactor;
      const w = ann.width * scaleFactor, h = ann.height * scaleFactor;

      // Crop is just a source rect into the natural image — undefined
      // fields mean "no crop" (the whole image), matching AnnotationImage.
      let sx = ann.cropX || 0, sy = ann.cropY || 0;
      let sw = ann.cropW || img.naturalWidth || w, sh = ann.cropH || img.naturalHeight || h;
      let source = img;

      // An image's own filter (if it has one) takes over from the page
      // filter entirely, rather than the two combining — see
      // effectiveImageFilter. Rendered on its own offscreen canvas, sized
      // to the image's TARGET on-page size (not its natural resolution) —
      // that matters for halftone specifically, so its dot cells come out
      // the same physical size as the background's. Doing this before
      // compositing also means a torn edge's clip never leaks the filter
      // into surrounding page pixels.
      const imgFilter = effectiveImageFilter(ann, pageFilter);
      const filterType = imgFilter.type;
      if (filterType && filterType !== "none") {
        const off = document.createElement("canvas");
        off.width = Math.max(1, Math.round(w));
        off.height = Math.max(1, Math.round(h));
        const octx = off.getContext("2d");
        octx.drawImage(img, sx, sy, sw, sh, 0, 0, off.width, off.height);
        applyPageFilter(octx, off, imgFilter, scaleFactor);
        source = off;
        sx = 0; sy = 0; sw = off.width; sh = off.height;
      }

      drawBoxWithEffects(ctx, ann, scaleFactor, (target) => {
        target.drawImage(source, sx, sy, sw, sh, 0, 0, ann.width, ann.height);
      });
    }

    function drawRectOnCanvas(ctx, ann, scaleFactor) {
      const { fillColor } = controlValues(ann, RECT_CONTROLS);
      drawBoxWithEffects(ctx, ann, scaleFactor, (target) => {
        target.fillStyle = fillColor;
        target.fillRect(0, 0, ann.width, ann.height);
      });
    }

    // Draws a box's content with its edge shape, stroke, shadow and texture.
    // `paintContent` paints into the box's own 0..width/0..height space.
    function drawBoxWithEffects(ctx, ann, scaleFactor, paintContent) {
      const x = ann.x * scaleFactor, y = ann.y * scaleFactor;
      const w = ann.width * scaleFactor, h = ann.height * scaleFactor;
      ctx.save();
      const shadow = imageShadowOffset(ann);
      if (shadow) {
        ctx.shadowColor = shadow.color;
        ctx.shadowOffsetX = shadow.x * scaleFactor;
        ctx.shadowOffsetY = shadow.y * scaleFactor;
        ctx.shadowBlur = shadow.blur * scaleFactor;
      }
      const outline = imageEdgeOutline(ann);
      const stroke = ann.stroke ? effectSettings(ann, STROKE_EFFECT) : null;
      if (outline || stroke || ann.texture) {
        // Composed on its own canvas first: clipping on the page's context
        // would also clip away the shadow, and this way the shadow falls
        // from the stroke too. Drawn in the image's own coordinate space,
        // where the outline is defined; `pad` leaves room for the stroke.
        const pad = stroke ? Math.ceil(stroke.strokeThickness * STROKE_MITER_LIMIT / 2 * scaleFactor) + 2 : 0;
        const cut = document.createElement("canvas");
        cut.width = Math.max(1, Math.ceil(w)) + pad * 2;
        cut.height = Math.max(1, Math.ceil(h)) + pad * 2;
        const cctx = cut.getContext("2d");
        cctx.translate(pad, pad);
        cctx.scale(scaleFactor, scaleFactor);
        cctx.save();
        if (outline) cctx.clip(new Path2D(outline));
        paintContent(cctx);
        if (ann.texture) drawTextureMarks(cctx, ann);
        cctx.restore();
        if (stroke) {
          cctx.strokeStyle = stroke.strokeColor;
          cctx.lineWidth = stroke.strokeThickness;
          cctx.lineJoin = "miter";
          cctx.miterLimit = STROKE_MITER_LIMIT;
          cctx.stroke(new Path2D(outline || rectOutline(ann)));
        }
        ctx.drawImage(cut, x - pad, y - pad);
      } else {
        ctx.translate(x, y);
        ctx.scale(scaleFactor, scaleFactor);
        paintContent(ctx);
      }
      ctx.restore();
    }

    // Fades a finished item as one piece, on its own layer, so a shadow
    // doesn't show through a see-through image. Matches CSS `opacity`.
    async function drawWithOpacity(ctx, opacity, draw) {
      if (opacity >= 1) { await draw(ctx); return; }
      const layer = document.createElement("canvas");
      layer.width = ctx.canvas.width;
      layer.height = ctx.canvas.height;
      await draw(layer.getContext("2d"));
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.drawImage(layer, 0, 0);
      ctx.restore();
    }

    async function drawAnnotationOnCanvas(ctx, ann, scaleFactor, pageFilter) {
      if (ann.type === "stroke") drawStrokeOnCanvas(ctx, ann, scaleFactor);
      else if (ann.type === "text") drawTextOnCanvas(ctx, ann, scaleFactor);
      else if (ann.type === "rect") await drawWithOpacity(ctx, opacityOf(ann), (target) => drawRectOnCanvas(target, ann, scaleFactor));
      else await drawWithOpacity(ctx, opacityOf(ann), (target) => drawImageOnCanvas(target, ann, scaleFactor, pageFilter));
    }

    // Bakes an image's crop, filter and effects into one new image and
    // returns the annotation fields to apply, or null if nothing would
    // remain. Uses the export renderer, so the result is what Export PDF
    // would have drawn; the box grows to fit a shadow or stroke and shrinks
    // to the visible pixels, keeping the artwork where it was on the page.
    async function flattenedImagePatch(ann, pageFilter) {
      const filter = effectiveImageFilter(ann, pageFilter);
      const exportScale = EXPORT_SCALE / MAIN_SCALE;
      // Effects and filters are drawn at export resolution. With neither,
      // there's no point upscaling a source smaller than that.
      const hasLook = filter.type !== "none" || IMAGE_EFFECTS.some((effect) => ann[effect.key]);
      const sourceScale = (ann.cropW || ann.naturalWidth || ann.width) / ann.width;
      const scale = hasLook ? exportScale : Math.min(exportScale, sourceScale);

      const shadow = imageShadowOffset(ann);
      const strokeReach = ann.stroke ? effectSettings(ann, STROKE_EFFECT).strokeThickness * STROKE_MITER_LIMIT / 2 : 0;
      const shadowReach = shadow ? Math.hypot(shadow.x, shadow.y) + shadow.blur * 2 : 0;
      const marginPx = Math.ceil((strokeReach + shadowReach + 1) * scale);

      // Snapped to whole canvas pixels: an edge landing partway across a
      // pixel would be slightly transparent, ruling out JPEG for a photo.
      const widthPx = Math.max(1, Math.round(ann.width * scale));
      const heightPx = Math.max(1, Math.round(ann.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = widthPx + marginPx * 2;
      canvas.height = heightPx + marginPx * 2;
      const ctx = canvas.getContext("2d");
      await drawImageOnCanvas(ctx, { ...ann, x: marginPx / scale, y: marginPx / scale, width: widthPx / scale, height: heightPx / scale }, scale, pageFilter);

      const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const alphaAt = (x, y) => data[(y * canvas.width + x) * 4 + 3];
      let left = canvas.width, top = canvas.height, right = -1, bottom = -1;
      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          if (alphaAt(x, y) === 0) continue;
          left = Math.min(left, x); right = Math.max(right, x);
          top = Math.min(top, y); bottom = Math.max(bottom, y);
        }
      }
      if (right < 0) return null;
      let opaque = true;
      for (let y = top; y <= bottom && opaque; y++) {
        for (let x = left; x <= right && opaque; x++) opaque = alphaAt(x, y) === 255;
      }
      const trimmedW = right - left + 1, trimmedH = bottom - top + 1;
      const trimmed = document.createElement("canvas");
      trimmed.width = trimmedW;
      trimmed.height = trimmedH;
      trimmed.getContext("2d").drawImage(canvas, -left, -top);

      // PNG keeps transparency and suits hard-edged screens; JPEG is far
      // smaller for photos. Keep whichever comes out lighter.
      const png = trimmed.toDataURL("image/png");
      const jpeg = opaque ? trimmed.toDataURL("image/jpeg", 0.92) : null;
      const src = jpeg && jpeg.length < png.length ? jpeg : png;

      const clearedEffects = Object.fromEntries(IMAGE_EFFECTS.flatMap((effect) => [
        [effect.key, undefined],
        ...effect.controls.map((c) => [c.prop, undefined]),
      ]));
      return {
        ...clearedEffects,
        src,
        x: ann.x + (left - marginPx) / scale,
        y: ann.y + (top - marginPx) / scale,
        width: trimmedW / scale,
        height: trimmedH / scale,
        naturalWidth: trimmedW,
        naturalHeight: trimmedH,
        cropX: undefined, cropY: undefined, cropW: undefined, cropH: undefined,
        // Any filter is baked in now; an unfiltered image can keep following the page.
        filter: filter.type === "none" ? ann.filter : { type: "none" },
      };
    }

    // Resolves which loaded pdf.js document a page belongs to. Pages can
    // now come from more than one source PDF (the original load, plus any
    // PDFs brought in via Insert PDF), so `pdfDocsRef` is a map of
    // docId -> { doc, bytes } rather than a single ref — `bytes` is kept
    // alongside the parsed doc purely so Save Project can re-embed the
    // original file later without pdf.js needing to expose it itself.
    function docFor(pdfDocsRef, page) {
      const entry = pdfDocsRef.current[page.docId];
      return entry ? entry.doc : null;
    }

    // Real pixel size of a page at a given scale, in the same coordinate
    // space annotations are positioned in (accounts for blank-page vs. PDF
    // page and 90°/270° rotation swapping width/height). Used for centering
    // a newly-added image on whichever page is currently selected.
    async function getPageDisplaySize(page, pdfDocsRef, scale) {
      if (page.isBlank) {
        const swapped = page.rotation % 180 !== 0;
        return {
          width: Math.round((swapped ? page.height : page.width) * scale),
          height: Math.round((swapped ? page.width : page.height) * scale),
        };
      }
      const pdfPage = await docFor(pdfDocsRef, page).getPage(page.pageNumber);
      const viewport = pdfPage.getViewport({ scale, rotation: page.rotation });
      return { width: viewport.width, height: viewport.height };
    }

    async function renderPageToCanvas(page, pdfDocsRef, exportScale, pageFilter) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let w, h;
      if (page.isBlank) {
        const swapped = page.rotation % 180 !== 0;
        w = Math.round((swapped ? page.height : page.width) * exportScale);
        h = Math.round((swapped ? page.width : page.height) * exportScale);
        canvas.width = w; canvas.height = h;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
      } else {
        const pdfPage = await docFor(pdfDocsRef, page).getPage(page.pageNumber);
        const viewport = pdfPage.getViewport({ scale: exportScale, rotation: page.rotation });
        w = viewport.width; h = viewport.height;
        canvas.width = w; canvas.height = h;
        await pdfPage.render({ canvasContext: ctx, viewport }).promise;
      }

      const scaleFactor = exportScale / MAIN_SCALE; // annotation coords were recorded in the editor's on-screen canvas space
      applyPageFilter(ctx, canvas, pageFilter, scaleFactor); // background only — drawn before any annotation touches the canvas
      // The annotation list is the stacking order: first is the bottom layer.
      for (const a of page.annotations || []) {
        if (!a.hidden) await drawAnnotationOnCanvas(ctx, a, scaleFactor, pageFilter);
      }
      return canvas;
    }

    function canvasToArrayBuffer(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(async (blob) => {
          if (!blob) { reject(new Error("Couldn't encode a page image.")); return; }
          resolve(await blob.arrayBuffer());
        }, "image/png");
      });
    }

    // Same native Save-As pattern Markdown-to-PDF and Zine Arranger use —
    // falls back to a forced download for browsers without the File
    // System Access API (Firefox, Safari). Shared by Export PDF and Save
    // Project — `data` can be bytes, a string, or a Blob.
    async function saveFile(data, filename, mimeType, description, extensions) {
      if (typeof window.showSaveFilePicker === "function") {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description, accept: { [mimeType]: extensions } }],
          });
          const writable = await handle.createWritable();
          await writable.write(data);
          await writable.close();
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // user closed the dialog — not an error
          // fall through to the download fallback below
        }
      }
      const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function savePdfBytes(bytes, filename) {
      return saveFile(bytes, filename, "application/pdf", "PDF file", [".pdf"]);
    }

    // Base64 <-> ArrayBuffer, for embedding a source PDF's raw bytes inside
    // a saved project's JSON. Chunked to avoid blowing the call stack that
    // spreading a huge byte array into String.fromCharCode would risk.
    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      const chunkSize = 0x8000;
      let binary = "";
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // Renders a blank white page straight to a data URL — no pdf.js
    // involved, since a blank page has no underlying PDF page to render.

    function makeBlankThumb(width, height, rotation, scale) {
      const s = scale || THUMB_SCALE;
      const swapped = rotation % 180 !== 0;
      const w = Math.max(1, Math.round((swapped ? height : width) * s));
      const h = Math.max(1, Math.round((swapped ? width : height) * s));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      return canvas.toDataURL();
    }

    // ---- Guides overlay -----------------------------------------------
    // Trim/margin/bleed guides drawn in real page geometry: `width`/`height`
    // are the page's current on-screen pixel size (points * MAIN_SCALE, same
    // space annotations live in), so a preset's inch dimensions convert to
    // px via POINTS_PER_INCH * MAIN_SCALE and the trim box centers exactly
    // on the physical page — no matter the page's actual size or rotation.
    function GuidesOverlay({ width, height, format, marginIn, bleedIn }) {
      const preset = GUIDE_FORMAT_PRESETS.find((p) => p.key === format) || GUIDE_FORMAT_PRESETS[0];
      const toPx = (inches) => inches * POINTS_PER_INCH * MAIN_SCALE;

      const trimW = preset.widthIn ? Math.min(width, toPx(preset.widthIn)) : width;
      const trimH = preset.heightIn ? Math.min(height, toPx(preset.heightIn)) : height;
      const trimX = (width - trimW) / 2;
      const trimY = (height - trimH) / 2;
      const showTrim = preset.key !== "match"; // page edge already reads as the trim line otherwise

      const marginPx = toPx(marginIn || 0);
      const marginW = trimW - marginPx * 2, marginH = trimH - marginPx * 2;
      const showMargin = marginPx > 0 && marginW > 0 && marginH > 0;

      const bleedPx = toPx(bleedIn || 0);
      const showBleed = bleedPx > 0;

      return (
        <svg className="ze-guides-overlay" width={width} height={height} aria-hidden="true">
          {showBleed && (
            <rect
              x={trimX - bleedPx} y={trimY - bleedPx} width={trimW + bleedPx * 2} height={trimH + bleedPx * 2}
              fill="none" stroke="#dd531a" strokeDasharray="2 4" strokeWidth="1" opacity="0.6"
            />
          )}
          {showTrim && (
            <rect x={trimX} y={trimY} width={trimW} height={trimH} fill="none" stroke="#ffffff" strokeDasharray="5 3" strokeWidth="1.25" opacity="0.85" />
          )}
          {showMargin && (
            <rect
              x={trimX + marginPx} y={trimY + marginPx} width={marginW} height={marginH}
              fill="none" stroke="#dd531a" strokeDasharray="4 3" strokeWidth="1.25"
            />
          )}
        </svg>
      );
    }

    // Before layers, items were drawn by type whatever order they were
    // added in, so projects saved back then are sorted to look the same.
    function legacyLayerOrder(annotations) {
      const rank = { image: 0, stroke: 1, text: 2 };
      return annotations.slice().sort((a, b) => rank[a.type] - rank[b.type]);
    }

    // The old indices in their new order after moving a block of items in
    // front of slot `insertBefore`, or null if nothing changes.
    function orderAfterMove(count, fromIndices, insertBefore) {
      const moving = new Set(fromIndices);
      const allIndices = Array.from({ length: count }, (_, i) => i);
      const block = allIndices.filter((i) => moving.has(i));
      const rest = allIndices.filter((i) => !moving.has(i));
      const insertAt = rest.filter((i) => i < insertBefore).length;
      const newOrder = [...rest.slice(0, insertAt), ...block, ...rest.slice(insertAt)];
      return newOrder.every((oldIdx, newIdx) => oldIdx === newIdx) ? null : newOrder;
    }

    function bboxOf(ann) {
      if (ann.type === "text") {
        return { x: ann.x, y: ann.y, width: ann.width || 160, height: ann.height || 26 };
      }
      const xs = ann.points.map((p) => p[0]);
      const ys = ann.points.map((p) => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      return { x: minX, y: minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
    }

    // Selection handles, positioned by their compass name.
    const ALL_RESIZE_HANDLES = ["nw", "n", "ne", "e", "se", "s", "sw", "w"];
    // A text box's height always follows its text, so it has no top/bottom handles.
    const TEXT_RESIZE_HANDLES = ["nw", "ne", "e", "se", "sw", "w"];

    function ResizeHandles({ handles, onStart }) {
      return handles.map((handle) => (
        <div
          key={handle}
          className={"ze-resize-handle ze-resize-handle-" + handle}
          onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); onStart(handle, e); }}
        />
      ));
    }

    // ---- One text annotation --------------------------------------------
    // The text itself always lays out the box. While editing it's hidden
    // and a transparent <textarea> fills that same box, so typing looks
    // exactly like the finished text and the box grows as it would.
    function AnnotationText({ ann, tool, isSelected, isEditing, showHandles, zoom, onPress, onStartEdit, onFinishEdit, onUpdate }) {
      const boxRef = useRef(null);
      const inputRef = useRef(null);
      const pendingCaretRef = useRef(null);

      useLayoutEffect(() => {
        if (!isEditing || !inputRef.current) return;
        const caret = pendingCaretRef.current != null ? pendingCaretRef.current : ann.text.length;
        pendingCaretRef.current = null;
        inputRef.current.focus();
        inputRef.current.setSelectionRange(caret, caret);
      }, [isEditing]);

      function startEditingAt(x, y) {
        pendingCaretRef.current = textOffsetAtPoint(x, y, boxRef.current, ann.text.length);
        onStartEdit(ann.id);
      }

      function handleMouseDown(e) {
        if (isEditing) { e.stopPropagation(); return; }
        if (tool !== "select" && tool !== "text") return; // other tools (pen/highlighter/etc.) work straight through text boxes
        const { clientX, clientY } = e;
        onPress(e, ann, () => { if (tool === "text") startEditingAt(clientX, clientY); });
      }

      function startResize(handle, e) {
        const orig = { x: ann.x, y: ann.y, width: boxRef.current.offsetWidth, height: boxRef.current.offsetHeight };
        const origFontSize = ann.fontSize || 16;
        const hasSetWidth = Boolean(ann.width);
        const dragDelta = dragDeltaFrom(e, zoom);
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          if (handle === "e" || handle === "w") {
            const box = resizedBox(orig, handle, dx, dy, false);
            onUpdate(ann.id, { x: box.x, width: box.width });
            return;
          }
          // Corners scale the text; the box's width scales along with it.
          const box = resizedBox(orig, handle, dx, dy, true);
          const scaled = { x: box.x, y: box.y, fontSize: Math.max(6, Math.round(origFontSize * box.width / orig.width)) };
          onUpdate(ann.id, hasSetWidth ? { ...scaled, width: box.width } : scaled);
        });
      }

      const style = {
        left: ann.x,
        top: ann.y,
        fontFamily: ann.fontFamily ? `'${ann.fontFamily}', sans-serif` : undefined,
        fontSize: (ann.fontSize || 16) + "px",
        fontWeight: ann.bold ? 700 : 400,
        fontStyle: ann.italic ? "italic" : "normal",
        textDecoration: ann.underline ? "underline" : "none",
        color: ann.color,
        textAlign: ann.align || "left",
      };
      if (ann.width) style.width = ann.width;
      else style.maxWidth = AUTO_TEXT_MAX_WIDTH;

      return (
        <div
          ref={boxRef}
          data-ann-id={ann.id}
          className={"ze-ann-text" + (isSelected ? " is-selected" : "") + (isEditing ? " is-editing" : "") + (ann.locked ? " is-locked" : "")}
          style={style}
          onMouseDown={handleMouseDown}
          onDoubleClick={(e) => {
            e.stopPropagation();
            if (tool === "select" && !isEditing) startEditingAt(e.clientX, e.clientY);
          }}
        >
          {isEditing ? (
            <React.Fragment>
              {/* The zero-width space gives a trailing blank line some height. */}
              <span className="ze-ann-text-mirror">{ann.text + "​"}</span>
              <textarea
                ref={inputRef}
                className="ze-ann-text-input"
                value={ann.text}
                spellCheck="false"
                onChange={(e) => onUpdate(ann.id, { text: e.target.value })}
                onBlur={onFinishEdit}
                onMouseDown={(e) => e.stopPropagation()}
                onKeyDown={(e) => {
                  if (e.key === "Escape") { e.stopPropagation(); onFinishEdit(); }
                }}
              />
            </React.Fragment>
          ) : (
            <span>{ann.text ? ann.text : <span className="ze-ann-text-placeholder">Text</span>}</span>
          )}
          {showHandles && !isEditing && <ResizeHandles handles={TEXT_RESIZE_HANDLES} onStart={startResize} />}
        </div>
      );
    }

    // Shadow and opacity for a box's whole artwork. Kept off the box itself
    // so they don't apply to its handles or trap them under other layers.
    function boxGroupStyle(ann) {
      const shadow = imageShadowOffset(ann);
      const opacity = opacityOf(ann);
      return {
        filter: shadow ? `drop-shadow(${shadow.x}px ${shadow.y}px ${shadow.blur}px ${shadow.color})` : undefined,
        opacity: opacity < 1 ? opacity : undefined,
      };
    }

    // The texture and stroke drawn over a box's content.
    function BoxEffectOverlays({ ann, edgeOutline }) {
      const textureCanvasRef = useRef(null);
      const textureKey = ann.texture ? JSON.stringify(effectSettings(ann, TEXTURE_EFFECT)) : null;
      const stroke = ann.stroke ? effectSettings(ann, STROKE_EFFECT) : null;

      useEffect(() => {
        const canvas = textureCanvasRef.current;
        if (!textureKey || !canvas) return;
        canvas.width = Math.max(1, Math.ceil(ann.width));
        canvas.height = Math.max(1, Math.ceil(ann.height));
        drawTextureMarks(canvas.getContext("2d"), ann);
      }, [textureKey, ann.width, ann.height]);

      return (
        <React.Fragment>
          {ann.texture && (
            <canvas ref={textureCanvasRef} className="ze-ann-image-texture" style={{ clipPath: edgeOutline ? `path("${edgeOutline}")` : undefined }} />
          )}
          {stroke && (
            <svg className="ze-ann-image-stroke" width={ann.width} height={ann.height} aria-hidden="true">
              <path
                d={edgeOutline || rectOutline(ann)}
                fill="none"
                stroke={stroke.strokeColor}
                strokeWidth={stroke.strokeThickness}
                strokeLinejoin="miter"
                strokeMiterlimit={STROKE_MITER_LIMIT}
              />
            </svg>
          )}
        </React.Fragment>
      );
    }

    // ---- One rectangle --------------------------------------------------
    // Resizes freely on every handle; Shift keeps its proportions.
    function AnnotationRect({ ann, tool, isSelected, showHandles, onPress, onUpdate, zoom }) {
      function startResize(handle, e) {
        const orig = { x: ann.x, y: ann.y, width: ann.width, height: ann.height };
        const dragDelta = dragDeltaFrom(e, zoom);
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          onUpdate(ann.id, resizedBox(orig, handle, dx, dy, ev.shiftKey, MIN_RECT_SIZE));
        });
      }

      const edgeOutline = imageEdgeOutline(ann);
      const { fillColor } = controlValues(ann, RECT_CONTROLS);
      return (
        <div
          data-ann-id={ann.id}
          className={"ze-ann-image" + (isSelected ? " is-selected" : "") + (ann.locked ? " is-locked" : "")}
          style={{ left: ann.x, top: ann.y, width: ann.width, height: ann.height }}
          onMouseDown={(e) => { if (tool === "select") onPress(e, ann); }}
        >
          <div className="ze-ann-image-shadow" style={boxGroupStyle(ann)}>
            <div className="ze-ann-rect-fill" style={{ backgroundColor: fillColor, clipPath: edgeOutline ? `path("${edgeOutline}")` : undefined }} />
            <BoxEffectOverlays ann={ann} edgeOutline={edgeOutline} />
          </div>
          {showHandles && <ResizeHandles handles={ALL_RESIZE_HANDLES} onStart={startResize} />}
        </div>
      );
    }

    // ---- One placed image --------------------------------------------
    // Drag to move (Select tool, same pattern as text). A resize handle
    // in the bottom-right corner appears only when selected — dragging it
    // scales width/height together, keeping the image's aspect ratio
    // rather than letting it stretch. Cropping isn't built yet — this is
    // add/move/resize/select/delete only, deliberately scoped that way.
    const MIN_CROP_SIZE = 20; // natural px — keeps a crop drag from collapsing to nothing

    function AnnotationImage({ ann, tool, isSelected, showHandles, isCropping, onPress, onUpdate, onToggleCrop, pageFilter, zoom }) {
      const halftoneCanvasRef = useRef(null);
      const naturalW = ann.naturalWidth, naturalH = ann.naturalHeight;
      // Crop is a sub-rect of the source image, in ITS OWN natural pixel
      // space — undefined/missing fields mean "no crop yet" (the full
      // image), so existing annotations from before cropping existed keep
      // working with no migration needed.
      const cropX = ann.cropX || 0, cropY = ann.cropY || 0;
      const cropW = ann.cropW || naturalW, cropH = ann.cropH || naturalH;
      // On-page size of one source pixel. The two differ once an image has
      // been stretched with Shift, which Export PDF draws the same way.
      const displayScaleX = ann.width / cropW, displayScaleY = ann.height / cropH;

      // Proportions stay locked on every handle unless Shift is held.
      function startResize(handle, e) {
        const orig = { x: ann.x, y: ann.y, width: ann.width, height: ann.height };
        const dragDelta = dragDeltaFrom(e, zoom);
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          onUpdate(ann.id, resizedBox(orig, handle, dx, dy, !ev.shiftKey));
        });
      }

      // Both crop gestures work in a fixed "px on screen per natural px"
      // scale established at drag-start, and a fixed image origin (where
      // the source image's own (0,0) pixel sits on screen) — panning only
      // ever moves cropX/cropY within that fixed frame, and resizing only
      // ever moves the crop rect's edges, so the two never fight each other.
      function startCropPan(e) {
        e.preventDefault();
        e.stopPropagation();
        const dragDelta = dragDeltaFrom(e, zoom);
        const origCropX = cropX, origCropY = cropY;
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          const dxNat = dx / displayScaleX;
          const dyNat = dy / displayScaleY;
          const newCropX = Math.min(Math.max(0, origCropX - dxNat), Math.max(0, naturalW - cropW));
          const newCropY = Math.min(Math.max(0, origCropY - dyNat), Math.max(0, naturalH - cropH));
          onUpdate(ann.id, { cropX: newCropX, cropY: newCropY });
        });
      }

      function startCropCornerResize(corner, e) {
        e.preventDefault();
        e.stopPropagation();
        const imageOriginX = ann.x - cropX * displayScaleX;
        const imageOriginY = ann.y - cropY * displayScaleY;
        const dragDelta = dragDeltaFrom(e, zoom);
        const orig = { cropX, cropY, cropW, cropH };
        trackPointerDrag((ev) => {
          const { dx, dy } = dragDelta(ev);
          const dxNat = dx / displayScaleX;
          const dyNat = dy / displayScaleY;
          let cx = orig.cropX, cy = orig.cropY, cw = orig.cropW, ch = orig.cropH;
          if (corner === "se") { cw = orig.cropW + dxNat; ch = orig.cropH + dyNat; }
          else if (corner === "ne") { cy = orig.cropY + dyNat; cw = orig.cropW + dxNat; ch = orig.cropH - dyNat; }
          else if (corner === "sw") { cx = orig.cropX + dxNat; cw = orig.cropW - dxNat; ch = orig.cropH + dyNat; }
          else { cx = orig.cropX + dxNat; cy = orig.cropY + dyNat; cw = orig.cropW - dxNat; ch = orig.cropH - dyNat; } // nw
          cw = Math.max(MIN_CROP_SIZE, cw);
          ch = Math.max(MIN_CROP_SIZE, ch);
          cx = Math.min(Math.max(0, cx), orig.cropX + orig.cropW - MIN_CROP_SIZE);
          cy = Math.min(Math.max(0, cy), orig.cropY + orig.cropH - MIN_CROP_SIZE);
          cw = Math.min(cw, naturalW - cx);
          ch = Math.min(ch, naturalH - cy);
          onUpdate(ann.id, {
            cropX: cx, cropY: cy, cropW: cw, cropH: ch,
            x: imageOriginX + cx * displayScaleX, y: imageOriginY + cy * displayScaleY,
            width: cw * displayScaleX, height: ch * displayScaleY,
          });
        });
      }

      // An image's own filter (if it has one — see effectiveImageFilter)
      // takes over from the page filter entirely for that image, rather
      // than combining with it. Grayscale/duotone are approximated live
      // via an SVG filter built from the exact same luminance/lerp formula
      // applyColorRemap uses on canvas, so preview and Export PDF match.
      // Halftone has no CSS-filter equivalent (it replaces pixels with
      // dots, not a per-pixel remap), so that case swaps the <img> for a
      // <canvas> the effect below draws the dot pattern onto directly,
      // same drawHalftoneScreen the background and Export use — sourced from
      // the crop sub-rect via drawImage's source-rect args, which crops
      // "for free" without a separate step.
      const imgFilter = effectiveImageFilter(ann, pageFilter);
      const filterType = imgFilter.type;
      const usesFilterCanvas = Boolean(FILTER_CONTROLS[filterType]);
      const filterCanvasKey = usesFilterCanvas ? JSON.stringify(imgFilter) : null;

      useEffect(() => {
        if (!usesFilterCanvas || isCropping) return;
        let cancelled = false;
        (async () => {
          const img = await loadImageElement(ann.src);
          if (cancelled) return;
          const canvas = halftoneCanvasRef.current;
          if (!canvas) return;
          const w = Math.max(1, Math.round(ann.width));
          const h = Math.max(1, Math.round(ann.height));
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, w, h);
          applyPageFilter(ctx, canvas, imgFilter, 1);
        })();
        return () => { cancelled = true; };
      }, [filterCanvasKey, isCropping, ann.src, ann.width, ann.height, cropX, cropY, cropW, cropH]);

      // Crop-editing view — shows the WHOLE source image (dimmed outside
      // the current crop window) at the scale the crop rect is already
      // displayed at, so entering/leaving crop mode doesn't jump the
      // image's apparent zoom. Deliberately no separate confirm/cancel:
      // every crop adjustment goes through onUpdate, so it's just another
      // undo-able edit like any other, rather than its own modal state.
      if (isCropping) {
        const imageOriginX = ann.x - cropX * displayScaleX;
        const imageOriginY = ann.y - cropY * displayScaleY;
        const fullW = naturalW * displayScaleX, fullH = naturalH * displayScaleY;
        const winX = cropX * displayScaleX, winY = cropY * displayScaleY, winW = cropW * displayScaleX, winH = cropH * displayScaleY;
        return (
          <div className="ze-ann-image ze-ann-image--cropping" style={{ left: imageOriginX, top: imageOriginY, width: fullW, height: fullH }}>
            <img src={ann.src} alt="" draggable="false" className="ze-crop-full-img" />
            <div className="ze-crop-mask" style={{ left: 0, top: 0, width: "100%", height: winY }} />
            <div className="ze-crop-mask" style={{ left: 0, top: winY + winH, width: "100%", height: Math.max(0, fullH - (winY + winH)) }} />
            <div className="ze-crop-mask" style={{ left: 0, top: winY, width: winX, height: winH }} />
            <div className="ze-crop-mask" style={{ left: winX + winW, top: winY, width: Math.max(0, fullW - (winX + winW)), height: winH }} />
            <div className="ze-crop-window" style={{ left: winX, top: winY, width: winW, height: winH }} onMouseDown={startCropPan}>
              <div className="ze-crop-handle ze-crop-handle-nw" onMouseDown={(e) => startCropCornerResize("nw", e)} />
              <div className="ze-crop-handle ze-crop-handle-ne" onMouseDown={(e) => startCropCornerResize("ne", e)} />
              <div className="ze-crop-handle ze-crop-handle-sw" onMouseDown={(e) => startCropCornerResize("sw", e)} />
