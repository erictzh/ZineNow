<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEditor</title>

<!-- React 18 (UMD) + Babel Standalone, all from CDN via normal <script>
     tags — that kind of resource load isn't subject to file://'s fetch
     restriction, unlike a fetch()/XHR read would be. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- pdf.js — a local copy (own folder, not shared with Zine Arranger, so
     this app stays self-contained), loaded the same proven way Zine
     Arranger already uses it. -->
<script src="./pdfjs/build/pdf.js"></script>

<!-- pdf-lib — local copy, used only for Export: assembles the rendered
     page images into a real downloadable PDF. -->
<script src="./pdf-lib/pdf-lib.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <!--
    JSX lives inline here, NOT loaded via <script type="text/babel" src="...">.
    Babel Standalone fetches a src file with its own internal XHR to read it
    before transforming — which is exactly the kind of read file:// blocks.
    Inline content has no such fetch: the browser already parsed it as part
    of this document, so Babel Standalone just transforms text that's
    already sitting in the DOM. Same file://-safety principle as
    Markdown-to-PDF's precompiled App.jsx, different mechanism.
  -->
  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo } = React;

    const THUMB_SCALE = 0.3;
    const MAIN_SCALE = 1.1;
    const DEFAULT_PAGE_SIZE = { width: 420, height: 594 }; // used only if no PDF has been loaded yet

    // Guides — trim/margin/bleed presets, in inches. Page geometry
    // (page.width/height, canvas px at MAIN_SCALE) is already in points
    // (72/in), same unit pdf.js and PDFs use, so presets convert cleanly.
    const POINTS_PER_INCH = 72;
    const GUIDE_FORMAT_PRESETS = [
      { key: "match", label: "Match Page Size" },
      { key: "half-letter", label: "Half Letter (5.5 × 8.5 in)", widthIn: 5.5, heightIn: 8.5 },
      { key: "digest", label: "Digest (5.5 × 8.25 in)", widthIn: 5.5, heightIn: 8.25 },
      { key: "a5", label: "A5 (5.83 × 8.27 in)", widthIn: 5.83, heightIn: 8.27 },
      { key: "a6", label: "A6 (4.13 × 5.83 in)", widthIn: 4.13, heightIn: 5.83 },
      { key: "quarter-letter", label: "Quarter Letter (4.25 × 5.5 in)", widthIn: 4.25, heightIn: 5.5 },
      { key: "letter", label: "US Letter (8.5 × 11 in)", widthIn: 8.5, heightIn: 11 },
      { key: "a4", label: "A4 (8.27 × 11.69 in)", widthIn: 8.27, heightIn: 11.69 },
    ];
    const DEFAULT_GUIDE_MARGIN_IN = 0.25;
    const DEFAULT_GUIDE_BLEED_IN = 0.125;

    // Undo/redo — one entry per discrete action (a finished drag, a
    // committed edit, a delete, a rotate), not per pixel or keystroke.
    // Rapid repeats of the SAME gesture (a drag's mousemoves, a slider
    // being dragged, keystrokes while typing) collapse into one entry by
    // sharing a coalesce key within this window; letting go and coming
    // back starts a fresh entry. See recordUndoCheckpoint in App.
    const UNDO_COALESCE_MS = 700;
    const MAX_UNDO_HISTORY = 50;

    // Page filter — a photocopier/screen-print treatment applied to both
    // the page background and any placed images. Pen and text annotations
    // are never touched, so your own marks stay crisp on top. Applies both
    // live and in Export PDF. Global across the whole document, same scope
    // as Guides, rather than per-page — real zines usually want one
    // consistent treatment throughout.
    const PAGE_FILTER_OPTIONS = [
      { key: "none", label: "None" },
      { key: "grayscale", label: "Grayscale" },
      { key: "duotone", label: "Duotone" },
      { key: "halftone", label: "Halftone" },
    ];
    // Same four treatments, plus "Match Page" — an image's own filter
    // defaults to following whatever the page filter is, same as before
    // this existed, rather than starting every image at "None".
    const IMAGE_FILTER_OPTIONS = [
      { key: "match", label: "Match Page" },
      { key: "none", label: "None" },
      { key: "grayscale", label: "Grayscale" },
      { key: "duotone", label: "Duotone" },
      { key: "halftone", label: "Halftone" },
    ];
    const DEFAULT_DUOTONE_DARK = "#1a1a1a";
    const DEFAULT_DUOTONE_LIGHT = "#ffe066";
    const DEFAULT_HALFTONE_CELL_SIZE = 6;
    const MIN_HALFTONE_CELL_SIZE = 1;
    const DEFAULT_HALFTONE_COLOR = "#1a1a1a";
    const DEFAULT_PAGE_FILTER = { type: "none" };

    // Resolves what an image annotation should actually be filtered with:
    // no `ann.filter` (or type "match") follows the page filter, exactly
    // like every image behaved before per-image filters existed; type
    // "none" opts an image out even when the page has a filter; anything
    // else is the image's own independent filter settings.
    function effectiveImageFilter(ann, pageFilter) {
      const f = ann.filter;
      if (!f || f.type === "match") return pageFilter || { type: "none" };
      if (f.type === "none") return { type: "none" };
      return f;
    }

    // Starting font presets, shown before (or alongside) any fonts loaded
    // from the browser via the Local Font Access API — see FontCombobox.
    // Plain family names, same convention Markdown-to-PDF uses: applied as
    // `'${name}', sans-serif` at render time, so an unrecognized/unavailable
    // name just falls back to the browser's default sans rather than erroring.
    const DEFAULT_FONT_OPTIONS = ["Inter", "Georgia", "Courier New", "Comic Sans MS", "Impact"];

    const TEXT_COLOR_SWATCHES = ["#1a1a1a", "#ffffff", "#dd531a", "#2563eb", "#16a34a", "#dc2626", "#eab308"];
    const PEN_COLOR_SWATCHES = ["#1a1a1a", "#dd531a", "#dc2626", "#2563eb"];
    const HIGHLIGHTER_COLOR_SWATCHES = ["#ffe066", "#ffb84d", "#7ec8ff", "#ff9ecf", "#7dffb3"];

    const PEN_DEFAULTS = { color: "#1a1a1a", width: 2.5 };
    const HIGHLIGHTER_DEFAULTS = { color: "#ffe066", width: 14 };

    // Turns raw recorded points into a smoothed SVG path — quadratic curves
    // through the midpoint of each consecutive pair, using the shared point
    // as the control. A common, cheap freehand-smoothing trick: it rounds
    // off the jagged look of raw mouse samples without needing pressure
    // data (which a mouse doesn't have) or an external library. Hit-testing
    // for the eraser still uses the original raw points, not this curve.
    function smoothPathD(points) {
      if (points.length < 2) return "";
      if (points.length === 2) {
        return `M ${points[0][0]},${points[0][1]} L ${points[1][0]},${points[1][1]}`;
      }
      let d = `M ${points[0][0]},${points[0][1]}`;
      for (let i = 1; i < points.length - 1; i++) {
        const [x0, y0] = points[i];
        const [x1, y1] = points[i + 1];
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        d += ` Q ${x0},${y0} ${mx},${my}`;
      }
      const last = points[points.length - 1];
      d += ` L ${last[0]},${last[1]}`;
      return d;
    }

    // Shortest distance from point p to the segment a-b — used by the
    // eraser to decide whether it's passing close enough to a stroke.
    function distToSegment(p, a, b) {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const lenSq = dx * dx + dy * dy;
      let t = lenSq === 0 ? 0 : ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / lenSq;
      t = Math.max(0, Math.min(1, t));
      const cx = a[0] + t * dx, cy = a[1] + t * dy;
      return Math.hypot(p[0] - cx, p[1] - cy);
    }

    function strokeHitTest(point, ann) {
      const threshold = (ann.strokeWidth || 8) / 2 + 6;
      for (let i = 0; i < ann.points.length - 1; i++) {
        if (distToSegment(point, ann.points[i], ann.points[i + 1]) <= threshold) return true;
      }
      return false;
    }

    // ---- Variable-width (tapered) stroke outline --------------------------
    // A plain SVG <path stroke-width> can't vary along its length, so a
    // real taper means building a filled silhouette instead: offset each
    // point perpendicular to the stroke's direction by half the width AT
    // THAT POINT, narrowing near both ends when taper > 0. `taper` is a
    // fraction (0–0.45) of the stroke's total length that each end spends
    // ramping in/out; 0 means constant width (no taper) the whole way.
    function taperedPathD(points, baseWidth, taper) {
      if (points.length < 2) return "";
      const dists = [0];
      for (let i = 1; i < points.length; i++) {
        dists.push(dists[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
      }
      const total = dists[dists.length - 1] || 1;
      const tf = Math.min(0.45, Math.max(0, taper));

      function widthAt(t) {
        if (tf <= 0) return baseWidth;
        let factor;
        if (t < tf) factor = t / tf;
        else if (t > 1 - tf) factor = (1 - t) / tf;
        else factor = 1;
        return Math.max(baseWidth * 0.12, baseWidth * factor);
      }

      const left = [], right = [];
      for (let i = 0; i < points.length; i++) {
        const t = dists[i] / total;
        const w = widthAt(t) / 2;
        const prev = points[Math.max(0, i - 1)];
        const next = points[Math.min(points.length - 1, i + 1)];
        let dx = next[0] - prev[0], dy = next[1] - prev[1];
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        const nx = -dy, ny = dx;
        left.push([points[i][0] + nx * w, points[i][1] + ny * w]);
        right.push([points[i][0] - nx * w, points[i][1] - ny * w]);
      }

      let d = `M ${left[0][0]},${left[0][1]}`;
      for (let i = 1; i < left.length; i++) d += ` L ${left[i][0]},${left[i][1]}`;
      for (let i = right.length - 1; i >= 0; i--) d += ` L ${right[i][0]},${right[i][1]}`;
      d += " Z";
      return d;
    }

    // ==========================================================================
    // Export — renders each page (background + all annotations) to a canvas
    // at export resolution, exactly reusing the same stroke geometry
    // (smoothPathD/taperedPathD) the live editor draws with via Path2D, so
    // the exported PDF always matches what's on screen. Text is redrawn
    // with manual word-wrapping since canvas has no built-in text-wrap.
    // ==========================================================================
    const EXPORT_DPI = 200;
    const EXPORT_SCALE = EXPORT_DPI / 72; // PDF/pdf.js "scale 1" is 72 DPI

    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
      return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 };
    }

    // Same Rec.601 coefficients applyColorRemap uses, as an SVG
    // feColorMatrix — puts luminance into R, G, and B alike so a
    // feComponentTransfer right after it can remap that single value per
    // channel (see App's hidden <defs>, used by AnnotationImage's live
    // grayscale/duotone preview).
    const LUMINANCE_MATRIX_VALUES = "0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0.299 0.587 0.114 0 0 0 0 0 1 0";

    // Classic newsprint halftone: samples average luminance per grid cell
    // from the source pixels, then redraws that cell as a single dot whose
    // radius tracks darkness, on a white background — replaces the
    // continuous-tone image entirely, same as a real halftone plate.
    function drawHalftoneDots(ctx, sourceImageData, width, height, cellSize, color) {
      const data = sourceImageData.data;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = color;
      const maxRadius = cellSize * 0.62;
      for (let cy = 0; cy < height; cy += cellSize) {
        const ch = Math.min(cellSize, height - cy);
        for (let cx = 0; cx < width; cx += cellSize) {
          const cw = Math.min(cellSize, width - cx);
          let sum = 0, count = 0;
          for (let y = 0; y < ch; y++) {
            const rowStart = ((cy + y) * width + cx) * 4;
            for (let x = 0; x < cw; x++) {
              const idx = rowStart + x * 4;
              sum += data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
              count++;
            }
          }
          const avgLum = count ? sum / count / 255 : 1;
          const radius = (1 - avgLum) * maxRadius;
          if (radius > 0.4) {
            ctx.beginPath();
            ctx.arc(cx + cw / 2, cy + ch / 2, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }

    // Grayscale/duotone pixel remap, in place on whatever's painted on
    // `ctx` — the shared piece of applyPageFilter (background) and
    // drawImageOnCanvas (a placed image, remapped on its own offscreen
    // canvas before compositing, so the remap never bleeds into
    // surrounding page pixels). Halftone isn't a simple per-pixel remap
    // (it replaces pixels with dots via drawHalftoneDots), so both call
    // sites branch around this function for that case instead.
    function applyColorRemap(ctx, canvas, filter) {
      const { width, height } = canvas;
      if (width === 0 || height === 0) return;
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;
      if (filter.type === "grayscale") {
        for (let i = 0; i < data.length; i += 4) {
          const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          data[i] = data[i + 1] = data[i + 2] = lum;
        }
      } else if (filter.type === "duotone") {
        const dark = hexToRgb(filter.darkColor || DEFAULT_DUOTONE_DARK);
        const light = hexToRgb(filter.lightColor || DEFAULT_DUOTONE_LIGHT);
        for (let i = 0; i < data.length; i += 4) {
          const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
          data[i] = dark.r + (light.r - dark.r) * lum;
          data[i + 1] = dark.g + (light.g - dark.g) * lum;
          data[i + 2] = dark.b + (light.b - dark.b) * lum;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    // Applies the page-level filter to whatever's currently painted on
    // `ctx` (the page background, drawn just before this is called) —
    // grayscale/duotone remap pixels in place, halftone replaces them
    // outright. `scaleFactor` converts cellSize from its editor-px unit
    // to this canvas's actual resolution (1 live, EXPORT_SCALE/MAIN_SCALE
    // on export), same convention drawStrokeOnCanvas uses for strokeWidth.
    function applyPageFilter(ctx, canvas, filter, scaleFactor) {
      if (!filter || filter.type === "none" || canvas.width === 0 || canvas.height === 0) return;
      if (filter.type === "grayscale" || filter.type === "duotone") {
        applyColorRemap(ctx, canvas, filter);
      } else if (filter.type === "halftone") {
        const { width, height } = canvas;
        const imageData = ctx.getImageData(0, 0, width, height);
        const cellSize = Math.max(MIN_HALFTONE_CELL_SIZE, (filter.cellSize || DEFAULT_HALFTONE_CELL_SIZE) * scaleFactor);
        drawHalftoneDots(ctx, imageData, width, height, cellSize, filter.color || DEFAULT_HALFTONE_COLOR);
      }
    }

    // ---- Torn-edge clip — a deterministic jagged boundary (a sine-based
    // hash instead of Math.random(), so the exact same shape is available
    // to both the live CSS clip-path and the export canvas's Path2D clip,
    // with no seed needing to be stored on the annotation). Points are in
    // the image's own 0..width/0..height space.
    function tornEdgePoints(width, height) {
      const step = Math.max(6, Math.min(width, height) / 10);
      const jitter = step * 0.6;
      function noise(i) {
        const v = Math.sin(i * 12.9898) * 43758.5453;
        return v - Math.floor(v);
      }
      const points = [];
      let i = 0;
      for (let x = 0; x <= width; x += step) points.push([x, noise(i++) * jitter]);
      for (let y = step; y <= height; y += step) points.push([width - noise(i++) * jitter, y]);
      for (let x = width - step; x >= 0; x -= step) points.push([x, height - noise(i++) * jitter]);
      for (let y = height - step; y >= step; y -= step) points.push([noise(i++) * jitter, y]);
      return points;
    }

    function tornEdgeClipPathCss(width, height) {
      if (width <= 0 || height <= 0) return undefined;
      const pts = tornEdgePoints(width, height);
      return "polygon(" + pts.map(([x, y]) => `${(x / width * 100).toFixed(2)}% ${(y / height * 100).toFixed(2)}%`).join(", ") + ")";
    }

    function clipTornEdge(ctx, width, height) {
      const pts = tornEdgePoints(width, height);
      ctx.beginPath();
      pts.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.closePath();
      ctx.clip();
    }

    function drawStrokeOnCanvas(ctx, ann, scaleFactor) {
      const isHi = ann.tool === "highlighter";
      const color = ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color);
      const width = (ann.strokeWidth || (isHi ? HIGHLIGHTER_DEFAULTS.width : PEN_DEFAULTS.width)) * scaleFactor;
      const taper = ann.taper || 0;
      const pts = ann.points.map((p) => [p[0] * scaleFactor, p[1] * scaleFactor]);
      ctx.save();
      ctx.globalAlpha = isHi ? 0.45 : 1;
      if (taper > 0) {
        ctx.fillStyle = color;
        ctx.fill(new Path2D(taperedPathD(pts, width, taper)));
      } else {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke(new Path2D(smoothPathD(pts)));
      }
      ctx.restore();
    }

    // Word-based wrapping (canvas has no auto-wrap) — also respects
    // explicit newlines, matching the editor's `white-space: pre-wrap`.
    function wrapTextLines(ctx, text, maxWidth) {
      const paragraphs = (text || "").split("\n");
      const lines = [];
      for (const para of paragraphs) {
        if (para === "") { lines.push(""); continue; }
        const words = para.split(" ");
        let current = "";
        for (const word of words) {
          const test = current ? current + " " + word : word;
          if (current && ctx.measureText(test).width > maxWidth) {
            lines.push(current);
            current = word;
          } else {
            current = test;
          }
        }
        lines.push(current);
      }
      return lines;
    }

    function drawTextOnCanvas(ctx, ann, scaleFactor) {
      const fontSize = (ann.fontSize || 16) * scaleFactor;
      const weight = ann.bold ? "700" : "400";
      const styleStr = ann.italic ? "italic" : "normal";
      const family = ann.fontFamily || "sans-serif";
      ctx.font = `${styleStr} ${weight} ${fontSize}px '${family}', sans-serif`;
      ctx.textBaseline = "top";
      ctx.fillStyle = ann.color || "#1a1a1a";

      const x = ann.x * scaleFactor;
      const y = ann.y * scaleFactor;
      const padX = 4 * scaleFactor, padY = 2 * scaleFactor;
      const maxWidthCap = 320 * scaleFactor;

      let boxWidth;
      if (ann.width) {
        boxWidth = ann.width * scaleFactor;
      } else {
        const naturalWidth = Math.max(10, ...(ann.text || "").split("\n").map((l) => ctx.measureText(l).width));
        boxWidth = Math.min(naturalWidth + padX * 2, maxWidthCap);
      }
      const innerWidth = Math.max(4, boxWidth - padX * 2);
      const lines = wrapTextLines(ctx, ann.text || "", innerWidth);
      const lineHeight = fontSize * 1.3;

      lines.forEach((line, i) => {
        const lineWidth = ctx.measureText(line).width;
        let lineX = x + padX;
        if (ann.align === "center") lineX = x + (boxWidth - lineWidth) / 2;
        else if (ann.align === "right") lineX = x + boxWidth - padX - lineWidth;
        const lineY = y + padY + i * lineHeight;
        ctx.fillText(line, lineX, lineY);
        if (ann.underline && line) {
          ctx.save();
          ctx.strokeStyle = ann.color || "#1a1a1a";
          ctx.lineWidth = Math.max(1, fontSize * 0.06);
          const underlineY = lineY + fontSize * 0.92;
          ctx.beginPath();
          ctx.moveTo(lineX, underlineY);
          ctx.lineTo(lineX + lineWidth, underlineY);
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    // Renders one full page (background + annotations) to an offscreen
    // canvas at export resolution. Kept independent from ComposeCanvas's
    // own live-editing render path (some duplicated logic, but it avoids
    // any risk of an export-specific change accidentally affecting the
    // already-tested live editor).
    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Couldn't load a placed image for export."));
        img.src = src;
      });
    }

    async function drawImageOnCanvas(ctx, ann, scaleFactor, pageFilter) {
      const img = await loadImageElement(ann.src);
      const x = ann.x * scaleFactor, y = ann.y * scaleFactor;
      const w = ann.width * scaleFactor, h = ann.height * scaleFactor;

      // Crop is just a source rect into the natural image — undefined
      // fields mean "no crop" (the whole image), matching AnnotationImage.
      let sx = ann.cropX || 0, sy = ann.cropY || 0;
      let sw = ann.cropW || img.naturalWidth || w, sh = ann.cropH || img.naturalHeight || h;
      let source = img;

      // An image's own filter (if it has one) takes over from the page
      // filter entirely, rather than the two combining — see
      // effectiveImageFilter. Rendered on its own offscreen canvas, sized
      // to the image's TARGET on-page size (not its natural resolution) —
      // that matters for halftone specifically, so its dot cells come out
      // the same physical size as the background's. Doing this before
      // compositing also means a torn edge's clip never leaks the filter
      // into surrounding page pixels.
      const imgFilter = effectiveImageFilter(ann, pageFilter);
      const filterType = imgFilter.type;
      if (filterType === "grayscale" || filterType === "duotone" || filterType === "halftone") {
        const off = document.createElement("canvas");
        off.width = Math.max(1, Math.round(w));
        off.height = Math.max(1, Math.round(h));
        const octx = off.getContext("2d");
        octx.drawImage(img, sx, sy, sw, sh, 0, 0, off.width, off.height);
        if (filterType === "halftone") {
          const imageData = octx.getImageData(0, 0, off.width, off.height);
          const cellSize = Math.max(MIN_HALFTONE_CELL_SIZE, (imgFilter.cellSize || DEFAULT_HALFTONE_CELL_SIZE) * scaleFactor);
          drawHalftoneDots(octx, imageData, off.width, off.height, cellSize, imgFilter.color || DEFAULT_HALFTONE_COLOR);
        } else {
          applyColorRemap(octx, off, imgFilter);
        }
        source = off;
        sx = 0; sy = 0; sw = off.width; sh = off.height;
      }

      if (ann.tornEdge) {
        ctx.save();
        ctx.translate(x, y);
        clipTornEdge(ctx, w, h);
        ctx.drawImage(source, sx, sy, sw, sh, 0, 0, w, h);
        ctx.restore();
      } else {
        ctx.drawImage(source, sx, sy, sw, sh, x, y, w, h);
      }
    }

    // Resolves which loaded pdf.js document a page belongs to. Pages can
    // now come from more than one source PDF (the original load, plus any
    // PDFs brought in via Insert PDF), so `pdfDocsRef` is a map of
    // docId -> { doc, bytes } rather than a single ref — `bytes` is kept
    // alongside the parsed doc purely so Save Project can re-embed the
    // original file later without pdf.js needing to expose it itself.
    function docFor(pdfDocsRef, page) {
      const entry = pdfDocsRef.current[page.docId];
      return entry ? entry.doc : null;
    }

    // Real pixel size of a page at a given scale, in the same coordinate
    // space annotations are positioned in (accounts for blank-page vs. PDF
    // page and 90°/270° rotation swapping width/height). Used for centering
    // a newly-added image on whichever page is currently selected.
    async function getPageDisplaySize(page, pdfDocsRef, scale) {
      if (page.isBlank) {
        const swapped = page.rotation % 180 !== 0;
        return {
          width: Math.round((swapped ? page.height : page.width) * scale),
          height: Math.round((swapped ? page.width : page.height) * scale),
        };
      }
      const pdfPage = await docFor(pdfDocsRef, page).getPage(page.pageNumber);
      const viewport = pdfPage.getViewport({ scale, rotation: page.rotation });
      return { width: viewport.width, height: viewport.height };
    }

    async function renderPageToCanvas(page, pdfDocsRef, exportScale, pageFilter) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let w, h;
      if (page.isBlank) {
        const swapped = page.rotation % 180 !== 0;
        w = Math.round((swapped ? page.height : page.width) * exportScale);
        h = Math.round((swapped ? page.width : page.height) * exportScale);
        canvas.width = w; canvas.height = h;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, w, h);
      } else {
        const pdfPage = await docFor(pdfDocsRef, page).getPage(page.pageNumber);
        const viewport = pdfPage.getViewport({ scale: exportScale, rotation: page.rotation });
        w = viewport.width; h = viewport.height;
        canvas.width = w; canvas.height = h;
        await pdfPage.render({ canvasContext: ctx, viewport }).promise;
      }

      const scaleFactor = exportScale / MAIN_SCALE; // annotation coords were recorded in the editor's on-screen canvas space
      applyPageFilter(ctx, canvas, pageFilter, scaleFactor); // background only — drawn before any annotation touches the canvas
      const annotations = page.annotations || [];
      // Images first (bottom), then strokes, then text on top — matches
      // the editor's own DOM layering in the annotation overlay.
      for (const a of annotations.filter((a) => a.type === "image")) {
        await drawImageOnCanvas(ctx, a, scaleFactor, pageFilter);
      }
      annotations.filter((a) => a.type === "stroke").forEach((a) => drawStrokeOnCanvas(ctx, a, scaleFactor));
      annotations.filter((a) => a.type === "text").forEach((a) => drawTextOnCanvas(ctx, a, scaleFactor));
      return canvas;
    }

    function canvasToArrayBuffer(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(async (blob) => {
          if (!blob) { reject(new Error("Couldn't encode a page image.")); return; }
          resolve(await blob.arrayBuffer());
        }, "image/png");
      });
    }

    // Same native Save-As pattern Markdown-to-PDF and Zine Arranger use —
    // falls back to a forced download for browsers without the File
    // System Access API (Firefox, Safari). Shared by Export PDF and Save
    // Project — `data` can be bytes, a string, or a Blob.
    async function saveFile(data, filename, mimeType, description, extensions) {
      if (typeof window.showSaveFilePicker === "function") {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description, accept: { [mimeType]: extensions } }],
          });
          const writable = await handle.createWritable();
          await writable.write(data);
          await writable.close();
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return; // user closed the dialog — not an error
          // fall through to the download fallback below
        }
      }
      const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function savePdfBytes(bytes, filename) {
      return saveFile(bytes, filename, "application/pdf", "PDF file", [".pdf"]);
    }

    // Base64 <-> ArrayBuffer, for embedding a source PDF's raw bytes inside
    // a saved project's JSON. Chunked to avoid blowing the call stack that
    // spreading a huge byte array into String.fromCharCode would risk.
    function arrayBufferToBase64(buf) {
      const bytes = new Uint8Array(buf);
      const chunkSize = 0x8000;
      let binary = "";
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    // Renders a blank white page straight to a data URL — no pdf.js
    // involved, since a blank page has no underlying PDF page to render.

    function makeBlankThumb(width, height, rotation, scale) {
      const s = scale || THUMB_SCALE;
      const swapped = rotation % 180 !== 0;
      const w = Math.max(1, Math.round((swapped ? height : width) * s));
      const h = Math.max(1, Math.round((swapped ? width : height) * s));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      return canvas.toDataURL();
    }

    // ---- Guides overlay -----------------------------------------------
    // Trim/margin/bleed guides drawn in real page geometry: `width`/`height`
    // are the page's current on-screen pixel size (points * MAIN_SCALE, same
    // space annotations live in), so a preset's inch dimensions convert to
    // px via POINTS_PER_INCH * MAIN_SCALE and the trim box centers exactly
    // on the physical page — no matter the page's actual size or rotation.
    function GuidesOverlay({ width, height, format, marginIn, bleedIn }) {
      const preset = GUIDE_FORMAT_PRESETS.find((p) => p.key === format) || GUIDE_FORMAT_PRESETS[0];
      const toPx = (inches) => inches * POINTS_PER_INCH * MAIN_SCALE;

      const trimW = preset.widthIn ? Math.min(width, toPx(preset.widthIn)) : width;
      const trimH = preset.heightIn ? Math.min(height, toPx(preset.heightIn)) : height;
      const trimX = (width - trimW) / 2;
      const trimY = (height - trimH) / 2;
      const showTrim = preset.key !== "match"; // page edge already reads as the trim line otherwise

      const marginPx = toPx(marginIn || 0);
      const marginW = trimW - marginPx * 2, marginH = trimH - marginPx * 2;
      const showMargin = marginPx > 0 && marginW > 0 && marginH > 0;

      const bleedPx = toPx(bleedIn || 0);
      const showBleed = bleedPx > 0;

      return (
        <svg className="ze-guides-overlay" width={width} height={height} aria-hidden="true">
          {showBleed && (
            <rect
              x={trimX - bleedPx} y={trimY - bleedPx} width={trimW + bleedPx * 2} height={trimH + bleedPx * 2}
              fill="none" stroke="#dd531a" strokeDasharray="2 4" strokeWidth="1" opacity="0.6"
            />
          )}
          {showTrim && (
            <rect x={trimX} y={trimY} width={trimW} height={trimH} fill="none" stroke="#ffffff" strokeDasharray="5 3" strokeWidth="1.25" opacity="0.85" />
          )}
          {showMargin && (
            <rect
              x={trimX + marginPx} y={trimY + marginPx} width={marginW} height={marginH}
              fill="none" stroke="#dd531a" strokeDasharray="4 3" strokeWidth="1.25"
            />
          )}
        </svg>
      );
    }

    function bboxOf(ann) {
      if (ann.type === "text") {
        return { x: ann.x, y: ann.y, width: ann.width || 160, height: ann.height || 26 };
      }
      const xs = ann.points.map((p) => p[0]);
      const ys = ann.points.map((p) => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      return { x: minX, y: minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
    }

    // ---- One text annotation --------------------------------------------
    // Plain non-interactive <div> when idle (so a mousedown can mean "start
    // dragging" without fighting a native text cursor); swaps to a real
    // <textarea> only while editing. Double-click (or any click while the
    // Text tool is active) enters edit mode.
    function AnnotationText({ ann, tool, isSelected, startEditing, onSelect, onUpdate, onSwitchToTextTool }) {
      const [editing, setEditing] = useState(!!startEditing);

      // Click vs. drag are told apart by movement, not by click count: a
      // mousedown that releases with barely any movement is a click
      // (select + edit + switch the toolbar to Text); one that moves past
      // a small threshold first is a drag (just reposition, never edit).
      // Selection itself fires immediately on mousedown either way, so the
      // box highlights the instant you press down, same as before.
      function handleMouseDown(e) {
        if (tool !== "select" && tool !== "text") return; // other tools (pen/highlighter/etc.) shouldn't drag or select text boxes
        e.preventDefault();
        e.stopPropagation();
        onSelect(ann.id, e.shiftKey);
        const startX = e.clientX, startY = e.clientY;
        const origX = ann.x, origY = ann.y;
        let moved = false;
        const DRAG_THRESHOLD = 4;
        const move = (ev) => {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          if (!moved && Math.hypot(dx, dy) > DRAG_THRESHOLD) moved = true;
          if (moved) onUpdate(ann.id, { x: origX + dx, y: origY + dy });
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
          if (!moved) {
            // A genuine click, not a drag — enter edit mode and make the
            // toolbar/panel reflect Text, matching what's now happening.
            onSwitchToTextTool && onSwitchToTextTool();
            setEditing(true);
          }
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      }

      const style = {
        left: ann.x,
        top: ann.y,
        fontFamily: ann.fontFamily ? `'${ann.fontFamily}', sans-serif` : undefined,
        fontSize: (ann.fontSize || 16) + "px",
        fontWeight: ann.bold ? 700 : 400,
        fontStyle: ann.italic ? "italic" : "normal",
        textDecoration: ann.underline ? "underline" : "none",
        color: ann.color,
        textAlign: ann.align || "left",
      };
      // Explicit size only if the box has been manually resized at least
      // once (see onMouseUp below) — otherwise both stay auto/shrink-to-fit,
      // matching the original behavior for untouched boxes.
      if (ann.width) style.width = ann.width;
      if (ann.height) style.height = ann.height;

      if (editing) {
        return (
          <textarea
            className="ze-ann-text ze-ann-text--editing"
            style={style}
            autoFocus
            value={ann.text}
            onChange={(e) => onUpdate(ann.id, { text: e.target.value })}
            onBlur={(e) => {
              // Always re-sync size on the way out, not just after an
              // explicit resize drag — otherwise a box that was never
              // manually resized snaps from the textarea's actual on-screen
              // size down to the plain <div>'s shrink-to-fit size the
              // instant you click away, which read as the box "shrinking
              // itself" even though nothing was actually lost.
              onUpdate(ann.id, { width: e.target.offsetWidth, height: e.target.offsetHeight });
              setEditing(false);
            }}
            onMouseDown={(e) => e.stopPropagation()}
            onMouseUp={(e) => {
              // Fires after any drag on the textarea, including a resize
              // drag via its native corner handle — harmless to call when
              // nothing was actually resized, since it just re-syncs the
              // current size. Without this, a resize is lost the moment
              // editing ends and the box swaps back to the idle <div>.
              onUpdate(ann.id, { width: e.target.offsetWidth, height: e.target.offsetHeight });
            }}
            onKeyDown={(e) => {
              // Escape steps back to "selected, not editing" — the only
              // way to reach that state at all, since a click either edits
              // the box (not moved) or drags it (moved), and clicking away
              // deselects entirely. Needed so Ctrl+C has something to copy:
              // a text box's own Ctrl+C is otherwise unreachable, since
              // while you're still focused in the textarea, Ctrl+C is
              // deliberately left alone for the browser's native "copy the
              // highlighted text" behavior instead.
              if (e.key === "Escape") { e.stopPropagation(); e.currentTarget.blur(); }
            }}
          />
        );
      }

      return (
        <div
          className={"ze-ann-text" + (isSelected ? " is-selected" : "")}
          style={style}
          onMouseDown={handleMouseDown}
          onDoubleClick={(e) => e.stopPropagation()}
        >
          {ann.text ? ann.text : <span className="ze-ann-text-placeholder">Text</span>}
        </div>
      );
    }

    // ---- One placed image --------------------------------------------
    // Drag to move (Select tool, same pattern as text). A resize handle
    // in the bottom-right corner appears only when selected — dragging it
    // scales width/height together, keeping the image's aspect ratio
    // rather than letting it stretch. Cropping isn't built yet — this is
    // add/move/resize/select/delete only, deliberately scoped that way.
    const MIN_CROP_SIZE = 20; // natural px — keeps a crop drag from collapsing to nothing

    function AnnotationImage({ ann, tool, isSelected, isPrimary, isCropping, onSelect, onUpdate, onToggleCrop, pageFilter }) {
      const halftoneCanvasRef = useRef(null);
      const naturalW = ann.naturalWidth, naturalH = ann.naturalHeight;
      // Crop is a sub-rect of the source image, in ITS OWN natural pixel
      // space — undefined/missing fields mean "no crop yet" (the full
      // image), so existing annotations from before cropping existed keep
      // working with no migration needed.
      const cropX = ann.cropX || 0, cropY = ann.cropY || 0;
      const cropW = ann.cropW || naturalW, cropH = ann.cropH || naturalH;

      function startDrag(e) {
        if (tool !== "select") return;
        e.preventDefault();
        e.stopPropagation();
        onSelect(ann.id, e.shiftKey);
        const startX = e.clientX, startY = e.clientY;
        const origX = ann.x, origY = ann.y;
        const move = (ev) => {
          onUpdate(ann.id, { x: origX + (ev.clientX - startX), y: origY + (ev.clientY - startY) });
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      }

      function startResize(e) {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const origWidth = ann.width;
        const aspect = cropH / cropW; // the CROPPED aspect ratio, not the source image's
        const move = (ev) => {
          const newWidth = Math.max(20, origWidth + (ev.clientX - startX));
          onUpdate(ann.id, { width: newWidth, height: newWidth * aspect });
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      }

      // Both crop gestures work in a fixed "px on screen per natural px"
      // scale established at drag-start, and a fixed image origin (where
      // the source image's own (0,0) pixel sits on screen) — panning only
      // ever moves cropX/cropY within that fixed frame, and resizing only
      // ever moves the crop rect's edges, so the two never fight each other.
      function startCropPan(e) {
        e.preventDefault();
        e.stopPropagation();
        const scale = ann.width / cropW;
        const startX = e.clientX, startY = e.clientY;
        const origCropX = cropX, origCropY = cropY;
        const move = (ev) => {
          const dxNat = (ev.clientX - startX) / scale;
          const dyNat = (ev.clientY - startY) / scale;
          const newCropX = Math.min(Math.max(0, origCropX - dxNat), Math.max(0, naturalW - cropW));
          const newCropY = Math.min(Math.max(0, origCropY - dyNat), Math.max(0, naturalH - cropH));
          onUpdate(ann.id, { cropX: newCropX, cropY: newCropY });
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      }

      function startCropCornerResize(corner, e) {
        e.preventDefault();
        e.stopPropagation();
        const scale = ann.width / cropW;
        const imageOriginX = ann.x - cropX * scale;
        const imageOriginY = ann.y - cropY * scale;
        const startX = e.clientX, startY = e.clientY;
        const orig = { cropX, cropY, cropW, cropH };
        const move = (ev) => {
          const dxNat = (ev.clientX - startX) / scale;
          const dyNat = (ev.clientY - startY) / scale;
          let cx = orig.cropX, cy = orig.cropY, cw = orig.cropW, ch = orig.cropH;
          if (corner === "se") { cw = orig.cropW + dxNat; ch = orig.cropH + dyNat; }
          else if (corner === "ne") { cy = orig.cropY + dyNat; cw = orig.cropW + dxNat; ch = orig.cropH - dyNat; }
          else if (corner === "sw") { cx = orig.cropX + dxNat; cw = orig.cropW - dxNat; ch = orig.cropH + dyNat; }
          else { cx = orig.cropX + dxNat; cy = orig.cropY + dyNat; cw = orig.cropW - dxNat; ch = orig.cropH - dyNat; } // nw
          cw = Math.max(MIN_CROP_SIZE, cw);
          ch = Math.max(MIN_CROP_SIZE, ch);
          cx = Math.min(Math.max(0, cx), orig.cropX + orig.cropW - MIN_CROP_SIZE);
          cy = Math.min(Math.max(0, cy), orig.cropY + orig.cropH - MIN_CROP_SIZE);
          cw = Math.min(cw, naturalW - cx);
          ch = Math.min(ch, naturalH - cy);
          onUpdate(ann.id, {
            cropX: cx, cropY: cy, cropW: cw, cropH: ch,
            x: imageOriginX + cx * scale, y: imageOriginY + cy * scale,
            width: cw * scale, height: ch * scale,
          });
        };
        const up = () => {
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      }

      // An image's own filter (if it has one — see effectiveImageFilter)
      // takes over from the page filter entirely for that image, rather
      // than combining with it. Grayscale/duotone are approximated live
      // via an SVG filter built from the exact same luminance/lerp formula
      // applyColorRemap uses on canvas, so preview and Export PDF match.
      // Halftone has no CSS-filter equivalent (it replaces pixels with
      // dots, not a per-pixel remap), so that case swaps the <img> for a
      // <canvas> the effect below draws the dot pattern onto directly,
      // same drawHalftoneDots the background and Export use — sourced from
      // the crop sub-rect via drawImage's source-rect args, which crops
      // "for free" without a separate step.
      const imgFilter = effectiveImageFilter(ann, pageFilter);
      const filterType = imgFilter.type;
      const isHalftone = filterType === "halftone";

      useEffect(() => {
        if (!isHalftone || isCropping) return;
        let cancelled = false;
        (async () => {
          const img = await loadImageElement(ann.src);
          if (cancelled) return;
          const canvas = halftoneCanvasRef.current;
          if (!canvas) return;
          const w = Math.max(1, Math.round(ann.width));
          const h = Math.max(1, Math.round(ann.height));
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, w, h);
          const imageData = ctx.getImageData(0, 0, w, h);
          const cellSize = Math.max(MIN_HALFTONE_CELL_SIZE, imgFilter.cellSize || DEFAULT_HALFTONE_CELL_SIZE);
          drawHalftoneDots(ctx, imageData, w, h, cellSize, imgFilter.color || DEFAULT_HALFTONE_COLOR);
        })();
        return () => { cancelled = true; };
      }, [isHalftone, isCropping, ann.src, ann.width, ann.height, cropX, cropY, cropW, cropH, imgFilter.cellSize, imgFilter.color]);

      // Crop-editing view — shows the WHOLE source image (dimmed outside
      // the current crop window) at the scale the crop rect is already
      // displayed at, so entering/leaving crop mode doesn't jump the
      // image's apparent zoom. Deliberately no separate confirm/cancel:
      // every crop adjustment goes through onUpdate, so it's just another
      // undo-able edit like any other, rather than its own modal state.
      if (isCropping) {
        const scale = ann.width / cropW;
        const imageOriginX = ann.x - cropX * scale;
        const imageOriginY = ann.y - cropY * scale;
        const fullW = naturalW * scale, fullH = naturalH * scale;
        const winX = cropX * scale, winY = cropY * scale, winW = cropW * scale, winH = cropH * scale;
        return (
          <div className="ze-ann-image ze-ann-image--cropping" style={{ left: imageOriginX, top: imageOriginY, width: fullW, height: fullH }}>
            <img src={ann.src} alt="" draggable="false" className="ze-crop-full-img" />
            <div className="ze-crop-mask" style={{ left: 0, top: 0, width: "100%", height: winY }} />
            <div className="ze-crop-mask" style={{ left: 0, top: winY + winH, width: "100%", height: Math.max(0, fullH - (winY + winH)) }} />
            <div className="ze-crop-mask" style={{ left: 0, top: winY, width: winX, height: winH }} />
            <div className="ze-crop-mask" style={{ left: winX + winW, top: winY, width: Math.max(0, fullW - (winX + winW)), height: winH }} />
            <div className="ze-crop-window" style={{ left: winX, top: winY, width: winW, height: winH }} onMouseDown={startCropPan}>
              <div className="ze-crop-handle ze-crop-handle-nw" onMouseDown={(e) => startCropCornerResize("nw", e)} />
              <div className="ze-crop-handle ze-crop-handle-ne" onMouseDown={(e) => startCropCornerResize("ne", e)} />
              <div className="ze-crop-handle ze-crop-handle-sw" onMouseDown={(e) => startCropCornerResize("sw", e)} />
              <div className="ze-crop-handle ze-crop-handle-se" onMouseDown={(e) => startCropCornerResize("se", e)} />
            </div>
          </div>
        );
      }

      // Grayscale always reuses the one global filter (no colors to
      // differ). Duotone reuses it too UNLESS this image has its own
      // duotone colors, in which case it gets its own uniquely-id'd
      // <filter> rendered right below, since the global one is tuned to
      // the page's duotone colors, not necessarily this image's.
      const hasOwnDuotone = ann.filter && ann.filter.type === "duotone";
      const duotoneFilterId = hasOwnDuotone ? "ze-filter-duotone-img-" + ann.id : "ze-filter-duotone";
      const cssFilter =
        filterType === "grayscale" ? "url(#ze-filter-grayscale)" :
        filterType === "duotone" ? `url(#${duotoneFilterId})` : undefined;
      const frameStyle = {};
      if (ann.tornEdge) frameStyle.clipPath = tornEdgeClipPathCss(ann.width, ann.height);
      if (cssFilter) frameStyle.filter = cssFilter;
      const ownDuotoneDarkRgb = hasOwnDuotone ? hexToRgb(imgFilter.darkColor || DEFAULT_DUOTONE_DARK) : null;
      const ownDuotoneLightRgb = hasOwnDuotone ? hexToRgb(imgFilter.lightColor || DEFAULT_DUOTONE_LIGHT) : null;

      // Un-cropped display scale/offset — when there's no crop these
      // collapse to (0,0) and the image's natural size, so an uncropped
      // image renders exactly as it always did.
      const scale = ann.width / cropW;

      return (
        <div
          className={"ze-ann-image" + (isSelected ? " is-selected" : "")}
          style={{ left: ann.x, top: ann.y, width: ann.width, height: ann.height }}
          onMouseDown={(e) => { if (tool === "select") startDrag(e); else e.stopPropagation(); }}
        >
          {isHalftone ? (
            <canvas ref={halftoneCanvasRef} style={frameStyle} />
          ) : (
            <div className="ze-ann-image-frame" style={frameStyle}>
              <img
                src={ann.src}
                alt=""
                draggable="false"
                style={{ position: "absolute", left: -cropX * scale, top: -cropY * scale, width: naturalW * scale, height: naturalH * scale }}
              />
            </div>
          )}
          {isPrimary && tool === "select" && (
            <div className="ze-ann-image-handle" onMouseDown={startResize} title="Drag to resize" />
          )}
          {hasOwnDuotone && (
            <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
              <defs>
                <filter id={duotoneFilterId} colorInterpolationFilters="sRGB">
                  <feColorMatrix type="matrix" values={LUMINANCE_MATRIX_VALUES} />
                  <feComponentTransfer>
                    <feFuncR type="linear" slope={(ownDuotoneLightRgb.r - ownDuotoneDarkRgb.r) / 255} intercept={ownDuotoneDarkRgb.r / 255} />
                    <feFuncG type="linear" slope={(ownDuotoneLightRgb.g - ownDuotoneDarkRgb.g) / 255} intercept={ownDuotoneDarkRgb.g / 255} />
                    <feFuncB type="linear" slope={(ownDuotoneLightRgb.b - ownDuotoneDarkRgb.b) / 255} intercept={ownDuotoneDarkRgb.b / 255} />
                  </feComponentTransfer>
                </filter>
              </defs>
            </svg>
          )}
        </div>
      );
    }

    // ---- One freehand stroke (pen or highlighter) -----------------------
    // Rendered as a smoothed SVG path; a dashed bounding box appears around
    // it when selected. The stroke itself only captures clicks in Select
    // tool (pointer-events toggle below) so it doesn't intercept
    // drawing/text clicks meant for the page background.
    function StrokeShape({ ann, tool, isSelected, onSelect }) {
      const isHi = ann.tool === "highlighter";
      const color = ann.color || (isHi ? HIGHLIGHTER_DEFAULTS.color : PEN_DEFAULTS.color);
      const width = ann.strokeWidth || (isHi ? HIGHLIGHTER_DEFAULTS.width : PEN_DEFAULTS.width);
      const taper = ann.taper || 0;
      const box = bboxOf(ann);
      const handleMouseDown = (e) => { if (tool === "select") { e.stopPropagation(); onSelect(ann.id, e.shiftKey); } };
      const selectCursor = { cursor: tool === "select" ? "pointer" : "default" };
      return (
        <React.Fragment>
          {taper > 0 ? (
            <path
              d={taperedPathD(ann.points, width, taper)}
              fill={color}
              fillOpacity={isHi ? 0.45 : 1}
              stroke="none"
              style={{ pointerEvents: tool === "select" ? "fill" : "none", ...selectCursor }}
              onMouseDown={handleMouseDown}
            />
          ) : (
            <path
              d={smoothPathD(ann.points)}
              fill="none"
              stroke={color}
              strokeWidth={width}
              strokeOpacity={isHi ? 0.45 : 1}
              strokeLinecap="round"
              strokeLinejoin="round"
              style={{ pointerEvents: tool === "select" ? "stroke" : "none", ...selectCursor }}
              onMouseDown={handleMouseDown}
            />
          )}
          {isSelected && (
            <rect
              x={box.x - 6} y={box.y - 6}
              width={box.width + 12} height={box.height + 12}
              fill="none" stroke="#dd531a" strokeDasharray="4 3" strokeWidth="1.5"
              pointerEvents="none"
            />
          )}
        </React.Fragment>
      );
    }

    // ---- Compose canvas — renders the selected page at full size, plus
    // the annotation layer (images + text boxes + freehand strokes) on
    // top of it.
    function ComposeCanvas({
      pdfDocsRef, page, guidesOn, guideFormat, guideMarginIn, guideBleedIn, tool,
      pageFilter, onionGhostSrc, onionSkinOpacity,
      penColor, penWidth, penTaper, highlighterColor, highlighterWidth, highlighterTaper,
      annotations, selectedAnnId, selectedAnnIds, autoEditAnnId, croppingAnnId,
      onSelectAnnotation, onAddText, onAddStroke, onUpdateAnnotation, onEraseStroke, onSwitchToTextTool, onToggleCrop,
    }) {
      const canvasRef = useRef(null);
      const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
      const drawingRef = useRef(null); // in-progress stroke points while the mouse is down
      const [drawTick, setDrawTick] = useState(0); // bumped on every drawing mousemove to force a repaint

      useEffect(() => {
        if (!page) return;
        let cancelled = false;
        (async () => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          let w, h;
          if (page.isBlank) {
            const swapped = page.rotation % 180 !== 0;
            w = Math.round((swapped ? page.height : page.width) * MAIN_SCALE);
            h = Math.round((swapped ? page.width : page.height) * MAIN_SCALE);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, w, h);
          } else {
            const doc = docFor(pdfDocsRef, page);
            if (!doc) return;
            const pdfPage = await doc.getPage(page.pageNumber);
            const viewport = pdfPage.getViewport({ scale: MAIN_SCALE, rotation: page.rotation });
            if (cancelled) return;
            w = viewport.width;
            h = viewport.height;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            await pdfPage.render({ canvasContext: ctx, viewport }).promise;
          }
          if (cancelled) return;
          applyPageFilter(canvas.getContext("2d"), canvas, pageFilter, 1); // background only, same as Export
          setCanvasSize({ width: w, height: h });
        })();
        return () => { cancelled = true; };
      }, [page && page.key, page && page.rotation, pageFilter]);

      function overlayPoint(e) {
        const rect = canvasRef.current.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      function handleOverlayMouseDown(e) {
        if (!page) return;
        if (tool === "pen" || tool === "highlighter") {
          const start = overlayPoint(e);
          const color = tool === "highlighter" ? highlighterColor : penColor;
          const width = tool === "highlighter" ? highlighterWidth : penWidth;
          const taper = tool === "highlighter" ? highlighterTaper : penTaper;
          drawingRef.current = { tool, color, width, taper, points: [[start.x, start.y]] };
          setDrawTick((t) => t + 1);
          const move = (ev) => {
            const p = overlayPoint(ev);
            drawingRef.current.points.push([p.x, p.y]);
            setDrawTick((t) => t + 1);
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
            if (drawingRef.current && drawingRef.current.points.length > 1) {
              onAddStroke({
                tool: drawingRef.current.tool,
                points: drawingRef.current.points,
                color: drawingRef.current.color,
                strokeWidth: drawingRef.current.width,
                taper: drawingRef.current.taper,
              });
            }
            drawingRef.current = null;
            setDrawTick((t) => t + 1);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
          return;
        }
        if (tool === "eraser") {
          const erasedIds = new Set();
          const tryErase = (pt) => {
            annotations.forEach((a) => {
              if (a.type === "stroke" && !erasedIds.has(a.id) && strokeHitTest(pt, a)) {
                erasedIds.add(a.id);
                onEraseStroke(a.id);
              }
            });
          };
          tryErase([overlayPoint(e).x, overlayPoint(e).y]);
          const move = (ev) => {
            const p = overlayPoint(ev);
            tryErase([p.x, p.y]);
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
          return;
        }
        // Select or Text tool, clicking empty background: deselect. (Pen/
        // Highlighter/Eraser all returned above, so only these two tools
        // ever reach here.)
        onSelectAnnotation(null);
      }

      // Double-click on empty page background creates a new text box —
      // text creation is double-click-only now, not a single click while
      // the Text tool happens to be active.
      function handleOverlayDoubleClick(e) {
        if (!page) return;
        if (tool !== "select" && tool !== "text") return;
        // Same fix as elsewhere: without this, the browser's own default
        // mousedown action (from the clicks that make up this double-click)
        // undoes the focus we're about to set via the new box's autoFocus.
        e.preventDefault();
        const p = overlayPoint(e);
        onAddText(p.x, p.y);
      }

      if (!page) {
        return (
          <div className="preview-empty">
            No pages yet — load a PDF to get started.
          </div>
        );
      }

      const cursorClass =
        tool === "text" ? "ze-tool-text" :
        (tool === "pen" || tool === "highlighter") ? "ze-tool-draw" :
        tool === "eraser" ? "ze-tool-erase" : "";

      return (
        <div className="ze-page ze-page--rendered">
          <canvas ref={canvasRef} />
          {onionGhostSrc && (
            <img className="ze-onion-ghost" src={onionGhostSrc} alt="" style={{ opacity: onionSkinOpacity }} />
          )}
          <div
            className={"ze-annotation-layer " + cursorClass}
            style={{ width: canvasSize.width, height: canvasSize.height }}
            onMouseDown={handleOverlayMouseDown}
            onDoubleClick={handleOverlayDoubleClick}
          >
            {annotations.filter((a) => a.type === "image").map((a) => (
              <AnnotationImage
                key={a.id}
                ann={a}
                tool={tool}
                isSelected={a.id === selectedAnnId || selectedAnnIds.includes(a.id)}
                isPrimary={a.id === selectedAnnId}
                isCropping={a.id === croppingAnnId}
                onSelect={onSelectAnnotation}
                onUpdate={onUpdateAnnotation}
                onToggleCrop={onToggleCrop}
                pageFilter={pageFilter}
              />
            ))}
            <svg className="ze-stroke-svg" width={canvasSize.width} height={canvasSize.height}>
              {annotations.filter((a) => a.type === "stroke").map((a) => (
                <StrokeShape key={a.id} ann={a} tool={tool} isSelected={a.id === selectedAnnId || selectedAnnIds.includes(a.id)} onSelect={onSelectAnnotation} />
              ))}
              {drawingRef.current && (drawingRef.current.taper > 0 ? (
                <path
                  d={taperedPathD(drawingRef.current.points, drawingRef.current.width, drawingRef.current.taper)}
                  fill={drawingRef.current.color}
                  fillOpacity={drawingRef.current.tool === "highlighter" ? 0.45 : 1}
                  stroke="none"
                />
              ) : (
                <path
                  d={smoothPathD(drawingRef.current.points)}
                  fill="none"
                  stroke={drawingRef.current.color}
                  strokeWidth={drawingRef.current.width}
                  strokeOpacity={drawingRef.current.tool === "highlighter" ? 0.45 : 1}
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              ))}
            </svg>
            {annotations.filter((a) => a.type === "text").map((a) => (
              <AnnotationText
                key={a.id}
                ann={a}
                tool={tool}
                isSelected={a.id === selectedAnnId || selectedAnnIds.includes(a.id)}
                startEditing={a.id === autoEditAnnId}
                onSelect={onSelectAnnotation}
                onUpdate={onUpdateAnnotation}
                onSwitchToTextTool={onSwitchToTextTool}
              />
            ))}
          </div>
          {guidesOn && canvasSize.width > 0 && (
            <GuidesOverlay
              width={canvasSize.width}
              height={canvasSize.height}
              format={guideFormat}
              marginIn={guideMarginIn}
              bleedIn={guideBleedIn}
            />
          )}
        </div>
      );
    }

    // ---- One sidebar thumbnail ------------------------------------------
    function Thumbnail({ p, idx, isSelected, onSelect, onRotate, onDelete, dragHandlers }) {
      return (
        <div
          className={"ze-thumb" + (isSelected ? " is-selected" : "")}
          draggable="true"
          onClick={(e) => onSelect(idx, e.shiftKey)}
          {...dragHandlers}
        >
          <div className="ze-thumb-img-wrap">
            <img src={p.dataUrl} alt={p.isBlank ? "Blank page" : "Page " + p.pageNumber} />
          </div>
          <div className="ze-thumb-footer">
            <span className="ze-thumb-num">{idx + 1}</span>
            <div className="ze-thumb-actions">
              <button
                type="button"
                className="log-btn"
                title="Rotate"
                onClick={(e) => { e.stopPropagation(); onRotate(idx); }}
              >⟳</button>
              <button
                type="button"
                className="log-btn"
                title="Delete"
                onClick={(e) => { e.stopPropagation(); onDelete(idx); }}
              >
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  <path d="M4 7h16" />
                  <path d="M9 7V4h6v3" />
                  <path d="M6 7l1 13h10l1-13" />
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---- Hover gap between (or around) thumbnails — reveals a line + a
    // floating "+" to insert a blank page at that exact spot. Hover state
    // is pure CSS (:hover), so no extra JS/state is needed for it.
    function PageGap({ onInsert }) {
      return (
        <div
          className="ze-page-gap"
          role="button"
          tabIndex={0}
          title="Add blank page"
          onClick={onInsert}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onInsert(); } }}
        >
          <div className="ze-page-gap-line" />
          <span className="ze-page-gap-btn" aria-hidden="true">+</span>
        </div>
      );
    }

    // ---- Sidebar — page thumbnail strip (Organize) ---------------------
    const EDGE_SCROLL_ZONE = 44; // px from top/bottom edge that triggers scrolling
    const EDGE_SCROLL_SPEED = 4; // px per frame — deliberately slow, not a fast jump

    function Sidebar({ pages, selectedIdx, selectedPageIndices, onSelect, onRotate, onDelete, onReorder, onLoadClick, onInsertPdfClick, onInsertBlank, loading }) {
      const dragIndexRef = useRef(null);
      const bodyRef = useRef(null);
      const scrollDirRef = useRef(0); // -1 up, 0 idle, 1 down
      const rafRef = useRef(null);
      // { idx, before } — which slot is currently being dragged over, and
      // whether the drop line should sit above (before) or below it.
      const [dragOverInfo, setDragOverInfo] = useState(null);

      function startAutoScroll() {
        if (rafRef.current) return;
        const step = () => {
          const el = bodyRef.current;
          if (el && scrollDirRef.current !== 0) {
            el.scrollTop += scrollDirRef.current * EDGE_SCROLL_SPEED;
          }
          rafRef.current = requestAnimationFrame(step);
        };
        rafRef.current = requestAnimationFrame(step);
      }

      function stopAutoScroll() {
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        scrollDirRef.current = 0;
      }

      useEffect(() => stopAutoScroll, []); // safety: cancel any pending loop if the sidebar unmounts mid-drag

      // Attached to the scrollable container itself (not per-thumbnail) so
      // it keeps working no matter which child — a thumbnail or a gap — the
      // cursor happens to be over.
      function handleContainerDragOver(e) {
        const el = bodyRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const distFromTop = e.clientY - rect.top;
        const distFromBottom = rect.bottom - e.clientY;
        if (distFromTop < EDGE_SCROLL_ZONE) {
          scrollDirRef.current = -1;
        } else if (distFromBottom < EDGE_SCROLL_ZONE) {
          scrollDirRef.current = 1;
        } else {
          scrollDirRef.current = 0;
        }
      }

      function dragHandlersFor(idx) {
        return {
          onDragStart: () => { dragIndexRef.current = idx; startAutoScroll(); },
          onDragOver: (e) => {
            e.preventDefault();
            const rect = e.currentTarget.getBoundingClientRect();
            const before = e.clientY < rect.top + rect.height / 2;
            setDragOverInfo({ idx, before });
          },
          onDragLeave: () => setDragOverInfo((cur) => (cur && cur.idx === idx ? null : cur)),
          onDragEnd: () => { dragIndexRef.current = null; setDragOverInfo(null); stopAutoScroll(); },
          onDrop: (e) => {
            e.preventDefault();
            const from = dragIndexRef.current;
            const info = dragOverInfo;
            setDragOverInfo(null);
            dragIndexRef.current = null;
            stopAutoScroll();
            if (from === null || !info || from === idx) return;
            // Target's index once the dragged page has already been
            // removed from the list — matches how onReorder applies the
            // move (remove at `from`, then insert at `to`).
            const targetAfterRemoval = idx > from ? idx - 1 : idx;
            const to = targetAfterRemoval + (info.before ? 0 : 1);
            onReorder(from, to);
          },
        };
      }

      return (
        <aside className="ze-sidebar">
          <div className="ze-sidebar-head">
            <span>Pages{pages.length > 0 ? " (" + pages.length + ")" : ""}</span>
            <div className="ze-sidebar-head-actions">
              {pages.length === 0 && (
                <button type="button" onClick={onLoadClick} disabled={loading}>
                  {loading ? "Loading…" : "Load PDF"}
                </button>
              )}
              <button type="button" className="log-btn" onClick={onInsertPdfClick} disabled={loading || pages.length === 0} title="Insert another PDF's pages into this document">
                Insert PDF
              </button>
            </div>
          </div>
          <div className="ze-sidebar-body" ref={bodyRef} onDragOver={handleContainerDragOver}>
            {pages.length === 0 && !loading ? (
              <div className="ze-sidebar-empty">
                No pages yet. Click "Load PDF" to bring in a file.
              </div>
            ) : (
              <div className="ze-thumb-list">
                <PageGap onInsert={() => onInsertBlank(0)} />
                {pages.map((p, idx) => (
                  <React.Fragment key={p.key}>
                    {dragOverInfo && dragOverInfo.idx === idx && dragOverInfo.before && (
                      <div className="ze-drop-line" />
                    )}
                    <div className="ze-thumb-slot">
                      <Thumbnail
                        p={p}
                        idx={idx}
                        isSelected={idx === selectedIdx || selectedPageIndices.includes(idx)}
                        onSelect={onSelect}
                        onRotate={onRotate}
                        onDelete={onDelete}
                        dragHandlers={dragHandlersFor(idx)}
                      />
                    </div>
                    {dragOverInfo && dragOverInfo.idx === idx && !dragOverInfo.before && (
                      <div className="ze-drop-line" />
                    )}
                    <PageGap onInsert={() => onInsertBlank(idx + 1)} />
                  </React.Fragment>
                ))}
              </div>
            )}
          </div>
        </aside>
      );
    }

    // ---- Searchable font picker, with an optional "load your system's
    // fonts" button via the Local Font Access API (Chrome/Edge only, needs
    // a permission grant) — same pattern Markdown-to-PDF uses.
    function FontCombobox({ fontOptions, setFontOptions, value, onChange }) {
      const [query, setQuery] = useState(value || "");
      const [open, setOpen] = useState(false);
      const [status, setStatus] = useState(null); // { type: 'success'|'error', message }
      const [loadingFonts, setLoadingFonts] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => { setQuery(value || ""); }, [value]);

      useEffect(() => {
        function handleClickOutside(e) {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setOpen(false);
            setQuery(value || "");
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [value]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return fontOptions;
        return fontOptions.filter((f) => f.toLowerCase().includes(q));
      }, [fontOptions, query]);

      function selectFont(font) {
        onChange(font);
        setQuery(font);
        setOpen(false);
      }

      async function handleLoadLocalFonts() {
        setStatus(null);
        if (!("queryLocalFonts" in window)) {
          setStatus({ type: "error", message: "Local Font Access isn't supported in this browser — try Chrome or Edge." });
          return;
        }
        setLoadingFonts(true);
        try {
          const availableFonts = await window.queryLocalFonts();
          const families = Array.from(new Set(availableFonts.map((f) => f.family))).sort((a, b) => a.localeCompare(b));
          setFontOptions((prev) => Array.from(new Set([...prev, ...families])).sort((a, b) => a.localeCompare(b)));
          setStatus({ type: "success", message: `Loaded ${families.length} local fonts.` });
        } catch (err) {
          const denied = err && (err.name === "NotAllowedError" || /permission/i.test(err.message || ""));
          setStatus({ type: "error", message: denied ? "Permission to read local fonts was denied." : "Couldn't load local fonts." });
        } finally {
          setLoadingFonts(false);
        }
      }

      return (
        <div className="ze-fontbox" ref={containerRef}>
          <div className="ze-fontbox-input-wrap">
            <input
              type="text"
              className="ze-format-select ze-fontbox-input"
              value={query}
              onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
              onFocus={() => setOpen(true)}
              placeholder="Search fonts…"
            />
            <button type="button" className="ze-fontbox-caret" onClick={() => setOpen((o) => !o)} aria-label="Toggle font list">
              <svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M5.5 7.5l4.5 4.5 4.5-4.5" /></svg>
            </button>
          </div>
          {open && (
            <div className="ze-fontbox-list">
              {filtered.length === 0 ? (
                <div className="ze-fontbox-empty">No fonts match "{query}"</div>
              ) : (
                filtered.map((font) => (
                  <button
                    key={font}
                    type="button"
                    className={"ze-fontbox-item" + (font === value ? " active" : "")}
                    style={{ fontFamily: `'${font}', sans-serif` }}
                    onClick={() => selectFont(font)}
                  >{font}</button>
                ))
              )}
            </div>
          )}
          <button type="button" className="ze-fontbox-load" onClick={handleLoadLocalFonts} disabled={loadingFonts}>
            {loadingFonts ? "Loading…" : "+ Load Local System Fonts"}
          </button>
          {status && (
            <span className={"ze-format-hint" + (status.type === "error" ? " is-error" : "")}>{status.message}</span>
          )}
        </div>
      );
    }

    // ---- Shared color-swatches + thickness-slider fields, used for both
    // a tool's drawing defaults and an existing selected stroke's own
    // properties — same controls, different get/set targets.
    function StrokeFormatFields({ swatches, color, width, minWidth, maxWidth, taper, onColor, onWidth, onTaper }) {
      return (
        <React.Fragment>
          <div className="ze-format-field">
            <span className="ze-format-label">Thickness ({Math.round(width)}px)</span>
            <input
              type="range"
              className="ze-format-slider"
              min={minWidth}
              max={maxWidth}
              step="0.5"
              value={width}
              onChange={(e) => onWidth(Number(e.target.value))}
            />
          </div>
          <div className="ze-format-field">
            <span className="ze-format-label">Taper ({Math.round((taper || 0) * 100 / 0.45)}%)</span>
            <input
              type="range"
              className="ze-format-slider"
              min="0"
              max="0.45"
              step="0.01"
              value={taper || 0}
              onChange={(e) => onTaper(Number(e.target.value))}
            />
            <span className="ze-format-hint">Thins each end toward a point. 0% keeps a constant, rounded-off width.</span>
          </div>
          <div className="ze-format-field">
            <span className="ze-format-label">Color</span>
            <div className="ze-format-row ze-format-swatches">
              {swatches.map((c) => (
                <button
                  key={c}
                  type="button"
                  className={"ze-format-swatch" + (color === c ? " active" : "")}
                  style={{ backgroundColor: c }}
                  title={c}
                  onClick={() => onColor(c)}
                />
              ))}
              <input
                type="color"
                className="ze-format-color-input"
                value={/^#[0-9a-fA-F]{6}$/.test(color) ? color : "#000000"}
                onChange={(e) => onColor(e.target.value)}
                title="Custom color"
              />
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ---- Right-side panel. What it shows depends on context, in priority
    // order: a selected annotation's own formatting first (text or
    // stroke), then the active tool's drawing defaults (text/pen/
    // highlighter), then an empty state. Clicking a toolbar tool clears
    // any selection (see App's selectTool), so picking a tool reliably
    // brings up that tool's own defaults here.
    function FormatPanel({
      tool, selectedAnn, onUpdate, fontOptions, setFontOptions, croppingAnnId, onToggleCrop,
      textFontFamily, textFontSize, textBold, textItalic, textUnderline, textColor, textAlign,
      onChangeTextFontFamily, onChangeTextFontSize, onChangeTextBold, onChangeTextItalic, onChangeTextUnderline, onChangeTextColor, onChangeTextAlign,
      penColor, penWidth, penTaper, onChangePenColor, onChangePenWidth, onChangePenTaper,
      highlighterColor, highlighterWidth, highlighterTaper, onChangeHighlighterColor, onChangeHighlighterWidth, onChangeHighlighterTaper,
    }) {
      if (selectedAnn && selectedAnn.type === "text") {
        const ann = selectedAnn;
        const patch = (p) => onUpdate(ann.id, p);
        return (
          <aside className="ze-format-panel">
            <div className="ze-format-panel-head">Format — Text</div>
            <div className="ze-format-panel-body">
              <div className="ze-format-field">
                <span className="ze-format-label">Font</span>

              </div>

              <label className="ze-format-field">
                <span className="ze-format-label">Size (px)</span>
                <input
                  type="number"
                  className="ze-format-number"
                  min="8"
                  max="200"
                  value={ann.fontSize || 16}
                  onChange={(e) => patch({ fontSize: Number(e.target.value) || 16 })}
                />
              </label>

              <div className="ze-format-field">
                <span className="ze-format-label">Style</span>
                <div className="ze-format-row">
                  <button type="button" className={"ze-format-toggle" + (ann.bold ? " active" : "")} title="Bold" onClick={() => patch({ bold: !ann.bold })}><strong>B</strong></button>
                  <button type="button" className={"ze-format-toggle" + (ann.italic ? " active" : "")} title="Italic" onClick={() => patch({ italic: !ann.italic })}><em>I</em></button>
                  <button type="button" className={"ze-format-toggle" + (ann.underline ? " active" : "")} title="Underline" onClick={() => patch({ underline: !ann.underline })}><span style={{ textDecoration: "underline" }}>U</span></button>
                </div>
              </div>

              <div className="ze-format-field">
                <span className="ze-format-label">Align</span>
                <div className="ze-format-row">
