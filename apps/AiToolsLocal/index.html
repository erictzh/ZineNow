<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ai Tools (Local)</title>
    <!-- Installable app (PWA): shared/js/pwa/register.js adds the manifest link and registers sw.js over http(s). -->
    <meta name="theme-color" content="#171312">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="../../shared/js/pwa/register.js" defer></script>
    <link rel="stylesheet" href="../../shared/styles/tokens.css">
    <link rel="stylesheet" href="../../shared/styles/buttons.css">
    <link rel="stylesheet" href="../../shared/styles/topbar.css">
    <link rel="stylesheet" href="../../shared/styles/numberFields.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
    <nav class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">AI</div>
            <div class="topbar-brand-text">
                <div class="topbar-title">Ai Tools (Local)</div>
                <div class="topbar-subtitle">Runs on this device. Nothing is uploaded. Experimental.</div>
            </div>
        </div>
        <div class="topbar-actions">
            <input type="file" id="file" accept="image/*" hidden>
            <button type="button" class="btn-solid" id="open">Open picture</button>
            <button type="button" id="undo" disabled>Undo</button>
            <button type="button" id="redo" disabled>Redo</button>
            <button type="button" id="compare" disabled title="Hold to see the picture as it was when opened">Hold to compare</button>
            <button type="button" id="save" disabled>Save PNG</button>
            <button type="button" id="send" disabled title="Opens the picture in ZEditor as a new document">Send to ZEditor</button>
        </div>
    </nav>

    <main class="work">
        <aside class="tools" aria-label="Tools">
            <div class="tools-title">Tools</div>
            <div id="tools-list" class="tools-list"></div>
        </aside>

        <div class="center">
            <div class="stage" id="stage">
                <div class="empty" id="empty">
                    <p><b>Open a picture to start</b></p>
                    <p>Open one, drop one here, or paste it (Ctrl+V). Then pick a tool on the left.</p>
                    <button type="button" class="btn-solid" id="empty-open">Open picture</button>
                </div>
                <div class="world" id="world" hidden>
                    <canvas id="orig" hidden></canvas>
                    <canvas id="img"></canvas>
                </div>
            </div>
            <div id="models" hidden></div>
        </div>

        <aside class="panel">
            <div id="tool-panel"></div>
            <p id="status" aria-live="polite">Open a picture to start.</p>
        </aside>
    </main>
</div>
<script src="dist/app.js"></script>
</body>
</html>
